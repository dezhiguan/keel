server:
  port: 8088
keel:
  llm:
    admin-key: ${KEEL_LLM_ADMIN_KEY:}
    redis: ${KEEL_LLM_REDIS:}
    request-defaults: ${KEEL_LLM_REQUEST_DEFAULTS:}
    # 单价缺失或写成 0 时，进程拒绝启动。
    models:
      # 2026-10-18 阿里云百炼华北2（北京）。1M 以内思考与非思考同价：输入 0.8、输出 2.7、缓存命中 0.1 元/百万 tokens。
      "[qwen3.8-flash]":
        max-input-tokens: 991808
        max-output-tokens: 131072
        input-cny-per-token: "0.0000008"
        output-cny-per-token: "0.0000027"
        cache-cny-per-token: "0.0000001"
        price-version: "2026-10-18"
        upstream: ${QWEN_UPSTREAM:https://dashscope.aliyuncs.com/compatible-mode}
        upstream-key: ${QWEN_API_KEY:}
      # DeepSeek 官方 deepseek-flash（DeepSeek-V4.1-Flash-1017）闲时价：缓存未命中输入 $0.15、输出 $0.60、缓存命中 $0.003 / 百万 tokens。忙时为两倍，网关只记闲时这一档。
      # 2026-10-16 央行美元中间价 6.7220，折成人民币：输入 1.0083、输出 4.0332、缓存命中 0.020166 元/百万 tokens。
      deepseek-flash:
        max-input-tokens: 1000000
        max-output-tokens: 384000
        input-cny-per-token: "0.0000010083"
        output-cny-per-token: "0.0000040332"
        cache-cny-per-token: "0.000000020166"
        price-version: "2026-10-18"
        upstream: ${DEEPSEEK_UPSTREAM:https://api.deepseek.com}
        upstream-key: ${DEEPSEEK_API_KEY:}
