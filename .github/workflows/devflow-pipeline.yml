name: Trusted devflow pipeline
run-name: Devflow ${{ inputs.job_id }} ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      environment:
        required: true
        type: choice
        options: [staging, prod]
permissions:
  contents: read
concurrency:
  group: devflow-${{ inputs.job_id }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB_ID: ${{ inputs.job_id }}
      TARGET_ENV: ${{ inputs.environment }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORK_DIR: /tmp/keel-pipeline-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate input
        run: |
          [[ "$JOB_ID" =~ ^DF-[0-9]+$ ]]
          [[ "$TARGET_ENV" == staging || "$TARGET_ENV" == prod ]]
      - name: Configure deployment SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: Export approved immutable snapshot
        run: |
          ssh -T keel-app "mkdir -p '$WORK_DIR'"
          scp services/devflow-pipeline/runner.py services/devflow-pipeline/gate.py "keel-app:$WORK_DIR/"
          ssh -T keel-app "python3 '$WORK_DIR/runner.py' export '$JOB_ID' '$TARGET_ENV' '$WORK_DIR' '$RUN_URL'"
          scp "keel-app:$WORK_DIR/project.tar.gz" project.tar.gz
          scp "keel-app:$WORK_DIR/context.json" context.json
          mkdir candidate
          tar -xzf project.tar.gz -C candidate
      - name: Install released SDK wheel for candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat candidate/.keel-sdk-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p candidate/vendor
          gh release download "sdk-v${version}" --repo "$GITHUB_REPOSITORY" --pattern "keel_sdk-${version}-py3-none-any.whl" --dir candidate/vendor
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          candidate_sha=$(python3 -c 'import json;print(json.load(open("context.json"))["sha"])')
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          image_name="devflow-${JOB_ID,,}"
          pull="${ACR_REGISTRY%/}"
          push="${pull/-vpc./.}"
          echo "server=${push%%/*}" >> "$GITHUB_OUTPUT"
          echo "push=${push}/${image_name}:${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "pull=${pull}/${image_name}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: candidate
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push }}
          secrets: |
            KEEL_GITHUB_TOKEN=${{ github.token }}
      - name: Deploy, evaluate and publish approved environment
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.pull }}@${{ steps.build.outputs.digest }}
        run: |
          [[ "$CANDIDATE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          ssh -T -o ServerAliveInterval=30 keel-app "python3 '$WORK_DIR/runner.py' deploy '$JOB_ID' '$TARGET_ENV' '$WORK_DIR' '$RUN_URL' --image '$CANDIDATE_IMAGE'"
      - name: Record failure
        if: failure()
        run: ssh -T keel-app "test ! -f '$WORK_DIR/context.json' || python3 '$WORK_DIR/runner.py' fail '$JOB_ID' '$TARGET_ENV' '$WORK_DIR' '$RUN_URL'"
