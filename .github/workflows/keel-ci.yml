name: Keel CI
on:
  push:
  pull_request:
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, unit tests and ArchUnit
        run: mvn -q test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generated contract models match schemas
        run: |
          bash scripts/codegen.sh
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard keel-common/src/main/java/com/keel/common/model sdk-python/keel/_generated)"
      - name: Python generated model tests
        run: |
          python -m pip install -e ./sdk-python pytest jsonschema PyYAML
          cd sdk-python && pytest tests/test_generated.py tests/contract -q
      - name: Gateway must stay WebFlux-only
        run: |
          mvn -q -pl :keel-gateway dependency:tree -Dincludes=org.springframework.boot:spring-boot-starter-web,org.springframework:spring-webmvc -DoutputFile=../ci/gateway-dependencies.txt
          test -f ci/gateway-dependencies.txt
          if grep -Eq 'org\.springframework\.boot:spring-boot-starter-web:|org\.springframework:spring-webmvc:' ci/gateway-dependencies.txt; then exit 1; fi
