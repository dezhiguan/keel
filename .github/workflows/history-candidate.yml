name: Cross-session history candidate
on:
  push:
    branches: [fix/cross-session-history-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -pl :keel-server -am test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-verification
          path: keel-server/target/surefire-reports/*.xml
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [keel-server, keel-console]
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        run: bash deploy/ci/resolve-image.sh '${{ matrix.module }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Select build recipe
        id: recipe
        run: |
          if [ '${{ matrix.module }}' = keel-server ]; then
            echo 'file=deploy/docker/service.Dockerfile' >> "$GITHUB_OUTPUT"
          else
            echo 'file=deploy/docker/console.Dockerfile' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.recipe.outputs.file }}
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.push_image }}
          build-args: |
            MODULE=keel-server
            SOURCE_REV=${{ github.sha }}
            RAM_PERCENTAGE=70
      - run: printf '%s\n' '${{ steps.registry.outputs.pull_image }}' > pull-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.module }}-${{ github.sha }}
          path: pull-image.txt
