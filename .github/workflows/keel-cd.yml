name: keel CD

# 一条流水线，前后端分开走。
#
#   后端测试 ─┐
#   后端门禁 ─┴─ 构建 keel-llm ───── 部署 keel-llm ─────┐
#                构建 keel-server ── 部署 keel-server ──┤
#                构建 keel-gateway ─ 部署 keel-gateway ─┤
#                构建 keel-audit ─── 部署 keel-audit ───┴─ 冒烟
#   前端类型检查 ─┐                                      │
#   前端测试 ─────┼─ 前端构建 ─ 构建控制台 ─ 部署控制台 ──┘
#   前端门禁 ─────┘
#
# 只测试和发布本次改动影响到的服务。公共代码（keel-common、父 pom、构建脚本）才让四个后端一起走。
# 镜像只在推 main 之后构建。pull request 停在测试和门禁。手动触发会四个后端和前端都走一遍。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: keel-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    outputs:
      llm: ${{ steps.scope.outputs.llm }}
      server: ${{ steps.scope.outputs.server }}
      gateway: ${{ steps.scope.outputs.gateway }}
      audit: ${{ steps.scope.outputs.audit }}
      console: ${{ steps.scope.outputs.console }}
      echo: ${{ steps.scope.outputs.echo }}
      sandbox: ${{ steps.scope.outputs.sandbox }}
      qa_agent: ${{ steps.scope.outputs.qa_agent }}
      qa_mainflow: ${{ steps.scope.outputs.qa_mainflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 读取最后一次完整部署快照
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=keel-deployed-snapshot&per_page=100" | jq -r '[.[].artifacts[] | select(.name == "keel-deployed-snapshot" and .expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | max_by(.created_at) | .workflow_run.head_sha // ""')
          if [ -n "${deployed}" ]; then
            [[ "${deployed}" =~ ^[0-9a-f]{40}$ ]] || { echo "部署快照SHA无效"; exit 1; }
          else
            deployed=ALL
          fi
          echo "DEPLOY_BASE_SHA=${deployed}" >> "$GITHUB_ENV"
          echo "部署比较起点：${deployed}"
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: bash ci/changed-services.sh

  test-llm:
    name: 测试 keel-llm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.llm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -pl :keel-llm -am test

  test-server:
    name: 测试 keel-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -pl :keel-server -am test

  test-sandbox:
    name: 测试研发沙箱
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.sandbox == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ./sdk-python pytest
      - run: PYTHONPATH="$PWD/services/sandbox-sidecar" pytest services/sandbox-sidecar/test_sidecar.py -q

  build-sandbox:
    name: 构建研发沙箱
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, test-sandbox]
    if: needs.changes.outputs.sandbox == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh keel-sandbox
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sandbox-sidecar/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}

  test-gateway:
    name: 测试 keel-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -pl :keel-gateway -am test

  test-audit:
    name: 测试 keel-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.audit == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -pl :keel-audit -am test

  backend-gate:
    name: 后端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.llm == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.audit == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/backend-gate.sh

  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.console == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 安装并做类型检查
        working-directory: console
        run: npm ci && npm run typecheck

  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.console == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 安装并跑 vitest
        working-directory: console
        run: npm ci && npm test

  frontend-gate:
    name: 前端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.console == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/frontend-gate.sh

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, frontend-typecheck, frontend-test, frontend-gate]
    if: needs.changes.outputs.console == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 生产构建
        working-directory: console
        run: npm ci && npm run build
      - name: 产物里要有页面和静态资源
        working-directory: console
        run: |
          test -s dist/index.html
          grep -q 'Keel 控制台' dist/index.html
          grep -q '/assets/' dist/index.html

  build-llm:
    name: 构建 keel-llm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-llm, backend-gate]
    if: needs.changes.outputs.llm == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-llm
          ram: "60.0"

  build-server:
    name: 构建 keel-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-server, backend-gate]
    if: needs.changes.outputs.server == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-server
          ram: "70.0"

  build-gateway:
    name: 构建 keel-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-gateway, backend-gate]
    if: needs.changes.outputs.gateway == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-gateway
          ram: "70.0"

  build-audit:
    name: 构建 keel-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-audit, backend-gate]
    if: needs.changes.outputs.audit == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-audit
          ram: "70.0"

  build-console:
    name: 构建控制台
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, frontend-build]
    if: needs.changes.outputs.console == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh keel-console
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/console.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}
          cache-from: type=gha,scope=keel-console
          cache-to: type=gha,scope=keel-console,mode=max

  build-echo:
    name: 构建 echo-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.echo == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh echo-agent
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/echo-agent.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}

  test-qa-agent:
    name: 测试生命周期验收智能体
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.qa_agent == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ./sdk-python 'langfuse==4.17.0' pytest
      - run: PYTHONPATH="$PWD/sdk-python" pytest agents/qa-lifecycle-1016/tests -q

  build-qa-agent:
    name: 构建生命周期验收智能体
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test-qa-agent]
    if: needs.changes.outputs.qa_agent == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh qa-lifecycle-1016
      - name: Stage SDK wheel
        run: |
          scripts/build-template-wheel.sh
          mkdir -p agents/qa-lifecycle-1016/vendor
          cp sdk-python/dist/keel_sdk-*.whl agents/qa-lifecycle-1016/vendor/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: agents/qa-lifecycle-1016
          file: agents/qa-lifecycle-1016/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}

  deploy-qa-agent:
    name: 部署生命周期验收智能体
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-qa-agent, deploy-server]
    if: >-
      always() &&
      needs.changes.outputs.qa_agent == 'true' &&
      needs.build-qa-agent.result == 'success' &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布独立镜像
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          KEEL_NAMESPACE: agents
        run: bash deploy/ci/rollout-service.sh qa-lifecycle-1016 deploy/k3s/services/qa-lifecycle-1016.yaml PLACEHOLDER_QA_AGENT_IMAGE keel-qa-lifecycle-1016

  test-qa-mainflow:
    name: 测试五个主流程智能体
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.qa_mainflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ./sdk-python 'langfuse==4.17.0' pytest
      - run: PYTHONPATH="$PWD/sdk-python" pytest agents/qa-mainflow/tests -q

  build-qa-mainflow:
    name: 构建五个主流程智能体镜像
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, test-qa-mainflow]
    if: needs.changes.outputs.qa_mainflow == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh qa-mainflow
      - name: Stage SDK wheel
        run: |
          scripts/build-template-wheel.sh
          mkdir -p agents/qa-mainflow/vendor
          cp sdk-python/dist/keel_sdk-*.whl agents/qa-mainflow/vendor/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: agents/qa-mainflow
          file: agents/qa-mainflow/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}

  deploy-qa-mainflow:
    name: 部署主流程验收智能体
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-qa-mainflow, deploy-server]
    if: >-
      always() &&
      needs.changes.outputs.qa_mainflow == 'true' &&
      needs.build-qa-mainflow.result == 'success' &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布五个服务
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          KEEL_NAMESPACE: agents
          KEEL_IMAGE_NAME: qa-mainflow
        run: |
          agents=$(python3 -c 'import json; print(" ".join(json.load(open("agents/qa-mainflow/profiles.json"))))')
          for attempt in $(seq 1 90); do
            missing=$(ssh -T -o BatchMode=yes keel-app "for agent in ${agents}; do kubectl -n agents get secret \"keel-\${agent}\" >/dev/null 2>&1 || echo \"\${agent}\"; done")
            if [ -z "${missing}" ]; then break; fi
            sleep 10
          done
          if [ -n "${missing}" ]; then echo "等待智能体注册生成 Secret 超时：${missing}"; exit 1; fi
          for agent in ${agents}; do
            KEEL_AGENT_NAME="${agent}" KEEL_MANIFEST_OUTPUT="/tmp/${agent}-agent.yaml" python3 agents/qa-mainflow/manifest.py
            scp -F ~/.ssh/config "/tmp/${agent}-agent.yaml" "keel-app:/tmp/${agent}-agent.yaml"
            ssh -T -o BatchMode=yes keel-app "kubectl -n agents create configmap qa-mainflow-${agent}-manifest --from-file=agent.yaml=/tmp/${agent}-agent.yaml --dry-run=client -o yaml | kubectl apply -f -"
            agent_env=$(python3 -c 'import json,sys; print(json.load(open("agents/qa-mainflow/profiles.json"))[sys.argv[1]].get("env", "dev"))' "${agent}")
            sed -e "s/PLACEHOLDER_AGENT/${agent}/g" -e "s/PLACEHOLDER_QA_ENV/${agent_env}/g" deploy/k3s/services/qa-mainflow.yaml.tpl > "/tmp/${agent}-template.yaml"
            bash deploy/ci/rollout-service.sh "${agent}" "/tmp/${agent}-template.yaml" PLACEHOLDER_QA_MAINFLOW_IMAGE "keel-${agent}"
          done

  deploy-echo:
    name: 部署 echo-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-echo, deploy-server]
    if: >-
      always() &&
      needs.changes.outputs.echo == 'true' &&
      needs.build-echo.result == 'success' &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 echo-agent
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh echo-agent deploy/k3s/services/echo-agent.yaml PLACEHOLDER_ECHO_IMAGE

  build-git-ci:
    name: 构建 git-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.echo == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh git-ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/git-ci.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}

  deploy-git-ci:
    name: 部署 git-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-git-ci, deploy-server]
    if: >-
      always() &&
      needs.changes.outputs.echo == 'true' &&
      needs.build-git-ci.result == 'success' &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 git-ci
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh git-ci deploy/k3s/services/git-ci.yaml PLACEHOLDER_GIT_CI_IMAGE git-ci-github

  deploy-chat-demo:
    name: 部署 chat-demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-echo, deploy-echo]
    if: >-
      always() &&
      needs.changes.outputs.echo == 'true' &&
      needs.build-echo.result == 'success' &&
      (needs.deploy-echo.result == 'success' || needs.deploy-echo.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 用同一份 echo-agent 镜像发布 chat-demo
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          tag="${GITHUB_SHA::12}"
          pull="${ACR_REGISTRY%/}"
          sed "s|PLACEHOLDER_ECHO_IMAGE|${pull}/echo-agent:${tag}|" deploy/k3s/services/chat-demo.yaml > /tmp/chat-demo.yaml
          grep -q "PLACEHOLDER_" /tmp/chat-demo.yaml && { echo "镜像占位符未被替换"; exit 1; }
          scp -F ~/.ssh/config /tmp/chat-demo.yaml keel-app:/tmp/chat-demo.yaml
          password_b64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 keel-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${password_b64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace keel-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n keel-system create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/chat-demo.yaml
          if ! kubectl -n keel-system rollout status deployment/chat-demo --timeout=180s; then
            set +e
            status="$(kubectl -n keel-system get pods -l app=chat-demo -o wide 2>&1 | tr '\n' '; ')"
            events="$(kubectl -n keel-system get events --sort-by=.lastTimestamp 2>&1 | tail -n 8 | tr '\n' '; ')"
            log="$(kubectl -n keel-system logs -l app=chat-demo --tail=15 --all-containers 2>&1 | tr '\n' ' ' | cut -c1-400)"
            echo "::error title=chat-demo not ready::${status} EVENTS ${events} LOG ${log}"
            exit 1
          fi
          rm -f /tmp/chat-demo.yaml
          EOF

  deploy-llm:
    name: 部署 keel-llm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-llm]
    if: needs.changes.outputs.llm == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-llm
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-llm deploy/k3s/services/keel-llm.yaml PLACEHOLDER_LLM_IMAGE keel-llm keel-llm-vendors

  deploy-server:
    name: 部署 keel-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-server, build-sandbox]
    if: needs.changes.outputs.server == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-server
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          sandbox_image="${ACR_REGISTRY%/}/keel-sandbox:${GITHUB_SHA::12}"
          sed "s|PLACEHOLDER_SANDBOX_IMAGE|${sandbox_image}|" deploy/k3s/services/keel-server.yaml > /tmp/keel-server-sandbox.yaml
          bash deploy/ci/rollout-service.sh keel-server /tmp/keel-server-sandbox.yaml PLACEHOLDER_SERVER_IMAGE keel-server
          bash deploy/ci/prepare-sandbox.sh

  deploy-gateway:
    name: 部署 keel-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-gateway]
    if: needs.changes.outputs.gateway == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-gateway
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-gateway deploy/k3s/services/keel-gateway.yaml PLACEHOLDER_GATEWAY_IMAGE

  deploy-audit:
    name: 部署 keel-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-audit]
    if: needs.changes.outputs.audit == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-audit
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-audit deploy/k3s/services/keel-audit.yaml PLACEHOLDER_AUDIT_IMAGE

  deploy-frontend:
    name: 部署控制台
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-console, deploy-server, deploy-llm, deploy-gateway, deploy-audit]
    if: >-
      always() &&
      needs.changes.outputs.console == 'true' &&
      needs.build-console.result == 'success' &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      (needs.changes.outputs.llm != 'true' || needs.deploy-llm.result == 'success') &&
      (needs.changes.outputs.gateway != 'true' || needs.deploy-gateway.result == 'success') &&
      (needs.changes.outputs.audit != 'true' || needs.deploy-audit.result == 'success') &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布控制台
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          tag="${GITHUB_SHA::12}"
          pull="${ACR_REGISTRY%/}"
          sed \
            -e "s|PLACEHOLDER_CONSOLE_IMAGE|${pull}/keel-console:${tag}|" \
            deploy/k3s/console.yaml > /tmp/keel-console.yaml
          grep -q "PLACEHOLDER_" /tmp/keel-console.yaml && { echo "镜像占位符未被替换"; exit 1; }
          scp -F ~/.ssh/config /tmp/keel-console.yaml keel-app:/tmp/keel-console.yaml
          password_b64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 keel-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${password_b64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace keel-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n keel-system create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/keel-console.yaml
          kubectl -n keel-system rollout status deployment/keel-console --timeout=180s
          rm -f /tmp/keel-console.yaml
          EOF

  smoke-test:
    name: 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, deploy-llm, deploy-server, deploy-gateway, deploy-audit, deploy-frontend]
    if: >-
      !cancelled() &&
      (needs.deploy-llm.result == 'success' || needs.deploy-server.result == 'success' || needs.deploy-gateway.result == 'success' || needs.deploy-audit.result == 'success' || needs.deploy-frontend.result == 'success') &&
      (needs.changes.outputs.llm != 'true' || needs.deploy-llm.result == 'success') &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      (needs.changes.outputs.gateway != 'true' || needs.deploy-gateway.result == 'success') &&
      (needs.changes.outputs.audit != 'true' || needs.deploy-audit.result == 'success') &&
      (needs.changes.outputs.console != 'true' || needs.deploy-frontend.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 只检查本次部署的服务
        env:
          SMOKE_LLM: ${{ needs.deploy-llm.result == 'success' }}
          SMOKE_SERVER: ${{ needs.deploy-server.result == 'success' }}
          SMOKE_GATEWAY: ${{ needs.deploy-gateway.result == 'success' }}
          SMOKE_AUDIT: ${{ needs.deploy-audit.result == 'success' }}
          SMOKE_CONSOLE: ${{ needs.deploy-frontend.result == 'success' }}
        run: bash deploy/ci/smoke.sh

  test-meta-agent:
    name: 测试元智能体闭环
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.echo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e './sdk-python[eval]' pytest
      - run: PYTHONPATH="$PWD/sdk-python" pytest agents/meta-agent/tests -q
      - run: PYTHONPATH="$PWD/sdk-python" pytest sdk-python/tests/test_run_concurrency.py sdk-python/tests/test_resume_trace.py sdk-python/tests/skills sdk-python/tests/eval -q
      - run: PYTHONPATH="$PWD/services/git-ci:$PWD/sdk-python" pytest services/git-ci/tests -q
      - run: PYTHONPATH="$PWD/sdk-python" pytest sdk-python/tests/cli/test_ledger.py sdk-python/tests/cli/test_repo.py -q

  build-meta-agent:
    name: 构建 meta-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test-meta-agent]
    if: needs.changes.outputs.echo == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh meta-agent
      - name: Stage the SDK wheel into the agent build context
        run: |
          scripts/build-template-wheel.sh
          rm -rf agents/meta-agent/vendor
          mkdir -p agents/meta-agent/vendor
          cp sdk-python/dist/keel_sdk-*.whl agents/meta-agent/vendor/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: agents/meta-agent
          file: agents/meta-agent/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}


  deploy-meta-agent:
    name: 部署 meta-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-meta-agent, deploy-server]
    if: >-
      always() &&
      needs.changes.outputs.echo == 'true' &&
      needs.build-meta-agent.result == 'success' &&
      (needs.changes.outputs.server != 'true' || needs.deploy-server.result == 'success') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 准备元智能体逻辑网关与服务身份
        run: |
          scp -F ~/.ssh/config agents/meta-agent/ops/bootstrap_runtime.py keel-app:/tmp/keel-meta-bootstrap-runtime.py
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 keel-app python3 /tmp/keel-meta-bootstrap-runtime.py --apply
      - name: 发布 meta-agent
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh meta-agent deploy/k3s/services/meta-agent.yaml PLACEHOLDER_META_AGENT_IMAGE keel-meta-agent keel-meta-bridge git-ci-github

  record-deployment:
    name: 记录完整部署快照
    runs-on: ubuntu-latest
    needs: [changes, smoke-test, deploy-qa-agent, deploy-qa-mainflow, deploy-echo, deploy-git-ci, deploy-chat-demo, deploy-meta-agent]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.smoke-test.result == 'success' ||
        (needs.smoke-test.result == 'skipped' && needs.changes.outputs.llm != 'true' &&
         needs.changes.outputs.server != 'true' && needs.changes.outputs.gateway != 'true' &&
         needs.changes.outputs.audit != 'true' && needs.changes.outputs.console != 'true')) &&
      (needs.changes.outputs.qa_agent != 'true' || needs.deploy-qa-agent.result == 'success') &&
      (needs.changes.outputs.qa_mainflow != 'true' || needs.deploy-qa-mainflow.result == 'success') &&
      (needs.changes.outputs.echo != 'true' ||
        (needs.deploy-echo.result == 'success' && needs.deploy-git-ci.result == 'success' &&
         needs.deploy-chat-demo.result == 'success' && needs.deploy-meta-agent.result == 'success'))
    steps:
      - name: 写入部署版本
        run: printf '%s\n' "$GITHUB_SHA" > deployed-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-deployed-snapshot
          path: deployed-sha.txt
          if-no-files-found: error
