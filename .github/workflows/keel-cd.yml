name: keel CD

# 一条流水线，前后端分开走。
#
#   后端测试 ─┐
#   后端门禁 ─┴─ 构建 keel-llm ───── 部署 keel-llm ─────┐
#                构建 keel-server ── 部署 keel-server ──┤
#                构建 keel-gateway ─ 部署 keel-gateway ─┤
#                构建 keel-audit ─── 部署 keel-audit ───┴─ 冒烟
#   前端类型检查 ─┐                                      │
#   前端测试 ─────┼─ 前端构建 ─ 构建控制台 ─ 部署控制台 ──┘
#   前端门禁 ─────┘
#
# 镜像只在推 main 之后构建。pull request 停在测试和门禁。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keel-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 四个后端模块
        run: mvn -pl :keel-llm,:keel-server,:keel-gateway,:keel-audit -am test

  backend-gate:
    name: 后端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/backend-gate.sh

  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 安装并做类型检查
        working-directory: console
        run: npm ci && npm run typecheck

  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 安装并跑 vitest
        working-directory: console
        run: npm ci && npm test

  frontend-gate:
    name: 前端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/frontend-gate.sh

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-typecheck, frontend-test, frontend-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 生产构建
        working-directory: console
        run: npm ci && npm run build
      - name: 产物里要有页面和静态资源
        working-directory: console
        run: |
          test -s dist/index.html
          grep -q 'Keel 控制台' dist/index.html
          grep -q '/assets/' dist/index.html

  build-llm:
    name: 构建 keel-llm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test, backend-gate]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-llm
          ram: "60.0"

  build-server:
    name: 构建 keel-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test, backend-gate]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-server
          ram: "70.0"

  build-gateway:
    name: 构建 keel-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test, backend-gate]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-gateway
          ram: "70.0"

  build-audit:
    name: 构建 keel-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test, backend-gate]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-java
        with:
          service: keel-audit
          ram: "70.0"

  build-console:
    name: 构建控制台
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend-build]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh keel-console
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/console.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}
          cache-from: type=gha,scope=keel-console
          cache-to: type=gha,scope=keel-console,mode=max

  deploy-llm:
    name: 部署 keel-llm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-llm]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-llm
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-llm deploy/k3s/services/keel-llm.yaml PLACEHOLDER_LLM_IMAGE keel-llm keel-llm-vendors

  deploy-server:
    name: 部署 keel-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-server]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-server
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-server deploy/k3s/services/keel-server.yaml PLACEHOLDER_SERVER_IMAGE keel-server

  deploy-gateway:
    name: 部署 keel-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-gateway]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-gateway
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-gateway deploy/k3s/services/keel-gateway.yaml PLACEHOLDER_GATEWAY_IMAGE

  deploy-audit:
    name: 部署 keel-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-audit]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-audit
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash deploy/ci/rollout-service.sh keel-audit deploy/k3s/services/keel-audit.yaml PLACEHOLDER_AUDIT_IMAGE

  deploy-frontend:
    name: 部署控制台
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-console]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布控制台
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          tag="${GITHUB_SHA::12}"
          pull="${ACR_REGISTRY%/}"
          sed \
            -e "s|PLACEHOLDER_CONSOLE_IMAGE|${pull}/keel-console:${tag}|" \
            deploy/k3s/console.yaml > /tmp/keel-console.yaml
          grep -q "PLACEHOLDER_" /tmp/keel-console.yaml && { echo "镜像占位符未被替换"; exit 1; }
          scp -F ~/.ssh/config /tmp/keel-console.yaml keel-app:/tmp/keel-console.yaml
          password_b64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 keel-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${password_b64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace keel-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n keel-system create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/keel-console.yaml
          kubectl -n keel-system rollout status deployment/keel-console --timeout=180s
          rm -f /tmp/keel-console.yaml
          EOF

  smoke-test:
    name: 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-llm, deploy-server, deploy-gateway, deploy-audit, deploy-frontend]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 页面、接口和集群内的薄网关
        run: |
          set -euo pipefail
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" keel-app \
            'curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 http://127.0.0.1:31110/' \
            > /tmp/keel-index.html
          grep -q 'Keel 控制台' /tmp/keel-index.html
          grep -q '/assets/' /tmp/keel-index.html
          ssh "${SSH_OPTS[@]}" keel-app \
            'curl --fail --silent --show-error --max-time 10 http://127.0.0.1:31110/api/v1/catalog' \
            > /tmp/keel-catalog.json
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/keel-catalog.json"))
          assert body["code"] == "OK", body
          assert body["data"]["templates"], body
          print("catalog ok")
          PY
          for svc in keel-llm keel-gateway keel-audit keel-server; do
            type="$(ssh "${SSH_OPTS[@]}" keel-app \
              "kubectl -n keel-system get svc ${svc} -o jsonpath='{.spec.type}'")"
            test "${type}" = "ClusterIP"
          done
          ssh "${SSH_OPTS[@]}" keel-app 'bash -s' > /tmp/keel-llm-health.json <<'EOF'
          set -euo pipefail
          IP="$(kubectl -n keel-system get svc keel-llm -o jsonpath='{.spec.clusterIP}')"
          curl --fail --silent --show-error --max-time 10 "http://${IP}:8088/health"
          EOF
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/keel-llm-health.json"))
          assert body["status"] == "up", body
          print("keel-llm health ok")
          PY
