name: keel CD

# 与 askdb 同机（Server 3 的 k3s），经跳板机上机，复用 CareerMate 的 SSH 与 ACR。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keel-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Module tests
        run: mvn -pl :keel-llm,:keel-server -am test

  console:
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build
        working-directory: console
        run: npm ci && npm run build

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, console]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          if [[ -z "${ACR_REGISTRY}" ]]; then
            echo "ACR_REGISTRY must be set"; exit 1
          fi
          PULL_REGISTRY="${ACR_REGISTRY%/}"
          PUSH_REGISTRY="${ACR_PUBLIC_REGISTRY:-${PULL_REGISTRY/-vpc./.}}"
          TAG="${GITHUB_SHA::12}"
          echo "server=${PUSH_REGISTRY%%/*}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "llm=${PUSH_REGISTRY}/keel-llm:${TAG}" >> "${GITHUB_OUTPUT}"
          echo "server_image=${PUSH_REGISTRY}/keel-server:${TAG}" >> "${GITHUB_OUTPUT}"
          echo "console=${PUSH_REGISTRY}/keel-console:${TAG}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push keel-llm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.llm }}
          build-args: |
            MODULE=keel-llm
            JAR=keel-llm/target/keel-llm-0.1.0-SNAPSHOT.jar
            RAM_PERCENTAGE=60.0
          cache-from: type=gha,scope=keel-llm
          cache-to: type=gha,scope=keel-llm,mode=max

      - name: Build and push keel-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.server_image }}
          build-args: |
            MODULE=keel-server
            JAR=keel-server/target/keel-server-0.1.0-SNAPSHOT.jar
            RAM_PERCENTAGE=70.0
          cache-from: type=gha,scope=keel-server
          cache-to: type=gha,scope=keel-server,mode=max

      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/console.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.console }}
          cache-from: type=gha,scope=keel-console
          cache-to: type=gha,scope=keel-console,mode=max

  deploy:
    name: deploy-k3s-server3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-push]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH (Server 3, via jump host)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_APP_SSH_KEY and CAREERMATE_APP_HOST must be set"; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          ssh-keyscan "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host keel-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' '  User root'
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' 'Host keel-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' '  User root'
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ProxyJump keel-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Apply manifest on Server 3
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          TAG="${GITHUB_SHA::12}"
          PULL="${ACR_REGISTRY%/}"
          LLM="${PULL}/keel-llm:${TAG}"
          SERVER="${PULL}/keel-server:${TAG}"
          CONSOLE="${PULL}/keel-console:${TAG}"
          echo "将部署镜像 tag: ${TAG}"
          sed \
            -e "s|PLACEHOLDER_LLM_IMAGE|${LLM}|" \
            -e "s|PLACEHOLDER_SERVER_IMAGE|${SERVER}|" \
            -e "s|PLACEHOLDER_CONSOLE_IMAGE|${CONSOLE}|" \
            deploy/k3s/keel.yaml > /tmp/keel.rendered.yaml
          grep -q "PLACEHOLDER_" /tmp/keel.rendered.yaml && { echo "镜像占位符未被替换"; exit 1; }
          scp -F ~/.ssh/config /tmp/keel.rendered.yaml keel-app:/tmp/keel.yaml
          ACR_PASSWORD_B64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          timeout 15m ssh "${SSH_OPTS[@]}" keel-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${ACR_PASSWORD_B64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace keel-system --dry-run=client -o yaml | kubectl apply -f -
          for name in keel-llm keel-llm-vendors keel-server; do
            if ! kubectl -n keel-system get secret "${name}" >/dev/null 2>&1; then
              echo "缺少 Secret ${name}。按 deploy/README.md 在 Server 3 上建好再重跑。"
              exit 1
            fi
          done
          kubectl -n keel-system create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/keel.yaml
          kubectl -n keel-system rollout status deployment/keel-llm --timeout=180s
          kubectl -n keel-system rollout status deployment/keel-server --timeout=180s
          kubectl -n keel-system rollout status deployment/keel-console --timeout=180s
          rm -f /tmp/keel.yaml
          EOF

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Configure SSH (Server 3, via jump host)
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: |
          if [[ -z "${SSH_KEY}" || -z "${DEPLOY_HOST}" ]]; then
            echo "CAREERMATE_APP_SSH_KEY and CAREERMATE_APP_HOST must be set"; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          JUMP_HOST="${JUMP_HOST:-8.163.63.222}"
          ssh-keyscan "${JUMP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            printf '%s\n' 'Host keel-jump'
            printf '%s\n' "  HostName ${JUMP_HOST}"
            printf '%s\n' '  User root'
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' 'Host keel-app'
            printf '%s\n' "  HostName ${DEPLOY_HOST}"
            printf '%s\n' '  User root'
            printf '%s\n' '  IdentityFile ~/.ssh/deploy_key'
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking accept-new'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  ProxyJump keel-jump'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Console, API, and in-cluster gateway
        run: |
          set -euo pipefail
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" keel-app \
            'curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 http://127.0.0.1:31110/' \
            > /tmp/keel-index.html
          grep -q 'Keel 控制台' /tmp/keel-index.html
          grep -q '/assets/' /tmp/keel-index.html
          ssh "${SSH_OPTS[@]}" keel-app \
            'curl --fail --silent --show-error --max-time 10 http://127.0.0.1:31110/api/v1/catalog' \
            > /tmp/keel-catalog.json
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/keel-catalog.json"))
          assert body["code"] == "OK", body
          assert body["data"]["templates"], body
          print("catalog ok")
          PY
          TYPE="$(ssh "${SSH_OPTS[@]}" keel-app \
            "kubectl -n keel-system get svc keel-llm -o jsonpath='{.spec.type}'")"
          test "${TYPE}" = "ClusterIP"
          ssh "${SSH_OPTS[@]}" keel-app 'bash -s' > /tmp/keel-llm-health.json <<'EOF'
          set -euo pipefail
          IP="$(kubectl -n keel-system get svc keel-llm -o jsonpath='{.spec.clusterIP}')"
          curl --fail --silent --show-error --max-time 10 "http://${IP}:8088/health"
          EOF
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/keel-llm-health.json"))
          assert body["status"] == "up", body
          print("keel-llm health ok")
          PY
