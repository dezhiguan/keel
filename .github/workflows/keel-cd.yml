name: keel CD

# 一条流水线，前后端分开走。
#
#   后端测试 ─┐
#   后端门禁 ─┴─ 构建 keel-llm ──┐
#                构建 keel-server ┴─ 部署后端 ──┐
#   前端类型检查 ─┐                              ├─ 冒烟
#   前端测试 ─────┼─ 前端构建 ─ 构建控制台 ─ 部署控制台 ┘
#   前端门禁 ─────┘
#
# 镜像只在推 main 之后构建。pull request 停在测试和门禁。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keel-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: keel-llm 与 keel-server
        run: mvn -pl :keel-llm,:keel-server -am test

  backend-gate:
    name: 后端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/backend-gate.sh

  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 安装并做类型检查
        working-directory: console
        run: npm ci && npm run typecheck

  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 安装并跑 vitest
        working-directory: console
        run: npm ci && npm test

  frontend-gate:
    name: 前端门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/frontend-gate.sh

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-typecheck, frontend-test, frontend-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: 生产构建
        working-directory: console
        run: npm ci && npm run build
      - name: 产物里要有页面和静态资源
        working-directory: console
        run: |
          test -s dist/index.html
          grep -q 'Keel 控制台' dist/index.html
          grep -q '/assets/' dist/index.html

  build-llm:
    name: 构建 keel-llm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test, backend-gate]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh keel-llm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}
          build-args: |
            MODULE=keel-llm
            JAR=keel-llm/target/keel-llm-0.1.0-SNAPSHOT.jar
            RAM_PERCENTAGE=60.0
          cache-from: type=gha,scope=keel-llm
          cache-to: type=gha,scope=keel-llm,mode=max

  build-server:
    name: 构建 keel-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test, backend-gate]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh keel-server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}
          build-args: |
            MODULE=keel-server
            JAR=keel-server/target/keel-server-0.1.0-SNAPSHOT.jar
            RAM_PERCENTAGE=70.0
          cache-from: type=gha,scope=keel-server
          cache-to: type=gha,scope=keel-server,mode=max

  build-console:
    name: 构建控制台
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend-build]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: bash deploy/ci/resolve-image.sh keel-console
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/console.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.push_image }}
          cache-from: type=gha,scope=keel-console
          cache-to: type=gha,scope=keel-console,mode=max

  deploy-backend:
    name: 部署后端
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-llm, build-server]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布 keel-llm 与 keel-server
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          tag="${GITHUB_SHA::12}"
          pull="${ACR_REGISTRY%/}"
          sed \
            -e "s|PLACEHOLDER_LLM_IMAGE|${pull}/keel-llm:${tag}|" \
            -e "s|PLACEHOLDER_SERVER_IMAGE|${pull}/keel-server:${tag}|" \
            deploy/k3s/backend.yaml > /tmp/keel-backend.yaml
          grep -q "PLACEHOLDER_" /tmp/keel-backend.yaml && { echo "镜像占位符未被替换"; exit 1; }
          scp -F ~/.ssh/config /tmp/keel-backend.yaml keel-app:/tmp/keel-backend.yaml
          password_b64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 keel-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${password_b64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace keel-system --dry-run=client -o yaml | kubectl apply -f -
          for name in keel-llm keel-llm-vendors keel-server; do
            if ! kubectl -n keel-system get secret "${name}" >/dev/null 2>&1; then
              echo "缺少 Secret ${name}。按 deploy/README.md 在 Server 3 上建好再重跑。"
              exit 1
            fi
          done
          kubectl -n keel-system create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/keel-backend.yaml
          kubectl -n keel-system rollout status deployment/keel-llm --timeout=180s
          kubectl -n keel-system rollout status deployment/keel-server --timeout=180s
          rm -f /tmp/keel-backend.yaml
          EOF

  deploy-frontend:
    name: 部署控制台
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-console]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 发布控制台
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ACR_REGISTRY}" ]]; then echo "ACR_REGISTRY must be set"; exit 1; fi
          tag="${GITHUB_SHA::12}"
          pull="${ACR_REGISTRY%/}"
          sed \
            -e "s|PLACEHOLDER_CONSOLE_IMAGE|${pull}/keel-console:${tag}|" \
            deploy/k3s/console.yaml > /tmp/keel-console.yaml
          grep -q "PLACEHOLDER_" /tmp/keel-console.yaml && { echo "镜像占位符未被替换"; exit 1; }
          scp -F ~/.ssh/config /tmp/keel-console.yaml keel-app:/tmp/keel-console.yaml
          password_b64="$(printf '%s' "${ACR_PASSWORD}" | base64 -w0)"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 keel-app \
            "ACR_REGISTRY='${ACR_REGISTRY}' ACR_USERNAME='${ACR_USERNAME}' ACR_PASSWORD_B64='${password_b64}' bash -s" <<'EOF'
          set -euo pipefail
          ACR_PASSWORD="$(printf '%s' "${ACR_PASSWORD_B64}" | base64 -d)"
          kubectl create namespace keel-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n keel-system create secret docker-registry acr-cred \
            --docker-server="${ACR_REGISTRY%%/*}" \
            --docker-username="${ACR_USERNAME}" \
            --docker-password="${ACR_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/keel-console.yaml
          kubectl -n keel-system rollout status deployment/keel-console --timeout=180s
          rm -f /tmp/keel-console.yaml
          EOF

  smoke-test:
    name: 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-backend, deploy-frontend]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: 页面、接口和集群内的薄网关
        run: |
          set -euo pipefail
          SSH_OPTS=(-T -o BatchMode=yes -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" keel-app \
            'curl --fail --silent --show-error --max-time 10 --retry 6 --retry-delay 5 http://127.0.0.1:31110/' \
            > /tmp/keel-index.html
          grep -q 'Keel 控制台' /tmp/keel-index.html
          grep -q '/assets/' /tmp/keel-index.html
          ssh "${SSH_OPTS[@]}" keel-app \
            'curl --fail --silent --show-error --max-time 10 http://127.0.0.1:31110/api/v1/catalog' \
            > /tmp/keel-catalog.json
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/keel-catalog.json"))
          assert body["code"] == "OK", body
          assert body["data"]["templates"], body
          print("catalog ok")
          PY
          type="$(ssh "${SSH_OPTS[@]}" keel-app \
            "kubectl -n keel-system get svc keel-llm -o jsonpath='{.spec.type}'")"
          test "${type}" = "ClusterIP"
          ssh "${SSH_OPTS[@]}" keel-app 'bash -s' > /tmp/keel-llm-health.json <<'EOF'
          set -euo pipefail
          IP="$(kubectl -n keel-system get svc keel-llm -o jsonpath='{.spec.clusterIP}')"
          curl --fail --silent --show-error --max-time 10 "http://${IP}:8088/health"
          EOF
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/keel-llm-health.json"))
          assert body["status"] == "up", body
          print("keel-llm health ok")
          PY
