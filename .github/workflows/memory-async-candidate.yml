name: Async session memory candidate
on:
  push:
    branches: [feat/async-session-memory-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -pl :keel-server -am test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: console
      - name: Record verification
        run: echo 'Platform tests and console checks completed; reports remain in job logs.' >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [keel-server, keel-console]
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        run: bash deploy/ci/resolve-image.sh '${{ matrix.module }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Select build recipe
        id: recipe
        run: |
          if [ '${{ matrix.module }}' = keel-server ]; then
            echo 'file=deploy/docker/service.Dockerfile' >> "$GITHUB_OUTPUT"
          else
            echo 'file=deploy/docker/console.Dockerfile' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.recipe.outputs.file }}
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.push_image }}
          build-args: |
            MODULE=keel-server
            SOURCE_REV=${{ github.sha }}
            RAM_PERCENTAGE=70
      - name: Record deployable image
        run: echo '${{ matrix.module }} = ${{ steps.registry.outputs.pull_image }}' >> "$GITHUB_STEP_SUMMARY"
