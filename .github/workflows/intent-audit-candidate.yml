name: Intent routing audit candidate
on:
  push:
    branches: [feat/intent-routing-20261025]
    paths: ['keel-audit/**', '.github/workflows/intent-audit-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -pl :keel-audit -am test
      - id: registry
        run: bash deploy/ci/resolve-image.sh keel-audit
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.push_image }}
          build-args: |
            MODULE=keel-audit
            SOURCE_REV=${{ github.sha }}
            RAM_PERCENTAGE=70
      - run: echo 'keel-audit = ${{ steps.registry.outputs.pull_image }}' >> "$GITHUB_STEP_SUMMARY"
