name: Assistant gate staging operations
on:
  push:
    branches: [fix/assistant-gate-ops-20261028]
    paths: ['.github/workflows/assistant-gate-ops.yml']
permissions:
  contents: read
concurrency:
  group: assistant-gate-staging-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing deployment connection
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: Inspect staging evaluator failures and deployment
        run: |
          ssh -T keel-app 'bash -s' <<'REMOTE'
          set -eu
          pod=$(kubectl -n agents get pod -l app=keel-assistant -o jsonpath='{.items[0].metadata.name}')
          kubectl -n agents exec -i "$pod" -- python - <<'PY'
          import asyncio,json,uuid
          from keel.context import Context
          from keel.manifest import load_manifest
          from keel.protocol.errors import KeelError
          async def main():
              ctx=Context('keel-assistant','diagnostic_'+uuid.uuid4().hex,uuid.uuid4().hex,asyncio.Queue(),manifest=load_manifest('agent.yaml'),env='staging',session_id='diagnostic_'+uuid.uuid4().hex,eval_run_id='gate-diagnostic-20261028',session_messages=[])
              try:
                  prompt=await ctx.prompt('evaluate')
                  result=await ctx.loop(prompt.compile(review_data=json.dumps({'question':{'text':'2+2等于多少？'},'rubric':'正确回答4。','turns':[{'final':{'answer':'4'}}]})),tools=[],max_steps=1,prompt=prompt)
                  print(json.dumps({'diagnostic':'evaluator','result':'completed','versions':result.meta.get('prompt_versions')}))
              except KeelError as error:
                  cause=error.__cause__
                  print(json.dumps({'diagnostic':'evaluator','code':error.code.value,'causeType':type(cause).__name__,'http':getattr(cause,'status_code',None),'gatewayCode':(getattr(cause,'body',{}) or {}).get('code') if isinstance(getattr(cause,'body',{}),dict) else None}))
              finally:await ctx.aclose()
          asyncio.run(main())
          PY
          kubectl -n keel-system get deploy -o custom-columns=NAME:.metadata.name
          kubectl -n keel-system exec deploy/git-ci -- python -c 'import os,urllib.request; req=urllib.request.Request("https://api.github.com/repos/dezhiguan/keel-assistant",headers={"Authorization":"Bearer "+os.environ["KEEL_GITHUB_TOKEN"],"User-Agent":"keel-assistant-staging-deployment"}); r=urllib.request.urlopen(req,timeout=30); print("assistant_source_access",r.status)'
          REMOTE
