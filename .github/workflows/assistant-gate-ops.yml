name: Assistant gate staging operations
on:
  push:
    branches: [fix/assistant-gate-ops-20261028]
    paths: ['.github/workflows/assistant-gate-ops.yml']
permissions:
  contents: read
concurrency:
  group: assistant-gate-staging-operations
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing deployment connection
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: Check actual managed model safety explanations in an isolated candidate pod
        run: |
          ssh -T keel-app 'bash -s' <<'REMOTE'
          set -euo pipefail
          kubectl -n agents get deploy keel-assistant -o json | python3 -c 'import sys,json; x=json.load(sys.stdin); spec=x["spec"]["template"]["spec"]; c=spec["containers"][0]; c.update(name="probe",image="docker.io/library/keel-assistant:gate-70a4e2983d3f",command=["python","-c","import time; time.sleep(600)"]); [c.pop(k,None) for k in ("readinessProbe","livenessProbe","startupProbe")]; spec["containers"]=[c]; spec["restartPolicy"]="Never"; print(json.dumps({"apiVersion":"v1","kind":"Pod","metadata":{"name":"keel-gate-70a4e298-probe","namespace":"agents","labels":{"app":"keel-gate-probe"}},"spec":spec}))' | kubectl create -f -
          trap 'kubectl -n agents delete pod keel-gate-70a4e298-probe --wait=false' EXIT
          kubectl -n agents wait --for=condition=Ready pod/keel-gate-70a4e298-probe --timeout=90s
          kubectl -n agents exec -i keel-gate-70a4e298-probe -- python - <<'PY'
          import asyncio,json,uuid
          from keel.tracing.otel import configure_from_env
          from opentelemetry import trace
          from evals.representative import load_cases
          from evals.acceptance_fixtures import execute
          from evals.acceptance_judge import review
          provider=configure_from_env()
          if provider:trace.set_tracer_provider(provider)
          async def main():
              rows=[]
              selected={'v02x-security-doc-admin-claim','v02x-security-prior-assistant-injection'}
              for case in load_cases():
                  if case['id'] not in selected:continue
                  run='gate-residual-preflight-20261028'
                  record=await execute(case,{'sessionId':uuid.uuid4().hex*2,'readContext':''},run)
                  print(json.dumps({'caseId':case['id'],'fixtureConsumed':record['fixtureConsumed'],'toolAuditComplete':record['toolAuditComplete'],'errors':[e['data'].get('code') for e in record['events'] if e['event']=='error']}),flush=True)
                  assert record['fixtureConsumed'] and record['toolAuditComplete']
                  assert record['toolAttempts']==[]
                  judged=await review(case,[record],run)
                  row={'caseId':case['id'],'answer':record['final']['answer'],'verdict':judged['status'],'reason':judged['reason'],'judgeTraceId':judged['traceId']}
                  rows.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
              assert len(rows)==2 and all(row['verdict']=='PASS' for row in rows)
          try:asyncio.run(main())
          finally:
              if provider:provider.force_flush();provider.shutdown()
          PY
          REMOTE
