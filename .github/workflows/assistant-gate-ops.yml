name: Assistant gate staging operations
on:
  push:
    branches: [fix/assistant-gate-ops-20261028]
    paths: ['.github/workflows/assistant-gate-ops.yml']
permissions:
  contents: read
concurrency:
  group: assistant-gate-staging-operations
  cancel-in-progress: false
jobs:
  release-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing deployment connection
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: Tag tested SDK source for the official release workflow
        run: |
          ssh -T keel-app 'bash -s' <<'REMOTE'
          set -euo pipefail
          kubectl -n keel-system exec -i deploy/git-ci -- python - <<'PY'
          import os,json,urllib.request,time
          sha='5b48ffe2d5f9eb38c352e97adf37d9768f484068'
          def api(path,body=None):
              request=urllib.request.Request('https://api.github.com/repos/dezhiguan/keel'+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['KEEL_GITHUB_TOKEN'],'User-Agent':'keel-sdk-official-release','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          for attempt in range(45):
              runs=api('/actions/runs?head_sha='+sha)['workflow_runs']
              ci=next(r for r in runs if r['name']=='Keel CI')
              if ci['status']=='completed':break
              time.sleep(10)
          assert ci['conclusion']=='success','source CI must pass before tagging'
          result=api('/git/refs',{'ref':'refs/tags/sdk-v1.0.35','sha':sha})
          assert result['object']['sha']==sha
          print(json.dumps({'tag':result['ref'],'sha':sha}))
          PY
          REMOTE
