name: Assistant gate staging operations
on:
  push:
    branches: [fix/assistant-gate-ops-20261028]
    paths: ['.github/workflows/assistant-gate-ops.yml']
permissions:
  contents: read
concurrency:
  group: assistant-gate-staging-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Roll out verified assistant candidate after the completed baseline
        run: |
          ssh -T keel-app 'bash -s' <<'REMOTE'
          set -euo pipefail
          revision=d3359a39773237781cc03a754d3c2710389fd9cf
          work=/tmp/keel-gate-20261028-$revision
          test -f "$work/deployment.json"
          python3 - "$work/deployment.json" <<'PY'
          import sys,json
          d=json.load(open(sys.argv[1]));assert d['revision']=='d3359a39773237781cc03a754d3c2710389fd9cf' and d['phase']=='built' and d['sdk']=='1.0.34'
          PY
          python3 "$work/source/deploy/gate-candidate.py" --source "$work/source" --revision "$revision" --tree "$work/tree.json" --base-image docker.io/library/keel-assistant:task-cost-5acab283 --image docker.io/library/keel-assistant:gate-d3359a397732 --wheel /tmp/keel_sdk-1.0.34-py3-none-any.whl
          REMOTE
