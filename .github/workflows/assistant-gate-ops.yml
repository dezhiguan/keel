name: Assistant gate staging operations
on:
  push:
    branches: [fix/assistant-gate-ops-20261028]
    paths: ['.github/workflows/assistant-gate-ops.yml']
permissions:
  contents: read
concurrency:
  group: assistant-gate-staging-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing deployment connection
        env:
          SSH_KEY: ${{ secrets.CAREERMATE_APP_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.CAREERMATE_APP_HOST }}
          JUMP_HOST: ${{ secrets.CAREERMATE_INGRESS_HOST }}
        run: bash deploy/ci/configure-ssh.sh
      - name: Roll out verified assistant candidate after the completed baseline
        run: |
          ssh -T keel-app 'bash -s' <<'REMOTE'
          set -euo pipefail
          revision=f7f62726c7f5b18dca0cd477bb50917178ca4596
          work=/tmp/keel-gate-20261028-$revision
          test -f "$work/deployment.json"
          python3 - "$work/deployment.json" <<'PY'
          import sys,json
          d=json.load(open(sys.argv[1]));assert d['revision']=='f7f62726c7f5b18dca0cd477bb50917178ca4596' and d['phase']=='built' and d['sdk']=='1.0.34'
          PY
          python3 "$work/source/deploy/gate-candidate.py" --source "$work/source" --revision "$revision" --tree "$work/tree.json" --base-image docker.io/library/keel-assistant:gate-d3359a397732 --image docker.io/library/keel-assistant:gate-f7f62726c7f5 --wheel /tmp/keel_sdk-1.0.34-py3-none-any.whl
          REMOTE
