name: Assistant performance candidate
on:
  push:
    branches: [fix/assistant-performance-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -pl :keel-server,:keel-llm -am test
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -e './sdk-python[test,eval]' fastapi
      - run: pip install -r templates/graph-agent/requirements.lock
      - run: python -m unittest discover -s deploy/ops -p 'test_*.py'
      - run: python -m pytest tests -q
        working-directory: sdk-python
  build:
    needs: [java, sdk]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [keel-server, keel-llm]
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        run: bash deploy/ci/resolve-image.sh '${{ matrix.module }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.server }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.push_image }}
          build-args: |
            MODULE=${{ matrix.module }}
            SOURCE_REV=${{ github.sha }}
            RAM_PERCENTAGE=70
      - run: echo '${{ matrix.module }} = ${{ steps.registry.outputs.pull_image }}' >> "$GITHUB_STEP_SUMMARY"
