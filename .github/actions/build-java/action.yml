name: Build Java service image
description: 构建并推送一个后端镜像
inputs:
  service:
    description: 模块名，也是镜像名
    required: true
  ram:
    description: MaxRAMPercentage
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - id: image
      shell: bash
      env:
        ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
      run: bash deploy/ci/resolve-image.sh ${{ inputs.service }}
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ steps.image.outputs.server }}
        username: ${{ env.ACR_USERNAME }}
        password: ${{ env.ACR_PASSWORD }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: deploy/docker/service.Dockerfile
        push: true
        provenance: false
        tags: ${{ steps.image.outputs.push_image }}
        build-args: |
          MODULE=${{ inputs.service }}
          JAR=${{ inputs.service }}/target/${{ inputs.service }}-0.1.0-SNAPSHOT.jar
          RAM_PERCENTAGE=${{ inputs.ram }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,scope=${{ inputs.service }},mode=max
