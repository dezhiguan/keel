<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keel 控制台 · 全流程智能体化（现有功能与新增一起看）</title>
<style>
:root{
  --bg:#0a101a; --panel:#101826; --panel2:#141e2f; --panel3:#18243a; --line:#1f2b3f; --line2:#2a3a55;
  --text:#cdd6e4; --white:#eef3fa; --mute:#6b7990; --acc:#ff7a45; --teal:#2ec4b6;
  --ok:#34c38f; --warn:#f1b44c; --bad:#f46a6a; --soft:#5b9cf6; --violet:#b48cf2;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Menlo","JetBrains Mono","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.6 var(--sans);overflow:hidden}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans)}
a{color:var(--soft)}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh}
.side{background:#0c1320;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo svg{width:26px;height:26px}
.logo b{color:var(--white);font-size:16px;display:block;line-height:1.1}
.logo small{color:var(--mute);font-family:var(--mono);font-size:10px}
.grp{font-size:10.5px;color:#4c5a70;letter-spacing:.14em;padding:12px 10px 4px;display:flex;align-items:center;gap:6px}
.grp .newtag{font-size:9.5px;letter-spacing:0;background:var(--acc);color:#1a0d05;border-radius:3px;padding:0 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:#9aa8bd;text-decoration:none;font-size:13px;transition:.15s;cursor:pointer}
.nav a i{font-style:normal;width:16px;text-align:center;color:#56657d}
.nav a:hover{background:var(--panel2);color:var(--white)}
.nav a.on{background:var(--panel3);color:var(--white)}
.nav a.on i{color:var(--acc)}
.nav a.old{opacity:.55}
.nav a .cnt{margin-left:auto;background:var(--acc);color:#1a0d05;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nav a .cnt[data-z="1"]{display:none}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 0;font-size:12px;color:var(--mute)}
.side .me b{color:var(--text);font-weight:500}
.side .me select{margin-top:6px}
.body{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh}
.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;background:#0b1220}
.crumb{color:var(--mute);font-size:12.5px}
.crumb b{color:var(--white);font-weight:500}
.crumb a{color:var(--mute);text-decoration:none}.crumb a:hover{color:var(--white)}
.sp{flex:1}
.envtag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;color:var(--ok)}
.main{flex:1;min-height:0;overflow:auto;padding:20px 24px 60px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{font-size:19px;color:var(--white);font-weight:600}
.vh .sub{color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:7px;padding:6px 12px;font-size:12.5px;transition:.15s;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:#3d5070;color:var(--white)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1d0e05;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.vio{border-color:#4a3a6e;color:var(--violet);background:#171329}
.btn.danger{border-color:#5a2a2e;color:var(--bad);background:#1c1216}
.btn.ghost{background:none}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;color:var(--white);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{color:var(--mute);font-weight:400;font-size:12px}
.row2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.row2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .l{font-size:11.5px;color:var(--mute)}
.kpi .v{font-size:23px;color:var(--white);font-weight:600;font-family:var(--mono);margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--mute)}
.mono{font-family:var(--mono)}.mut{color:var(--mute)}.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}.vioc{color:var(--violet)}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
.t th{text-align:left;color:var(--mute);font-weight:500;font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid #172235;vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tbody tr.click{cursor:pointer;transition:.12s}
.t tbody tr.click:hover{background:#131d2e}
.nm b{color:var(--white);font-weight:500;display:block}
.nm small{color:var(--mute);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 9px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nd::before{display:none}
.p-ok{color:var(--ok);background:rgba(52,195,143,.1)}
.p-warn{color:var(--warn);background:rgba(241,180,76,.1)}
.p-bad{color:var(--bad);background:rgba(244,106,106,.1)}
.p-soft{color:var(--soft);background:rgba(91,156,246,.1)}
.p-mute{color:#8b98ad;background:rgba(139,152,173,.1)}
.p-acc{color:var(--acc);background:rgba(255,122,69,.1)}
.p-teal{color:var(--teal);background:rgba(46,196,182,.1)}
.p-vio{color:var(--violet);background:rgba(180,140,242,.1)}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:1px solid var(--line2);background:none;color:#9aa8bd;border-radius:14px;padding:3px 11px;font-size:12px}
.chipsel button.on{background:var(--panel3);border-color:#3d5070;color:var(--white)}
.inp{background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--white);padding:6px 10px;font-size:13px;outline:none;transition:.15s;width:100%}
.inp:focus{border-color:var(--acc)}
.inp.err{border-color:var(--bad)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.6}
.bar{height:7px;background:#1a2438;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s ease}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px}
.field label b{color:var(--bad);font-weight:400;margin-left:2px}
.field .hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.field .hint.err{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.8px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:2px 8px}
.chip b{color:var(--acc);font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12.8px}
.kv span{color:var(--mute)}
pre.code{background:#0a0f18;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#c9d4e3;overflow:auto;white-space:pre}
pre.code .k{color:#ff9a6b}pre.code .c{color:#56657d}pre.code .s{color:#8fd1a6}
.banner{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:#5a4a26;background:#1c1810}
.banner.bad{border-color:#5a2a2e;background:#1c1216}
.banner.ok{border-color:#24483c;background:#0f1a16}
.banner.info{border-color:#26406a;background:#0f1626}
.banner.vio{border-color:#4a3a6e;background:#151226}
.lock{font-family:var(--mono);color:var(--warn)}
.radio{display:flex;flex-direction:column;gap:6px}
.radio.h{flex-direction:row}
.radio.h label{flex:1}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:12.8px;color:var(--text);transition:.15s}
.radio label:hover{border-color:#3d5070}
.radio label.on{border-color:var(--acc);background:rgba(255,122,69,.06)}
.radio label.dis{opacity:.4;cursor:not-allowed}
.radio label small{display:block;color:var(--mute);font-size:11.5px}
.radio input{margin-top:3px;accent-color:var(--acc)}

.strip{display:flex;gap:3px;margin-top:8px}
.strip i{flex:1;height:5px;border-radius:3px;background:#1d2940}
.strip i.done{background:var(--teal)}
.strip i.cur{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
.strip i.wait{background:var(--warn)}
.strip i.hum{background:var(--violet)}
.strip i.fail{background:var(--bad)}
.strip i.h{outline:1px solid #3d4c66;outline-offset:1px}
@keyframes pulse{50%{opacity:.45}}
.kan{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.col{background:#0d1522;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px}
.col .ch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--white);padding:2px 4px 10px}
.col .ch small{color:var(--mute);font-size:11px}
.col .ch .n{margin-left:auto;font-family:var(--mono);color:var(--mute);font-size:11.5px}
.jc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.15s}
.jc:hover{border-color:#3d5070;transform:translateY(-1px)}
.jc .t1{display:flex;align-items:center;gap:6px}
.jc .t1 b{color:var(--white);font-weight:500;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .t1 small{font-family:var(--mono);color:var(--mute);font-size:10.5px}
.jc .t2{font-size:11.5px;color:var(--mute);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.jc.need{border-color:#5a4a26;background:#15130d}
.jc.hum{border-color:#4a3a6e;background:#141126}
.ly{font-size:10.5px;border-radius:4px;padding:0 5px;font-family:var(--mono)}
.ly.dev{color:var(--violet);border:1px solid #4a3a6e}
.ly.biz{color:var(--teal);border:1px solid #1f4f4b}
.ly.meta{color:var(--acc);border:1px solid #5a3420}
.tl .it{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:8px 0;position:relative}
.tl .it::before{content:"";position:absolute;left:12px;top:30px;bottom:-8px;width:1px;background:var(--line2)}
.tl .it:last-child::before{display:none}
.tl .dot{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);background:#1a2438;color:var(--mute);border:1px solid var(--line2);z-index:1}
.tl .dot.done{background:rgba(46,196,182,.15);color:var(--teal);border-color:transparent}
.tl .dot.cur{border:2px solid var(--acc);color:var(--acc);background:#1d1610}
.tl .dot.wait{background:rgba(241,180,76,.15);color:var(--warn);border-color:var(--warn)}
.tl .dot.hum{background:rgba(180,140,242,.15);color:var(--violet);border-color:var(--violet)}
.tl .dot.fail{background:rgba(244,106,106,.15);color:var(--bad);border-color:transparent}
.tl .dot.h{border-radius:6px}
.tl .nm2 b{color:var(--white);font-weight:500}
.tl .nm2 small{display:block;color:var(--mute);font-size:11.5px}
.tl .rt{text-align:right;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.log li{list-style:none;display:grid;grid-template-columns:62px 110px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed #172235;font-size:12.5px}
.log li:last-child{border-bottom:none}
.log .tm{font-family:var(--mono);color:var(--mute);font-size:11.5px}
.log .who{font-family:var(--mono);font-size:11.5px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px}
.dtabs button{border:none;background:none;color:var(--mute);padding:7px 12px;font-size:12.8px;border-bottom:2px solid transparent}
.dtabs button.on{color:var(--white);border-bottom-color:var(--acc)}
.stepper{display:flex;margin-bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper div{flex:1;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12.8px;color:var(--mute);border-right:1px solid var(--line)}
.stepper div:last-child{border-right:none}
.stepper div i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px}
.stepper div.on{color:var(--white);background:var(--panel3)}
.stepper div.on i{border-color:var(--acc);color:var(--acc)}
.stepper div.done i{background:var(--teal);border-color:var(--teal);color:#06231f}
.tplgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tpl{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:12.5px;transition:.15s}
.tpl:hover{border-color:#3d5070}
.tpl.on{border-color:var(--acc);background:rgba(255,122,69,.06)}
.tpl b{display:block;color:var(--white);font-family:var(--mono);font-size:12.5px}
.tpl small{color:var(--mute)}
.tpl.dis{opacity:.4;cursor:not-allowed}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
.acard:hover{border-color:#3d5070;transform:translateY(-2px)}
.acard .hd{display:flex;align-items:flex-start;gap:10px}
.av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;color:#0a101a}
.acard .ttl b{color:var(--white);display:block;font-size:14px}
.acard .ttl small{color:var(--mute);font-family:var(--mono);font-size:11.5px}
.acard p{font-size:12.3px;color:#9aa8bd;margin:8px 0}
.acard .src{font-size:11.5px;color:var(--mute);margin-bottom:8px}
.acard .st3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acard .st3 div{font-size:11px;color:var(--mute)}
.acard .st3 b{display:block;color:var(--white);font-family:var(--mono);font-size:13px;font-weight:500}
.sech{display:flex;align-items:center;gap:8px;margin:18px 0 10px;color:var(--white);font-size:14px}
.sech small{color:var(--mute);font-size:12px}
.cmp td.num{font-family:var(--mono);text-align:right}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:76px;height:76px}
.ring b{font-size:24px;color:var(--white);font-family:var(--mono);display:block}
.mask{position:fixed;inset:0;background:rgba(3,6,12,.6);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,92vw);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dh h3{color:var(--white);font-size:16px}
.drawer .db{flex:1;overflow:auto;padding:16px 20px}
.x{border:none;background:none;color:var(--mute);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--panel3);color:var(--white)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(520px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{padding:16px 20px 6px;color:var(--white);font-size:15.5px;font-weight:600}
.modal .mb{padding:8px 20px 14px;font-size:13px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:9px;padding:10px 14px;color:var(--white);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease;max-width:400px}
.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}.toast.info{border-left-color:var(--soft)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.doc h3{font-size:15px;color:var(--white);margin:22px 0 10px}
.doc h3:first-child{margin-top:0}
.doc p,.doc li{font-size:13px;color:#aab6c8}
.doc ul{margin:6px 0 6px 18px}
.doc code{font-family:var(--mono);font-size:12px;background:#0a0f18;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:#c9d4e3}
@media (max-width:1200px){.kan{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.tplgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<style>
.exist{border:1px dashed var(--line2);border-radius:12px;padding:12px 16px;margin-bottom:14px;background:#0c1320}
.exist h4{font-size:12.5px;color:var(--mute);font-weight:500;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.exist ul{margin-left:18px;font-size:12.5px;color:#8f9cb1}
.enhh{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:13px;color:var(--white)}
.tag-new{font-size:10.5px;background:rgba(255,122,69,.12);color:var(--acc);border:1px solid #5a3420;border-radius:4px;padding:0 6px}
.tag-keep{font-size:10.5px;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 6px}
.nav a .nt{margin-left:auto;font-size:9.5px;border-radius:3px;padding:0 4px;font-weight:700;background:var(--acc);color:#1a0d05}
.nav a .et{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--violet)}
.legendbar{display:flex;gap:14px;font-size:11px;color:var(--mute);padding:8px 10px 0}
.legendbar i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tabsline{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabsline a{color:var(--mute);padding:7px 12px;font-size:12.8px;border-bottom:2px solid transparent;text-decoration:none}
.tabsline a.on{color:var(--white);border-bottom-color:var(--acc)}
</style>
<div class="app" id="app">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M2 9h20l-2 5c-4 3-12 3-16 0z" stroke="#ff7a45" stroke-width="1.8"/><path d="M10 16h4l-.8 6h-2.4z" fill="#ff7a45"/></svg><div><b>Keel</b><small>agent platform</small></div></div>

function ring(v,l,s){const c=2*Math.PI*30;return `<div class="ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" stroke="#1d2940" stroke-width="7" fill="none"/><circle cx="38" cy="38" r="30" stroke="${v>=.8?'#34c38f':'#f46a6a'}" stroke-width="7" fill="none" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 38 38)" stroke-linecap="round"/></svg><div><b>${v.toFixed(2)}</b><span class="mut" style="font-size:12px">${l}<br>${s}</span></div></div>`}
function manifestYaml(j){return `<span class="k">apiVersion</span>: keel/v1
<span class="k">kind</span>: Agent
<span class="k">metadata</span>: { name: ${esc(j.agent)}, displayName: ${esc(j.title)}, owner: ${esc(j.org)} / ${esc(j.req)} }

  <span class="k">auth</span>:     { audience: ${esc(j.agent)} }
  <span class="k">models</span>:   { default: qwen-plus, budget: { dailyCny: 20 } }
  <span class="k">knowledge</span>: [${j.kbs.map(k=>` { kb: ${k} }`).join(',')} ]
  <span class="k">tools</span>:
${j.tools.map(t=>{const c=CATALOG.tools.find(x=>x.n===t)||{r:'low'};return `    - { name: ${t}, access: ${/send|create/.test(t)?'write':'read'}, risk: ${c.r} }`}).join('\n')||'    []'}
  <span class="k">guardrails</span>: { inputInjection: enforce, pii: mask }
  <span class="k">eval</span>:     { dataset: ${esc(j.agent)}/seed, gate: { minScore: 0.80, byTag: true } }
<span class="c"># spec-agent 生成 · ${j.id}</span>`}

  else if(pg==='jobs'&&p[1]){html=vJob(p[1]);crumb=sub(esc(p[1]))}
  else if(pg==='approvals'&&p[1]){html=vReview(p[1]);crumb=sub(esc(p[1]))}
  else html={overview:vOverview,agents:vAgents,jobs:vJobs,services:vServices,trace:vTrace,eval:vEval,prompts:vPrompts,tools:vTools,approvals:vApprovals,audit:vAudit,models:vModels,spec:vSpec}[pg]();
  const v=$('#view');v.innerHTML=html;v.style.animation='none';v.offsetHeight;v.style.animation='';
  $('#crumb').innerHTML=crumb;
  document.querySelectorAll('#nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===pg));
  updCnt();
}
addEventListener('hashchange',()=>{DT='progress';route()});

/* ================= simulation ================= */
function advance(j){
  if(j.status!=='RUN')return;
  setTimeout(()=>{
    if(j.status!=='RUN')return;
    const cur=stg(j),nx=STAGES[IDX[j.stage]+1],who=j.layer==='dev'?'meta-agent':cur.a;
    j.spent+=cur.k==='BUILD'?6.2:1.4;logj(j,who,cur.n+'完成');
    if(cur.k==='BUILD'&&j.mode==='SCAFFOLD'){j.status='HUMAN';j.humanDev=j.req;logj(j,'dev-lead','骨架 PR 已提交，进入人工开发');toast(`${j.id} 骨架已生成，轮到人开发`,'info');route();return}
    if(!nx){j.status='DONE';route();return}
    j.stage=nx.k;
    if(nx.k==='H3'){const need=j.tools.filter(t=>t!=='rag.search');if(need.length)j.h3Pending=need.join('、');j.stage='BUILD'}
    if(nx.k==='REVIEW'&&(j.mode==='COLLAB'||j.layer==='dev')){j.status='WAIT';j.needReview=true;logj(j,'code-review','评审完成；等待人工 approve');toast(`${j.id} 等人工 review PR（审批中心）`,'warn');route();return}
    if(nx.k==='H4'){if(j.h3Pending){j.stage='GATE';logj(j,'release-agent','授权未完成，等待 H3');toast(`${j.id} 卡在门禁前：授权未批`,'warn');route();return}releaseBatch(j)}
    if(nx.h&&nx.k!=='H3'){j.status='WAIT';logj(j,j.layer==='dev'?'meta-agent':'dev-lead',`挂起，等待 ${nx.who}（${nx.k}）`);toast(`<b>${j.id}</b> 到达 ${nx.k} · ${nx.n}，待办已进审批中心`,'warn');route();return}
    route();advance(j);
  },stg(j).k==='BUILD'?3200:2200);
}
function releaseBatch(j){const b=S.batches.find(x=>x.id===j.batch);if(!b||b.pilot!==j.id||b.pilotPassed)return;b.pilotPassed=true;toast(`批次 ${b.id} 试产已过门禁，整批放开`,'info');S.jobs.filter(x=>x.batch===b.id&&x.status==='QUEUED').slice(0,S.settings.conc).forEach(x=>{x.status='RUN';logj(x,'dev-lead','批次出队');advance(x)})}
function resume(j,msg){j.status='RUN';logj(j,ROLE_NAME[S.role],msg);const nx=STAGES[IDX[j.stage]+1];j.stage=nx.k;if(nx.k==='H3'){j.stage='BUILD';const need=j.tools.filter(t=>t!=='rag.search');if(need.length)j.h3Pending=need.join('、')}route();advance(j)}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const T=e.target;
  const go=T.closest('[data-go]');if(go&&!T.closest('a')){location.hash=go.dataset.go;return}
  const em=T.closest('[data-emp]');if(em&&!T.closest('a')){empDrawer(em.dataset.emp);return}
  const af=T.closest('[data-af]');if(af){AF=af.dataset.af;route();return}
  const av=T.closest('[data-av]');if(av){AV=av.dataset.av;route();return}
  const at=T.closest('[data-at]');if(at){AT=at.dataset.at;route();return}
  const dt=T.closest('[data-dt]');if(dt){DT=dt.dataset.dt;route();return}
  const me=T.closest('[data-method]');if(me){W.f.method=me.dataset.method;route();return}
  const L=T.closest('[data-layer]');if(L&&!L.classList.contains('dis')){W.f.layer=L.dataset.layer;if(W.f.layer==='dev')W.f.mode='COLLAB';route();return}
  const K=T.closest('[data-kind]');if(K){W.f.kind=K.dataset.kind;route();return}
  const M=T.closest('[data-mode]');if(M&&!M.classList.contains('dis')){W.f.mode=M.dataset.mode;route();return}
  const JM=T.closest('[data-jmode]');if(JM&&!ro()){const j=job(JM.dataset.id);if(j.layer==='dev'&&JM.dataset.jmode!=='COLLAB')return toast('研发类任务只能人机协作','bad');j.mode=JM.dataset.jmode;route();return}
  const tp=T.closest('[data-tpl]');if(tp&&!tp.classList.contains('dis')){W.f.tpl=tp.dataset.tpl;route();return}
  const tl=T.closest('[data-tool]');if(tl){const a=W.f.tools,n=tl.dataset.tool;a.includes(n)?a.splice(a.indexOf(n),1):a.push(n);route();return}
  const kb=T.closest('[data-kb]');if(kb){const a=W.f.kbs,n=kb.dataset.kb;a.includes(n)?a.splice(a.indexOf(n),1):a.push(n);route();return}
  const ts=T.closest('[data-tset]');if(ts&&S.role==='admin'){const a=S.settings.tpls,n=ts.dataset.tset;a.includes(n)?(a.length>1&&a.splice(a.indexOf(n),1)):a.push(n);route();return}
  const b=T.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,id=b.dataset.id,j=id&&job(id);
  const A={
    closeAll,
    toast:()=>toast(esc(b.dataset.msg),'info'),
    wNext:()=>{const f=W.f;
      if(W.step===0){if(!f.title||!f.goal)return toast('标题和目标必填','bad');if(!/^[a-z][a-z0-9-]{1,38}[a-z0-9]$/.test(f.agent))return toast('智能体 ID 不合规','bad');if(f.kind==='CREATE'&&(S.jobs.some(x=>x.agent===f.agent)||EMP.some(x=>x.id===f.agent)))return toast('该 ID 已存在；要改已有智能体请选"改造"','bad');if(f.kind==='CHANGE'&&f.agent==='meta-agent')return toast('元智能体只能由人直接修改','bad')}
      if(W.step===1&&(!f.users||!f.io||!f.success))return toast('场景、输入输出、成功标准必填','bad');
      W.step++;route()},
    wPrev:()=>{W.step--;route()},
    fakeUpload:()=>{W.f.seedN=34;route()},
    wSubmit:()=>{const f=W.f,nid=nextId();const nj=mk({id:nid,title:f.title,agent:f.agent,layer:f.layer,kind:f.kind,mode:f.mode,producer:f.layer==='dev'?'meta-agent':'dev-lead',tpl:f.tpl,req:ROLE_NAME[S.role],org:'研发效能组',stage:'SPEC',status:'RUN',goal:f.goal,tools:[...f.tools],kbs:[...f.kbs],budget:f.layer==='dev'?120:S.settings.budget,seed:{human:f.seedN,agent:0,holdout:0},log:[[now(),ROLE_NAME[S.role],'提交需求并完成委托授权']]});
      S.jobs.unshift(nj);resetW();toast(`已创建研发任务 <b>${nid}</b>`);location.hash='#/jobs/'+nid;advance(nj)},
    takeover:()=>openModal('人工接管 '+id,`<ul style="margin:0 0 0 18px;color:#aab6c8"><li>dev-agent 停止推送，任务进入"人工开发"</li><li>修复轮次暂停计数</li><li>你在 <span class="mono">keel-agents/${esc(j.agent)}</span> 的 PR 上直接提交</li><li>记 config.change 审计（kind=devflow.takeover）</li></ul>`,`<button class="btn" data-act="closeAll">取消</button><button class="btn vio" data-act="takeoverOk" data-id="${id}">确认接管</button>`),
    takeoverOk:()=>{j.status='HUMAN';j.needReview=false;j.humanDev=ROLE_NAME[S.role];if(IDX[j.stage]>IDX.GATE)j.stage='GATE';if(j.stage==='REVIEW')j.stage='BUILD';logj(j,ROLE_NAME[S.role],'人工接管开发');closeAll();toast('已接管');location.hash='#/jobs/'+id;route()},
    assist:()=>openModal('请智能体帮忙',`<div class="field"><label>指令（写明范围）</label><textarea class="inp" id="assistIn" placeholder="如：在 tools/ 下补齐单测，不要改 app.py"></textarea></div>`,`<button class="btn" data-act="closeAll">取消</button><button class="btn pri" data-act="assistOk" data-id="${id}">发给 dev-agent</button>`),
    assistOk:()=>{const v=$('#assistIn').value.trim();if(!v)return toast('请写明要它做什么','bad');logj(j,ROLE_NAME[S.role],'请 dev-agent 帮忙：'+v);setTimeout(()=>{logj(j,'dev-agent','按指令完成，推送 1 次提交');route()},1800);closeAll();route()},
    handback:()=>{j.status='RUN';j.stage='REVIEW';logj(j,ROLE_NAME[S.role],j.mode==='SCAFFOLD'?'提交门禁':'交还智能体');toast('已交还：code-review 将评审全部改动');route();advance(j)},
    cancel:()=>openModal('取消 '+id,'已开通的 staging 资源按逆序回收，仓库和 PR 保留只读。',`<button class="btn" data-act="closeAll">再想想</button><button class="btn danger" data-act="cancelOk" data-id="${id}">确认取消</button>`),
    cancelOk:()=>{j.status='CANCEL';logj(j,ROLE_NAME[S.role],'取消任务');closeAll();route()},
    approvePR:()=>{j.needReview=false;j.status='RUN';logj(j,ROLE_NAME[S.role],'approve PR');toast('PR 已 approve，进入 staging 门禁');route();advance(j)},
    h1Ok:()=>{resume(j,'确认需求单');location.hash='#/jobs/'+id},
    h1Back:()=>{const n=$('#h1note').value.trim();if(!n)return toast('退回需要填写修改意见','bad');j.status='RUN';j.stage='SPEC';logj(j,ROLE_NAME[S.role],'退回：'+n);location.hash='#/jobs/'+id;advance(j)},
    h2Ok:()=>{const acc=Object.values(H2SEL).filter(Boolean).length;j.seed.agent=acc;j.seed.holdout=Math.round(j.seed.human*S.settings.holdout/100);H2SEL={};resume(j,`确认评测集，采纳 ${acc} 条，切出隐藏考题 ${j.seed.holdout} 条`);location.hash='#/jobs/'+id},
    grantH3:()=>{logj(j,'工具所有者','批准授权：'+j.h3Pending);delete j.h3Pending;toast('授权已批准');if(j.stage==='GATE'&&j.status==='RUN')advance(j);route()},
    h4Ok:()=>{resume(j,'批准发布（tool.call · git.pr.merge）');location.hash='#/jobs/'+id},
    h4No:()=>{j.fix++;j.status='RUN';j.stage='BUILD';logj(j,ROLE_NAME[S.role],'驳回发布，回到开发');location.hash='#/jobs/'+id;advance(j)},
    showManifest:()=>{$('#dTitle').textContent='agent.yaml · '+j.agent;$('#dBody').innerHTML=`<pre class="code">${manifestYaml(j)}</pre>`;$('#drawer').classList.add('on');$('#mask').classList.add('on')},
    changeEmp:()=>{const eid=b.dataset.empId,e=EMP.find(x=>x.id===eid);closeAll();resetW();W.f.kind='CHANGE';W.f.agent=eid;W.f.layer=e.layer==='dev'?'dev':'biz';if(e.layer==='dev')W.f.mode='COLLAB';W.f.title='改造 '+eid;location.hash='#/agents/new'},
    batchUpload:()=>{BU=[{agent:'refund-explainer',title:'退款规则解释',mode:'AUTO',owner:'陈主管'},{agent:'cs-summary',title:'客服会话小结',mode:'AUTO',owner:'陈主管'},{agent:'cs-summary2',title:'客服对话总结',mode:'AUTO',owner:'陈主管',flag:['p-bad','与第 2 行重复']},{agent:'vip-callback',title:'VIP 回访话术',mode:'COLLAB',owner:'陈主管'},{agent:'complaint-route',title:'投诉分级',mode:'SCAFFOLD',owner:'—',flag:['p-warn','缺负责人']}];route()},
    batchCancel:()=>{BU=null;route()},
    batchSubmit:()=>{const bid='B-0'+(S.batches.length+3),ok=BU.filter(r=>!r.flag);let first;
      ok.forEach((r,i)=>{const nj=mk({id:nextId(),title:r.title,agent:r.agent,mode:r.mode,batch:bid,tpl:'tool-agent',req:r.owner,org:'客服中心',stage:'SPEC',status:i?'QUEUED':'RUN',goal:r.title,log:[[now(),ROLE_NAME[S.role],i?'批次排队':'批次试产条目']]});S.jobs.push(nj);if(!i)first=nj});
      S.batches.unshift({id:bid,title:$('#buTitle').value||'新批次',req:ROLE_NAME[S.role],conc:S.settings.conc,pilot:first.id,pilotPassed:false,created:'刚刚'});
      BU=null;toast(`批次 ${bid} 已创建：${ok.length} 条，先试产 ${first.id}`);route();advance(first)},
    saveSettings:()=>{document.querySelectorAll('[data-s]').forEach(i=>{S.settings[i.dataset.s]=i.type==='number'?+i.value:i.value});toast('规则已保存，已写 config.change 审计');route()},
  };
  A[act]&&A[act]();
});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f){W.f[f]=e.target.type==='number'?+e.target.value:e.target.value;if(f==='agent')e.target.classList.toggle('err',!!e.target.value&&!/^[a-z][a-z0-9-]{1,38}[a-z0-9]$/.test(e.target.value))}});
document.addEventListener('change',e=>{if(e.target.dataset.case){H2SEL[e.target.dataset.case]=e.target.checked;route()}});
$('#mask').addEventListener('click',closeAll);
$('#roleSel').addEventListener('change',e=>{S.role=e.target.value;if(S.role!=='admin'&&W.f.layer==='dev'){W.f.layer='biz';W.f.mode='AUTO'}route()});
route();
setTimeout(()=>advance(job('DF-0020')),1500);
