<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keel 控制台</title>
<style>
:root{
  --bg:#0a101a; --panel:#101826; --panel2:#141e2f; --panel3:#18243a; --line:#1f2b3f; --line2:#2a3a55;
  --text:#cdd6e4; --white:#eef3fa; --mute:#6b7990; --acc:#ff7a45; --teal:#2ec4b6;
  --ok:#34c38f; --warn:#f1b44c; --bad:#f46a6a; --soft:#5b9cf6;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Menlo","JetBrains Mono","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.6 var(--sans);overflow:hidden}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans)}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh}

/* side */
.side{background:#0c1320;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo svg{width:26px;height:26px}
.logo b{color:var(--white);font-size:16px;display:block;line-height:1.1}
.logo small{color:var(--mute);font-family:var(--mono);font-size:10px}
.grp{font-size:10.5px;color:#4c5a70;letter-spacing:.14em;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:#9aa8bd;text-decoration:none;font-size:13px;transition:.15s}
.nav a i{font-style:normal;width:16px;text-align:center;color:#56657d}
.nav a:hover{background:var(--panel2);color:var(--white)}
.nav a.on{background:var(--panel3);color:var(--white)}
.nav a.on i{color:var(--acc)}
.nav a .cnt{margin-left:auto;background:var(--acc);color:#1a0d05;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nav a .cnt:empty,.nav a .cnt[data-z="1"]{display:none}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 0;font-size:12px;color:var(--mute)}
.side .me b{color:var(--text);font-weight:500}

/* top */
.body{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh}
.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;background:#0b1220}
.crumb{color:var(--mute);font-size:12.5px}
.crumb b{color:var(--white);font-weight:500}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--mute);font-size:12.5px;width:260px;cursor:pointer}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.envsel{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.envsel button{border:none;background:none;color:var(--mute);font-size:12px;padding:4px 10px;border-radius:6px}
.envsel button.on{background:var(--panel3);color:var(--white)}
.envsel button.on[data-env="prod"]{color:var(--ok)}
.envsel button.on[data-env="staging"]{color:var(--warn)}
.main{flex:1;min-height:0;overflow:auto;padding:20px 24px 60px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* common */
.vh{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{font-size:19px;color:var(--white);font-weight:600}
.vh .sub{color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:7px;padding:6px 12px;font-size:12.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#3d5070;color:var(--white)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1d0e05;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{border-color:#5a2a2e;color:var(--bad);background:#1c1216}
.btn.ghost{background:none}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;color:var(--white);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{color:var(--mute);font-weight:400;font-size:12px}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.row2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .l{font-size:11.5px;color:var(--mute)}
.kpi .v{font-size:23px;color:var(--white);font-weight:600;font-family:var(--mono);margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--mute)}
.up{color:var(--ok)}.down{color:var(--bad)}
.mono{font-family:var(--mono)}
.mut{color:var(--mute)}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
.t th{text-align:left;color:var(--mute);font-weight:500;font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid #172235;vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tbody tr.click{cursor:pointer;transition:.12s}
.t tbody tr.click:hover{background:#131d2e}
.nm b{color:var(--white);font-weight:500;display:block}
.nm small{color:var(--mute);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 9px;border-radius:10px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nd::before{display:none}
.p-ok{color:var(--ok);background:rgba(52,195,143,.1)}
.p-warn{color:var(--warn);background:rgba(241,180,76,.1)}
.p-bad{color:var(--bad);background:rgba(244,106,106,.1)}
.p-soft{color:var(--soft);background:rgba(91,156,246,.1)}
.p-mute{color:#8b98ad;background:rgba(139,152,173,.1)}
.p-acc{color:var(--acc);background:rgba(255,122,69,.1)}
.p-teal{color:var(--teal);background:rgba(46,196,182,.1)}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:1px solid var(--line2);background:none;color:#9aa8bd;border-radius:14px;padding:3px 11px;font-size:12px}
.chipsel button.on{background:var(--panel3);border-color:#3d5070;color:var(--white)}
.inp{background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--white);padding:6px 10px;font-size:13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc)}
.inp.err{border-color:var(--bad)}
select.inp{padding:5px 8px}
.bars>div{margin-bottom:10px}
.bars .h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar{height:7px;background:#1a2438;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s ease}
.alerts li{list-style:none;display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #172235;font-size:12.8px;align-items:flex-start}
.alerts li:last-child{border-bottom:none}
.alerts .tm{font-family:var(--mono);color:var(--mute);font-size:11.5px;padding-top:1px}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.pager{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.pager .size{display:flex;align-items:center;gap:6px}
.pager select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--white);padding:3px 6px;font-size:12.5px;outline:none;cursor:pointer}
.pager select:focus{border-color:var(--acc)}
.pager .pages{margin-left:auto;display:flex;align-items:center;gap:4px}
.pager .pages button{min-width:28px;height:28px;padding:0 8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:6px;font-size:12px;font-family:var(--mono);transition:.15s}
.pager .pages button:hover:not(:disabled):not(.on){border-color:#3d5070;color:var(--white)}
.pager .pages button.on{background:var(--acc);border-color:var(--acc);color:#1d0e05;font-weight:700}
.pager .pages button:disabled{opacity:.35;cursor:not-allowed}
.pager .ell{padding:0 4px;font-family:var(--mono)}

/* agents grid */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;position:relative}
.acard:hover{border-color:#3d5070;transform:translateY(-2px)}
.acard .hd{display:flex;align-items:flex-start;gap:10px}
.av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.acard .ttl b{color:var(--white);display:block;font-size:14px}
.acard .ttl small{color:var(--mute);font-family:var(--mono);font-size:11.5px}
.acard .meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.acard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acard .stats div{font-size:11px;color:var(--mute)}
.acard .stats b{display:block;color:var(--white);font-family:var(--mono);font-size:13px;font-weight:500}
.acard.new{border-style:dashed;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--mute);min-height:170px}
.acard.new b{font-size:26px;color:var(--acc);font-weight:400}

/* drawer / modal */
.mask{position:fixed;inset:0;background:rgba(3,6,12,.6);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dh h3{color:var(--white);font-size:16px}
.drawer .db{flex:1;overflow:auto;padding:16px 20px}
.drawer .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{border:none;background:none;color:var(--mute);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--panel3);color:var(--white)}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.dtabs button{border:none;background:none;color:var(--mute);padding:7px 12px;font-size:12.8px;border-bottom:2px solid transparent}
.dtabs button.on{color:var(--white);border-bottom-color:var(--acc)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(520px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{padding:16px 20px 6px;color:var(--white);font-size:15.5px;font-weight:600}
.modal .mb{padding:8px 20px 14px;font-size:13px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.field .hint.err{color:var(--bad)}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:12.8px;color:var(--text);transition:.15s}
.radio label:hover{border-color:#3d5070}
.radio label.on{border-color:var(--acc);background:rgba(255,122,69,.06)}
.radio label small{display:block;color:var(--mute);font-size:11.5px}
.radio input{margin-top:3px;accent-color:var(--acc)}

/* toast */
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:9px;padding:10px 14px;color:var(--white);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease;max-width:380px}
.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}.toast.info{border-left-color:var(--soft)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* code / yaml */
pre.code{background:#0a0f18;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#c9d4e3;overflow:auto;white-space:pre}
pre.code .k{color:#ff9a6b}pre.code .c{color:#56657d}pre.code .s{color:#8fd1a6}pre.code .hl{background:rgba(255,122,69,.14);display:inline-block;width:100%}

/* check list */
.checks li{list-style:none;display:flex;gap:10px;align-items:center;padding:6px 0;font-size:12.8px;border-bottom:1px dashed #172235}
.checks li:last-child{border-bottom:none}
.checks .ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;background:#1a2438;color:var(--mute)}
.checks .ic.ok{background:rgba(52,195,143,.15);color:var(--ok)}
.checks .ic.no{background:rgba(244,106,106,.15);color:var(--bad)}
.checks .ic.run{border:2px solid var(--acc);border-top-color:transparent;background:none;animation:spin .8s linear infinite}
.checks small{margin-left:auto;color:var(--mute);font-family:var(--mono);font-size:11px}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.8px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:2px 8px}
.chip b{color:var(--acc);font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12.8px}
.kv span{color:var(--mute)}

/* wizard */
.stepper{display:flex;gap:0;margin-bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper div{flex:1;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12.8px;color:var(--mute);border-right:1px solid var(--line);position:relative}
.stepper div:last-child{border-right:none}
.stepper div i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px}
.stepper div.on{color:var(--white);background:var(--panel2)}
.stepper div.on i{background:var(--acc);border-color:var(--acc);color:#1d0e05;font-weight:700}
.stepper div.done{color:var(--text)}
.stepper div.done i{background:rgba(52,195,143,.15);border-color:transparent;color:var(--ok)}
.wz{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{border:1px solid var(--line2);border-radius:11px;padding:13px;cursor:pointer;transition:.15s;background:var(--panel2)}
.opt:hover{border-color:#3d5070}
.opt.on{border-color:var(--acc);background:rgba(255,122,69,.06)}
.opt b{color:var(--white);display:block;margin-bottom:3px}
.opt small{color:var(--mute);font-size:12px;display:block}
.opt code{font-family:var(--mono);font-size:11px;color:var(--acc)}
.tpls{grid-template-columns:repeat(3,1fr)}
.cklist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.ck{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12.8px}
.ck:hover{border-color:var(--line2)}
.ck.on{border-color:#3d5070;background:var(--panel2)}
.ck input{accent-color:var(--acc)}
.ck .sp{flex:1}
.wfoot{display:flex;gap:8px;justify-content:flex-end;margin:14px -16px -16px;padding:12px 16px;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 12px 12px;z-index:2}
input[type=range]{accent-color:var(--acc);width:100%}
.prog{height:6px;background:#1a2438;border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ffb08f);width:0;transition:width .3s}

/* trace（与设计文档原型一致） */
.tsum .q{font-size:14.5px;color:#fff;font-weight:600;margin-bottom:8px;line-height:1.5}
.metas{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute)}
.metas b{color:#fff;font-family:var(--mono);font-weight:500}
.contrib{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.contrib .lb{font-size:11.5px;color:var(--mute);margin-bottom:5px;display:flex;justify-content:space-between}
.vtabs{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
.vtabs button{all:unset;cursor:pointer;padding:4px 12px;border-radius:6px;font-size:12px;color:var(--mute);font-weight:400}
.vtabs button.on{background:#223049;color:#fff}
.tv{display:none}.tv.on{display:block}
.graph{position:relative;width:800px;height:316px;margin:10px auto 0}
.graph svg{position:absolute;left:0;top:0;width:800px;height:316px;overflow:visible}
.gn{position:absolute;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer;transition:box-shadow .15s}
.gn:hover{background:#111b2b}
.gn.sel{box-shadow:0 0 0 2px #fff}
.gn .t{color:#fff;font-weight:600;font-size:12.5px;line-height:1.35}
.gn .m{color:var(--mute);font-size:10.5px;font-family:var(--mono);margin-top:3px;line-height:1.4}
.gn.user{cursor:default;border-style:dashed;border-color:#34445f}
.gg{position:absolute;border:1.5px dashed;border-radius:12px;padding:8px 10px;background:rgba(10,16,26,.6)}
.gh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-bottom:8px;cursor:pointer;border-radius:4px}
.gh.sel{text-decoration:underline;text-underline-offset:3px}
.gh small{font-weight:400;color:var(--mute);font-family:var(--mono);margin-left:auto;font-size:10.5px}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chipn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 7px;font-size:11px;color:#c3cde0;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chipn:hover{border-color:#3a4a66}
.chipn.sel{box-shadow:0 0 0 1.5px #fff}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.xsvc{font-size:9.5px;padding:0 5px;border-radius:3px;background:#1f2b40;color:#8fa3c0;font-family:var(--mono);font-weight:400}
.gtag{position:absolute;font-size:10.5px;color:var(--acc);font-family:var(--mono);cursor:pointer}
.gtag.sel{text-decoration:underline}
.lanes{position:relative;margin-top:12px}
.laxis{display:grid;grid-template-columns:128px 1fr;height:22px;font-family:var(--mono);font-size:10px;color:var(--mute);border-bottom:1px solid var(--line)}
.laxis div{display:flex;justify-content:space-between}
.lrow{display:grid;grid-template-columns:128px 1fr;height:44px;border-bottom:1px solid #182236}
.lname2{font-size:12px;color:#e6ebf3;display:flex;align-items:center;gap:7px}
.lname2 small{display:block;color:var(--mute);font-size:10px;line-height:1.2}
.ltrack{position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#162033 calc(25% - 1px),#162033 25%)}
.lagent{position:absolute;top:3px;bottom:3px;border:1px dashed;border-radius:6px}

.lb2.crit{border-bottom:3px solid #fff}

.lwait{position:absolute;top:13px;transform:translateX(-100%);font-size:10.5px;color:var(--warn);background:rgba(241,180,76,.12);border-right:3px solid var(--warn);padding:1px 7px;border-radius:4px 0 0 4px;white-space:nowrap;cursor:pointer}
.lwait.sel{box-shadow:0 0 0 1.5px #fff}
.hand{position:absolute;width:0;border-left:1.5px dashed #9fb2cf;pointer-events:none}
.hand::after{content:"";position:absolute;left:-4.5px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
.hand.down::after{bottom:-1px;border-top:6px solid #9fb2cf}
.hand.up::after{top:-1px;border-bottom:6px solid #9fb2cf}
.critnote{font-size:11.5px;color:var(--mute);margin-top:8px}
.critnote b{color:#fff;font-weight:500}
.tree{margin-top:10px}
.tree .tr{display:grid;grid-template-columns:1fr 90px 112px 64px 70px 70px;gap:8px;padding:6px 8px;border-bottom:1px solid #182236;font-size:12px;align-items:center;cursor:pointer}
.tree .tr:hover{background:#152036}
.tree .tr.sel{background:#1a2740}
.tree .tr.hd{color:var(--mute);font-size:11px;cursor:default;background:none}
.tree .nmc{display:flex;align-items:center;gap:6px;color:#e6ebf3;white-space:nowrap;overflow:hidden}

.appr p{margin:6px 0 10px;font-size:12.8px}

/* 分页：所有列表共用。PG[key] 记每个列表的页码和每页条数，翻页后调用 PGR[key] 重绘该列表 */
const PAGE_SIZES=[10,20,50,100];
const PG={},PGR={};
function pageOf(key,list){
  const p=PG[key]||(PG[key]={page:1,size:10});
  const pages=Math.max(1,Math.ceil(list.length/p.size));
  if(p.page>pages)p.page=pages;
  return list.slice((p.page-1)*p.size,p.page*p.size);
}
function resetPage(key){if(PG[key])PG[key].page=1}
function pager(key,total){
  const p=PG[key]||(PG[key]={page:1,size:10});
  const pages=Math.max(1,Math.ceil(total/p.size));
  if(p.page>pages)p.page=pages;
  const cur=p.page;
  const nums=pages<=7?[...Array(pages)].map((_,i)=>i+1):[1,...(cur>4?['…']:[]),...[cur-1,cur,cur+1].filter(n=>n>1&&n<pages),...(cur<pages-3?['…']:[]),pages];
  const from=total?(cur-1)*p.size+1:0,to=Math.min(cur*p.size,total);
  return `<div class="pager"><div class="size">每页<select data-pgsize="${key}">${PAGE_SIZES.map(s=>`<option value="${s}" ${s===p.size?'selected':''}>${s}</option>`).join('')}</select>条</div><span>第 ${from}–${to} 条，共 ${total} 条</span>
  <div class="pages"><button data-act="pg" data-key="${key}" data-p="${cur-1}" ${cur<=1?'disabled':''}>‹</button>${nums.map(n=>n==='…'?'<span class="ell">…</span>':`<button data-act="pg" data-key="${key}" data-p="${n}" class="${n===cur?'on':''}">${n}</button>`).join('')}<button data-act="pg" data-key="${key}" data-p="${cur+1}" ${cur>=pages?'disabled':''}>›</button></div></div>`;
}
document.addEventListener('change',e=>{const k=e.target.dataset.pgsize;if(!k)return;PG[k].size=+e.target.value;PG[k].page=1;PGR[k]()});

  v.innerHTML=`<div class="vh"><h2>工具</h2><span class="sub">统一注册，声明读写属性和风险等级。高风险工具的每次调用都会被挂起，送到审批中心</span><span class="sp"></span><button class="btn pri" data-act="regTool">+ 注册 MCP 工具</button></div><div id="toolBody"></div>`;

function drawTools(){
  PGR.tool=drawTools;

    ${pageOf('tool',S.tools).map(t=>{const d=dependents(t.id);return `<tr class="click" data-act="tool" data-id="${t.id}"><td class="nm"><b class="mono">${t.id}</b><small>${t.desc}</small></td><td>${t.scope}</td><td>${t.owner}</td><td>${t.access}</td><td>${riskPill(t.risk)}</td><td class="mono">${t.ver}</td><td>${d.length?d.map(a=>`<span class="chip" style="margin:1px">${a.id}</span>`).slice(0,3).join('')+(d.length>3?` <span class="mut">+${d.length-3}</span>`:''):'<span class="mut">无</span>'}</td><td class="mono">${fmtN(t.calls)}</td><td>${toolStPill(t.st)}${t.st==='DEPRECATED'?`<div class="mut" style="font-size:11px">→ ${t.replaced} · ${t.deadline}</div>`:''}</td></tr>`}).join('')}
  </tbody></table>${pager('tool',S.tools.length)}</div>`;
}

/* approvals */
let apprG='all';
VIEWS.approvals=v=>{
  v.innerHTML=`<div class="vh"><h2>审批中心</h2><span class="sub">所有需要人点一下的事都在这里。前四类是审批单，"人工介入"是执行挂起等人回话，处理完智能体从断点继续</span></div>
  <div class="chipsel" style="margin-bottom:14px">${GROUPS.map(([k,n])=>`<button data-act="apprG" data-k="${k}" class="${apprG===k?'on':''}">${n} · ${apprOf(k).length}</button>`).join('')}</div>
  <div id="apprBody"></div>`;
  drawAppr();
};
function drawAppr(){
  const list=apprOf(apprG);
  $('#apprBody').innerHTML=list.length?`<div style="max-width:820px">${list.map(p=>{const s=SUBJ[p.subject];return `<div class="appr" id="${p.id}" style="max-height:240px"><div class="t1">${subjPill(p.subject)}${riskPill(p.risk)}<b class="mono">${p.ref}</b><span class="sp"></span><small class="mut">${p.ago}</small></div><p>${p.text}</p>${p.subject==='run.input'?`<input class="inp" style="width:100%;margin-bottom:10px" placeholder="回复后智能体从挂起处继续执行">`:''}<div class="act"><button class="btn pri sm" data-act="decide" data-id="${p.id}" data-ok="1">${s.ok}</button><button class="btn sm" data-act="decide" data-id="${p.id}" data-ok="0">${s.no}</button><span class="sp"></span><small class="mut">${p.agent} · ${p.by} · ${p.run?`<a href="#/trace/${p.trace}" style="color:var(--soft)">run ${p.run} 挂起中 →</a>`:'由人发起，无执行在等'}</small></div></div>`}).join('')}</div>`:'<div class="card empty">这一类没有待办 🎉</div>';
}
function openTool(id){
  const t=toolOf(id),d=dependents(id);
  const prodDeps=d.filter(a=>a.env==='prod');
  openDrawer(`<span class="mono">${t.id}</span> ${toolStPill(t.st)}`,`
    <div class="kv"><span>说明</span><b>${t.desc}</b><span>范围 / 所有者</span><b>${t.scope} · ${t.owner}</b><span>读写 / 风险</span><b>${t.access} · ${riskPill(t.risk)}</b><span>审批策略</span><b>${t.policy}</b><span>当前版本</span><b class="mono">${t.ver}</b>${t.st==='DEPRECATED'?`<span>替代工具</span><b class="mono">${t.replaced}（截止 ${t.deadline}）</b>`:''}</div>
    <h4 style="margin:16px 0 8px;color:var(--white);font-size:13px">依赖方（manifest 声明 + 30 天调用）</h4>
    ${d.length?`<table class="t"><thead><tr><th>智能体</th><th>环境</th><th>状态</th></tr></thead><tbody>${d.map(a=>`<tr class="click" data-act="agent" data-id="${a.id}"><td>${a.id}</td><td>${a.env}</td><td>${pill(a.st)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">没有智能体在用</p>'}
    <h4 style="margin:16px 0 8px;color:var(--white);font-size:13px">版本历史</h4>
    <table class="t"><thead><tr><th>版本</th><th>变更</th><th>时间</th></tr></thead><tbody><tr><td class="mono">${t.ver}</td><td>当前</td><td class="mono">09-12</td></tr><tr><td class="mono">初版</td><td>注册</td><td class="mono">07-30</td></tr></tbody></table>
    <div class="note" style="margin-top:14px;font-size:12px;color:var(--mute)">生命周期：已注册 → 上线 → 废弃 → 下线。改描述或参数会触发所有依赖方回归评测；破坏兼容必须发新名字；有 prod 依赖不能直接下线。</div>`,
    t.st==='RETIRED'?'':`<button class="btn danger" data-act="toolRetire" data-id="${id}">下线</button>${t.st!=='DEPRECATED'?`<button class="btn" data-act="toolDeprecate" data-id="${id}">废弃</button>`:''}<button class="btn pri" data-act="toolVersion" data-id="${id}">发布新版本</button>`);
}

/* audit */
let audRisk='all',audAgent='all';
VIEWS.audit=v=>{
  PGR.aud=()=>VIEWS.audit($('#view'));
  const audList=S.audit.filter(e=>(audRisk==='all'||e.risk===audRisk)&&(audAgent==='all'||e.a===audAgent));
  v.innerHTML=`<div class="vh"><h2>审计中心</h2><span class="sub">只追加 · 哈希链防篡改 · 字段白名单 · 敏感信息脱敏</span><span class="sp"></span><button class="btn" data-act="verify">校验哈希链</button><button class="btn" data-act="exportAudit">导出（需审批）</button></div>
  <div class="toolbar"><select class="inp" id="audA"><option value="all">全部智能体</option>${S.agents.map(a=>`<option ${audAgent===a.id?'selected':''}>${a.id}</option>`).join('')}</select>
  <div class="chipsel">${[['all','全部风险'],['高','高'],['中','中'],['低','低']].map(([k,n])=>`<button data-act="audRisk" data-k="${k}" class="${audRisk===k?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="prog" id="verProg" style="display:none"><i></i></div>
  <div class="card"><table class="t"><thead><tr><th>时间</th><th>智能体</th><th>操作人</th><th>动作</th><th>资源</th><th>风险</th><th>结果</th></tr></thead><tbody>
  ${pageOf('aud',audList).map(e=>`<tr class="click" data-act="audit" data-i="${S.audit.indexOf(e)}"><td class="mono">${e.t}</td><td>${e.a}</td><td>${e.u}</td><td class="mono">${e.act}</td><td>${e.res}</td><td>${riskPill(e.risk)}</td><td>${{allowed:'<span class="pill p-ok">允许</span>',approved:'<span class="pill p-ok">已批准</span>',denied:'<span class="pill p-bad">拒绝</span>',rejected:'<span class="pill p-bad">已驳回</span>',pending:'<span class="pill p-warn">待审批</span>'}[e.dec]}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有符合条件的记录</td></tr>'}
  </tbody></table>${pager('aud',audList.length)}</div>`;
  $('#audA').onchange=e=>{audAgent=e.target.value;resetPage('aud');VIEWS.audit($('#view'))};

  v.innerHTML=`<div class="vh"><h2>模型网关</h2><span class="sub">后端是自研薄网关 keel-llm · 本页调 keel-server 取数和下发配置</span><span class="sp"></span></div>

    ${pageOf('model',MODEL_ROWS).map(([m,pv,use,calls,p95,to,cost,st])=>`<tr><td class="mono">${m}</td><td>${pv}</td><td>${use}</td><td class="mono">${fmtN(calls)}</td><td class="mono">${p95}</td><td class="mono" style="${st==='warn'?'color:var(--warn)':''}">${to}</td><td class="mono">¥${cost.toFixed(2)}</td><td>${st==='warn'?'<span class="pill p-warn">波动</span>':'<span class="pill p-ok">正常</span>'}</td></tr>`).join('')}

  ${pageOf('key',as).map(a=>{const p=Math.min(100,a.cost/a.budget*100);const r=a.st==='RETIRED';return `<tr><td>${a.id}</td><td class="mono">${a.id}-${a.env}</td><td class="mono">${a.models.length}</td><td><div class="h" style="display:flex;justify-content:space-between;font-size:12px"><span class="mono">¥${a.cost.toFixed(2)}</span><span class="mono mut">¥${a.budget}</span></div><div class="bar"><i style="width:${r?0:p}%;background:${p>80?'var(--bad)':p>60?'var(--warn)':'var(--teal)'}"></i></div></td><td>${r?'<span class="pill p-mute">已吊销</span>':p>60?`<span class="pill p-warn">${Math.round(p)}%</span>`:'<span class="pill p-ok">有效</span>'}</td><td>${r?'':`<button class="btn sm" data-act="budget" data-id="${a.id}">调整预算</button>`}</td></tr>`}).join('')}
  </tbody></table>${pager('key',as.length)}</div>`}`;

/* ================= actions ================= */
const ACT={
  palette:()=>openPal(),
  closeDrawer,
  closeModal,
  goCreate:()=>{if(W.done)W=W0();closeDrawer();go('create')},
  pg:d=>{PG[d.key].page=+d.p;PGR[d.key]()},
  svcTab:d=>{svcTab=d.k;VIEWS.services($('#view'))},
  modelTab:d=>{modelTab=d.k;VIEWS.models($('#view'))},
  ovCat:d=>{ovCat=d.k;resetPage('ov');VIEWS.overview($('#view'))},
  agCat:d=>{agCat=d.k;resetPage('ag');VIEWS.agents($('#view'))},
  agent:d=>{closeModal();openAgent(d.id)},

  toTrace:d=>{closeDrawer();if(d.tr){go('trace/'+d.tr);return}TRF.agent=d.id||'';TRF.range='7d';resetPage('tr');go('trace')},
  trOpen:d=>go('trace/'+d.id),
  trBack:()=>go('trace'),
  trF:d=>{TRF[d.k]=d.k==='multi'?d.v==='true':d.v;resetPage('tr');VIEWS.trace($('#view'))},
  ext:d=>toast(`原型中不跳转：实际会带上下文深链到 <b>${d.n}</b>`,'info'),
  release:d=>{const a=agentOf(d.id);openModal('发布到 prod',`<p>将 <b class="mono">${a.id} ${a.ver}</b> 发布到 prod。依次执行：</p><ul class="checks" id="relChecks">${['keel gate：跑实验并逐维度对比','提示词打 production 标签','更新路由与 agent_version','写审计 release'].map(n=>`<li><span class="ic"></span>${n}</li>`).join('')}</ul>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" id="relGo" data-act="releaseGo" data-id="${a.id}">开始发布</button>`)},
  releaseGo:d=>{const a=agentOf(d.id);$('#relGo').disabled=true;runChecks('#relChecks',()=>{a.env='prod';a.st='ONLINE';addAudit({a:a.id,u:'amy',act:'release',res:a.ver+' → prod',risk:'中',dec:'allowed'});closeModal();openAgent(a.id);toast(`<b>${a.id}</b> 已发布到 prod`);render()})},
  retire:d=>{const a=agentOf(d.id);openModal('下线智能体',`<p>下线后将<b>吊销 薄网关 虚拟 Key、删除 Secret、停止部署</b>，历史追踪、评测和审计保留。</p>${a.delegates?'':`<p class="mut" style="margin-top:6px">${S.agents.filter(x=>x.delegates&&x.delegates.includes(a.id)).map(x=>x.id).join('、')?'⚠ 被 '+S.agents.filter(x=>x.delegates&&x.delegates.includes(a.id)).map(x=>'<b>'+x.id+'</b>').join('、')+' 编排，下线后它们的委派会失败':''}</p>`}<div class="field"><label>输入智能体 ID <b class="mono">${a.id}</b> 确认</label><input class="inp" id="retIn" style="width:100%" autocomplete="off"></div>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn danger" id="retGo" data-act="retireGo" data-id="${a.id}" disabled>确认下线</button>`);$('#retIn').oninput=e=>$('#retGo').disabled=e.target.value!==a.id;setTimeout(()=>$('#retIn').focus(),100)},
  retireGo:d=>{const a=agentOf(d.id);a.st='RETIRED';a.calls=0;addAudit({a:a.id,u:'amy',act:'agent.retire',res:a.id+' '+a.ver,risk:'高',dec:'allowed'});closeModal();openAgent(a.id);toast(`<b>${a.id}</b> 已下线，虚拟 Key 已吊销`,'warn');render()},
  /* wizard */
  wSet:d=>{W[d.k]=d.v;if(d.k==='lang')W.tpl=d.v==='java'?'java-spring':'tool-agent';if(d.k==='mode'&&d.v==='dify'){W.lang='python'}drawWForm();drawWPrev(d.k==='mode'?null:d.k)},
  wNext:()=>{W.step++;VIEWS.create($('#view'))},
  wPrev:()=>{W.step--;VIEWS.create($('#view'))},
  wReset:()=>{W=W0();VIEWS.create($('#view'))},
  wRegister:()=>{$('#regBtn').disabled=true;$('#regBtn').textContent='注册中…';runChecks('#regChecks',()=>{
    const a=wAgent();S.agents.push(Object.assign(a,{env:'staging',ver:'v0.1.0',st:'REGISTERED',calls:0,total:0,p95:0,cost:0,score:null,inst:'1/1',gate:false}));
    addAudit({a:a.id,u:'amy',act:'agent.register',res:a.id+' v0.1.0 · staging',risk:'低',dec:'allowed',payload:{selfcheck:'7/7'}});
    W.done=true;drawWForm();toast(`<b>${a.id}</b> 已注册到 staging`)})},
  /* trace */
  /* eval */
  runEval:()=>{const p=$('#evalProg');p.style.display='block';const bar=p.firstElementChild;let x=0;const tm=setInterval(()=>{x+=8;bar.style.width=Math.min(x,100)+'%';if(x>=100){clearInterval(tm);setTimeout(()=>{p.style.display='none';bar.style.width=0;const a=agentOf(evalAgent);toast(a.gate?`回归完成：<b>${a.score}</b>，门禁通过`:`回归完成：<b>${a.score}</b>，门禁仍未通过`,a.gate?'':'bad')},300)}},120)},
  expect:()=>openModal('标记为预期变化',`<p>标记后本次退步不计入门禁，<b>需要写明原因，并记入审计</b>。</p><div class="field"><label>原因</label><textarea class="inp" id="expIn" rows="3" style="width:100%" placeholder="至少 10 个字"></textarea></div>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="expectGo">提交</button>`),
  expectGo:()=>{const v=$('#expIn').value.trim();if(v.length<10){$('#expIn').classList.add('err');toast('原因至少 10 个字','bad');return}closeModal();addAudit({a:evalAgent,u:'amy',act:'gate.override',res:'安全规程 -6pt 标记为预期',risk:'高',dec:'pending',payload:{reason:v}});toast('已提交，等待平台管理员审批','warn')},
  /* tools */
  apprG:d=>{apprG=d.k;VIEWS.approvals($('#view'))},
  tool:d=>openTool(d.id),
  decide:d=>{const p=S.approvals.find(x=>x.id===d.id);const ok=d.ok==='1';const el=document.getElementById(d.id);el.style.maxHeight=el.offsetHeight+'px';requestAnimationFrame(()=>el.classList.add('gone'));
    S.approvals=S.approvals.filter(x=>x.id!==d.id);updateBadge();
    const ae=S.audit.find(e=>e.tr===p.trace&&e.dec==='pending');if(ae)ae.dec=ok?'approved':'rejected';
    /* run.* 不是审批单，记的是运行恢复，不是 approval */
    const human=SUBJ[p.subject].g==='human';
    addAudit({a:p.agent,u:'amy（审批人）',act:human?'run.resume':'approval',res:p.ref,risk:p.risk,dec:ok?'approved':'rejected',tr:p.trace});
    toast(ok?(p.run?`已批准 <b>${p.ref}</b>，run ${p.run} 从挂起处继续`:`已批准 <b>${p.ref}</b>`):`已驳回 <b>${p.ref}</b>，已告知发起方`,ok?'':'warn');
    setTimeout(()=>{if(location.hash.includes('approvals'))VIEWS.approvals($('#view'))},420)},
  toolDeprecate:d=>{const t=toolOf(d.id);openModal(`废弃工具 <span class="mono">${t.id}</span>`,`<p>废弃期内照常可调用，但追踪会打"已废弃"标记，并通知 ${dependents(t.id).length} 个依赖方迁移。</p>
    <div class="field"><label>替代工具</label><select class="inp" id="depRep" style="width:100%"><option value="">请选择</option>${S.tools.filter(x=>x.id!==t.id&&x.st==='ONLINE').map(x=>`<option>${x.id}</option>`).join('')}<option>${t.id}.v2（新建）</option></select></div>
    <div class="field"><label>截止日期</label><input type="date" class="inp" id="depDate" value="2026-11-30" style="width:100%"></div>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="deprecateGo" data-id="${t.id}">确认废弃</button>`)},
  deprecateGo:d=>{const t=toolOf(d.id);const r=$('#depRep').value;if(!r){toast('请选择替代工具','bad');return}t.st='DEPRECATED';t.replaced=r.replace('（新建）','');t.deadline=$('#depDate').value;addAudit({a:t.owner,u:'amy',act:'tool.deprecate',res:t.id+' → '+t.replaced,risk:'中',dec:'allowed'});closeModal();openTool(t.id);drawTools();toast(`<b>${t.id}</b> 已废弃，已通知依赖方`,'warn')},
  toolRetire:d=>{const t=toolOf(d.id);const prod=dependents(t.id).filter(a=>a.env==='prod');
    if(prod.length){openModal('不能下线',`<p><b class="mono">${t.id}</b> 仍被 prod 智能体依赖：${prod.map(a=>`<span class="chip">${a.id}</span>`).join(' ')}</p><p class="mut" style="margin-top:8px">有 prod 依赖的工具只能先<b>废弃</b>，等依赖方迁移完再下线。</p>`,`<button class="btn" data-act="closeModal">知道了</button>${t.st!=='DEPRECATED'?`<button class="btn pri" data-act="toolDeprecate" data-id="${t.id}">改为废弃</button>`:''}`);return}
    const deps=dependents(t.id);
    openModal(`下线工具 <span class="mono">${t.id}</span>`,`<p>${deps.length?`staging 依赖方 ${deps.map(a=>a.id).join('、')} 之后调用会返回 <code class="mono">TOOL_RETIRED</code>。`:'没有智能体依赖它，可以安全下线。'}</p><p class="mut" style="margin-top:6px">注册记录归档不删除，历史调用在审计中可查。</p>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn danger" data-act="toolRetireGo" data-id="${t.id}">确认下线</button>`)},
  toolRetireGo:d=>{const t=toolOf(d.id);t.st='RETIRED';addAudit({a:t.owner,u:'amy',act:'tool.retire',res:t.id,risk:'中',dec:'allowed'});closeModal();closeDrawer();drawTools();toast(`<b>${t.id}</b> 已下线`,'warn')},
  toolVersion:d=>{const t=toolOf(d.id);openModal(`发布新版本 <span class="mono">${t.id}</span>`,`<div class="radio" id="verRad">
    ${[['impl','只改内部实现','接口不变，直接发布，监控成功率和延迟'],['desc','改描述 / 参数说明 / 新增可选参数','会改变大模型的用法：自动对所有依赖方跑回归评测'],['break','破坏兼容（删参数、改返回格式）','不能改原工具：创建 '+t.id+'.v2，原工具进入废弃期'],['risk','调高风险等级','立即生效，通知依赖方']].map(([k,n,s],i)=>`<label class="${i===1?'on':''}"><input type="radio" name="vk" value="${k}" ${i===1?'checked':''}><span>${n}<small>${s}</small></span></label>`).join('')}</div><ul class="checks" id="verChecks" style="margin-top:12px"></ul>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" id="verGo" data-act="versionGo" data-id="${t.id}">发布</button>`);
    document.querySelectorAll('#verRad input').forEach(r=>r.onchange=()=>document.querySelectorAll('#verRad label').forEach(l=>l.classList.toggle('on',l.contains(r)&&r.checked)))},
  versionGo:d=>{const t=toolOf(d.id);const k=document.querySelector('#verRad input:checked').value;const nv='v'+(parseInt(t.ver.slice(1))+1);
    if(k==='impl'){closeModal();toast(`<b>${t.id}</b> 实现已更新，接口不变`);return}
    if(k==='risk'){const up={低:'中',中:'高',高:'高'};t.risk=up[t.risk];closeModal();openTool(t.id);drawTools();addAudit({a:t.owner,u:'amy',act:'tool.risk_up',res:t.id+' → '+t.risk,risk:'中',dec:'allowed'});toast(`<b>${t.id}</b> 风险已调为 ${t.risk}，已通知依赖方`,'warn');return}
    if(k==='break'){const nid=t.id+'.v2';if(!toolOf(nid))S.tools.push(Object.assign({},t,{id:nid,ver:'v1',st:'REGISTERED',calls:0,desc:t.desc+'（新版）'}));t.st='DEPRECATED';t.replaced=nid;t.deadline='2026-12-31';closeModal();openTool(t.id);drawTools();addAudit({a:t.owner,u:'amy',act:'tool.version',res:nid+' 创建，'+t.id+' 废弃',risk:'中',dec:'allowed'});toast(`已创建 <b>${nid}</b>，原工具进入废弃期`,'warn');return}
    const deps=dependents(t.id);$('#verGo').disabled=true;
    if(!deps.length){closeModal();t.ver=nv;openTool(t.id);drawTools();toast(`没有依赖方，<b>${t.id} ${nv}</b> 已上线`);return}
    $('#verChecks').innerHTML=deps.map(a=>`<li><span class="ic"></span>回归评测 ${a.id}<small></small></li>`).join('');
    const fail=deps.find(a=>a.id==='cs-bot'||a.id==='offshore-wind');
    runChecks('#verChecks',()=>{if(fail){addAudit({a:t.owner,u:'keel-gate',act:'tool.version',res:t.id+' '+nv+' 停在已注册',risk:'中',dec:'denied'});$('#mFoot').innerHTML=`<span class="mut" style="margin-right:auto;font-size:12px">${nv} 停在"已注册"，未上线</span><button class="btn" data-act="closeModal">关闭</button>`;toast(`<b>${fail.id}</b> 回归不达标，${t.id} ${nv} 未上线`,'bad')}else{t.ver=nv;closeModal();openTool(t.id);drawTools();addAudit({a:t.owner,u:'amy',act:'tool.version',res:t.id+' '+nv,risk:'低',dec:'allowed'});toast(`所有依赖方回归通过，<b>${t.id} ${nv}</b> 已上线`)}},a=>fail&&a===deps.indexOf(fail)?['no','引用接地 −3pt']:['ok','通过'])},
  regTool:()=>openModal('注册 MCP 工具',`<div class="field"><label>MCP 服务地址</label><input class="inp" style="width:100%" placeholder="http://ticket-mcp.shared.svc:8080/mcp"></div><div class="field"><label>所有者</label><input class="inp" style="width:100%" value="研发效能组"></div><p class="mut" style="font-size:12px">提交后平台读取工具列表，逐个确认读写属性、风险等级和审批策略。</p>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="regToolGo">读取工具列表</button>`),
  regToolGo:()=>{closeModal();toast('原型演示：实际会列出 MCP 服务提供的工具供逐个确认','info')},
  /* audit */
  audRisk:d=>{audRisk=d.k;resetPage('aud');VIEWS.audit($('#view'))},
  audit:d=>{const e=S.audit[+d.i];const h='sha256:'+(Math.abs([...e.t+e.act+e.res].reduce((s,c)=>s*31+c.charCodeAt(0)|0,7))).toString(16).padStart(8,'0');openDrawer(`审计事件 <span class="mono" style="font-size:13px;color:var(--mute)">${e.act}</span>`,`<div class="kv"><span>时间</span><b class="mono">2026-09-30 ${e.t}</b><span>智能体</span><b>${e.a}</b><span>操作人</span><b>${e.u}</b><span>资源</span><b>${e.res}</b><span>风险</span><b>${riskPill(e.risk)}</b><span>trace</span><b class="mono">${e.tr}</b></div>
    <h4 style="margin:16px 0 6px;color:var(--white);font-size:13px">payload（仅白名单字段，已脱敏）</h4><pre class="code">${JSON.stringify(e.payload,null,2)}</pre>
    <h4 style="margin:16px 0 6px;color:var(--white);font-size:13px">哈希链</h4><div class="kv"><span>hash</span><b class="mono">${h}…</b><span>prev_hash</span><b class="mono">sha256:41ab77…</b><span>链</span><b>${e.a} · 校验通过 <span class="pill p-ok">✓</span></b></div>`,e.tr!=='—'?`<button class="btn" data-act="toTrace" data-tr="${e.tr}">查看链路</button>`:'')},
  verify:()=>{const p=$('#verProg');p.style.display='block';const bar=p.firstElementChild;let x=0;const tm=setInterval(()=>{x+=5;bar.style.width=x+'%';if(x>=100){clearInterval(tm);setTimeout(()=>{p.style.display='none';bar.style.width=0;toast(`哈希链校验通过：${S.agents.length} 条链，12,${480+S.audit.length} 条事件，无断链`)},250)}},60)},
  exportAudit:()=>openModal('导出审计记录',`<p>导出前会自动创建审批单，由平台管理员批准后生成<b>脱敏</b>文件。</p><div class="field"><label>导出理由</label><input class="inp" id="expR" style="width:100%" placeholder="如：季度合规检查"></div>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="exportGo">提交申请</button>`),
  exportGo:()=>{closeModal();addAudit({a:'keel-audit',u:'amy',act:'data.export',res:'审计记录导出申请',risk:'高',dec:'pending'});
    S.approvals.unshift({id:'ap_'+Math.floor(Math.random()*9000+1000),subject:'data.export',ref:'audit_export · 自定义筛选',risk:'高',agent:'keel-audit',by:'安全负责人审批',ago:'刚刚',text:'amy 申请导出审计记录，理由："'+($('#expR')?.value||'未填写')+'"。批准后生成脱敏文件。'});
    updateBadge();toast('已提交导出申请，可在<b>审批中心 · 数据导出</b>查看','warn')},
  /* models */
  budget:d=>{const a=agentOf(d.id);openModal(`调整日预算 · ${a.id}`,`<div class="field"><label>日预算：<b id="bv" style="color:var(--white)">¥${a.budget}</b>（今日已用 ¥${a.cost.toFixed(2)}）</label><input type="range" id="bIn" min="10" max="200" step="5" value="${a.budget}"></div><p class="mut" style="font-size:12px">保存后同步写到 薄网关 虚拟 Key <span class="mono">${a.id}-${a.env}</span>，并记入审计。</p>`,`<button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="budgetGo" data-id="${a.id}">保存</button>`);$('#bIn').oninput=e=>$('#bv').textContent='¥'+e.target.value},
  budgetGo:d=>{const a=agentOf(d.id);const nv=+$('#bIn').value;addAudit({a:a.id,u:'amy',act:'config.change',res:`日预算 ¥${a.budget} → ¥${nv}`,risk:'中',dec:'allowed'});a.budget=nv;closeModal();VIEWS.models($('#view'));toast(`已更新 <b>${a.id}</b> 日预算为 ¥${nv}，薄网关 已同步`)}
};
function runChecks(sel,done,resultOf){
  const lis=[...document.querySelectorAll(sel+' li')];let i=0;
  const next=()=>{if(i>0){const [c,txt]=resultOf?resultOf(i-1):['ok',''];const ic=lis[i-1].querySelector('.ic');ic.className='ic '+c;ic.textContent=c==='ok'?'✓':'✗';const sm=lis[i-1].querySelector('small');if(sm&&txt)sm.textContent=txt}
    if(i>=lis.length){setTimeout(done,300);return}
    lis[i].querySelector('.ic').className='ic run';i++;setTimeout(next,420+Math.random()*260)};
  next();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t,e)}});

/* env */
document.querySelectorAll('#envsel button').forEach(b=>b.onclick=()=>{S.env=b.dataset.env;document.querySelectorAll('#envsel button').forEach(x=>x.classList.toggle('on',x===b));render();toast(`已切换到 <b>${b.textContent}</b>`,'info')});

/* palette */
let palIdx=0,palItems=[];
function palData(){return [...Object.entries(TITLES).filter(([k])=>k!=='create').map(([k,n])=>({ty:'页面',n,sub:'#/'+k,run:()=>go(k)})),{ty:'操作',n:'新建智能体',sub:'向导',run:()=>ACT.goCreate()},...S.agents.map(a=>({ty:'智能体',n:a.name,sub:a.id,run:()=>openAgent(a.id)})),...S.tools.map(t=>({ty:'工具',n:t.id,sub:t.owner,run:()=>{go('tools');setTimeout(()=>openTool(t.id),50)}}))]}
function drawPal(){const q=$('#palIn').value.trim().toLowerCase();palItems=palData().filter(x=>!q||(x.n+x.sub).toLowerCase().includes(q)).slice(0,12);palIdx=Math.min(palIdx,Math.max(palItems.length-1,0));$('#palList').innerHTML=palItems.map((x,i)=>`<li class="${i===palIdx?'on':''}" data-i="${i}"><span class="ty">${x.ty}</span>${x.n}<small>${x.sub}</small></li>`).join('')||'<li class="mut">没有匹配项</li>'}
function openPal(){$('#pal').classList.add('on');$('#mask').classList.add('on');$('#palIn').value='';palIdx=0;drawPal();setTimeout(()=>$('#palIn').focus(),30)}
function closePal(){$('#pal').classList.remove('on');if(!$('#drawer').classList.contains('on')&&!$('#modal').classList.contains('on'))$('#mask').classList.remove('on')}
$('#palIn').oninput=()=>{palIdx=0;drawPal()};
$('#palList').onclick=e=>{const li=e.target.closest('li[data-i]');if(li){closePal();palItems[+li.dataset.i].run()}};
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').classList.contains('on')?closePal():openPal();return}
  if($('#pal').classList.contains('on')){
    if(e.key==='ArrowDown'){palIdx=Math.min(palIdx+1,palItems.length-1);drawPal();e.preventDefault()}
    if(e.key==='ArrowUp'){palIdx=Math.max(palIdx-1,0);drawPal();e.preventDefault()}
    if(e.key==='Enter'&&palItems[palIdx]){closePal();palItems[palIdx].run()}
    if(e.key==='Escape')closePal();return}
  if(e.key==='Escape'){closeModal();closeDrawer()}
});
$('#mask').addEventListener('click',closePal);

updateBadge();render();
</script>
</body>
</html>
