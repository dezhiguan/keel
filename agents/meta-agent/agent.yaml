apiVersion: keel/v1
kind: Agent
metadata:
  name: meta-agent
  displayName: 元智能体
  owner: 研发效能组 / 官德志
spec:
  kind: workflow
  skills:
    - name: keel-project-development
      version: 1
  runtime:
    type: code
    language: python
    endpoint: http://meta-agent.keel-system.svc.cluster.local:8000
    liveness: k8s
  auth:
    audience: meta-agent
  models:
    default: chat-default
    budget:
      dailyCny: 50
  tools:
    - name: manifest.validate
      access: read
      risk: low
    - name: catalog.lookup
      access: read
      risk: low
    - name: scaffold.deliver
      access: write
      risk: mid
  guardrails:
    inputInjection: enforce
    indirectInjection: enforce
    taintedTool: approve
    canary: enforce
    pii: 'off'
  audit:
    captureFields: [target_agent, version, job_id]
  eval:
    dataset: meta-agent/v3-guardrails
    gate:
      minScore: 0.99
      maxRegression: 0.02
  prompts:
    source: langfuse
    items:
      - name: draft
        type: text
      - name: revise
        type: text
      - name: generate
        type: text
      - name: review
        type: text
      - name: expand
        type: text
