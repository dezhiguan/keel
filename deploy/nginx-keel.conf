# 控制台入口。这段在 Server 2 的 /opt/rag-forge/nginx.conf 末尾，标记为 KEEL_CONSOLE。
# 那份文件由 rag-forge 的入口部署覆盖，改这里的同时要改 rag-forge 仓库里的 nginx.conf。
#
# 上游是 Server 3 的控制台 NodePort。薄网关和 keel-server 没有对公网端口。

upstream keel_console {
    server 172.25.90.184:31110 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name keel.ragforge.net;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://keel.ragforge.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name keel.ragforge.net;

    ssl_certificate     /etc/nginx/ssl/ragforge/keel.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/keel.ragforge.net.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://keel_console;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host keel.ragforge.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
