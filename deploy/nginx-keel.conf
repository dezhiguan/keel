# 控制台入口。这段要合并进 rag-forge 仓库的 nginx.conf，
# 不要单独放在 Server 2 上 —— 下次 rag-forge 部署会覆盖单放的文件。
#
# 证书和 DNS 还没做。合并、nginx -t、签发 keel.ragforge.net 之前，
# 流水线只通过节点 NodePort 31110 冒烟，不依赖这个文件。
#
# 上游是 Server 3（与 askdb 的 172.25.90.184:31100 同一台）。
# 薄网关和 keel-server 没有 NodePort，不要在这里加它们的 location。

upstream keel_console {
    server 172.25.90.184:31110 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name keel.ragforge.net;
    return 301 https://keel.ragforge.net$request_uri;
}

server {
    listen 443 ssl;
    server_name keel.ragforge.net;

    # 证书尚未签发。合并前把这两行换成宿主机上的真实路径。
    ssl_certificate     /etc/nginx/ssl/ragforge/keel.ragforge.net.pem;
    ssl_certificate_key /etc/nginx/ssl/ragforge/keel.ragforge.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://keel_console;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              keel.ragforge.net;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
