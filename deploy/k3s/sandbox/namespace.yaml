# 研发沙箱。单独 apply，不进 keel-server 的发布脚本。
# 包镜像源地址还没写进仓库，出站先只放行 DNS，不放行 0.0.0.0/0。
apiVersion: v1
kind: Namespace
metadata:
  name: keel-devflow-sandbox
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox
  namespace: keel-devflow-sandbox
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "4"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress
  namespace: keel-devflow-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-server-sandbox
  namespace: keel-devflow-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-sandbox
  namespace: keel-devflow-sandbox
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-server-sandbox
  apiGroup: rbac.authorization.k8s.io
