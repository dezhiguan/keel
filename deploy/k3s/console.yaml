# 控制台。后端在 deploy/k3s/backend.yaml，由另一条作业发布。
apiVersion: v1
kind: Namespace
metadata:
  name: keel-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-console
  namespace: keel-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: keel-console }
  template:
    metadata:
      labels: { app: keel-console }
    spec:
      imagePullSecrets:
        - name: acr-cred
      containers:
        - name: keel-console
          image: PLACEHOLDER_CONSOLE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keel-console
  namespace: keel-system
spec:
  type: NodePort
  selector: { app: keel-console }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31110
