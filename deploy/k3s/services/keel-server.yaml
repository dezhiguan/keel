apiVersion: v1
kind: Namespace
metadata:
  name: keel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-agent-secrets
  namespace: keel-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-agent-secrets
  namespace: keel-system
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-agent-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-read-endpoints
  namespace: keel-system
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["keel-gateway", "keel-server", "keel-audit", "keel-llm"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-read-endpoints
  namespace: keel-system
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-read-endpoints
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-server
  namespace: keel-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: keel-server }
  template:
    metadata:
      labels: { app: keel-server }
    spec:
      imagePullSecrets:
        - name: acr-cred
      hostAliases:
        - ip: 172.25.90.183
          hostnames: ["jp.cloud.langfuse.com"]
      terminationGracePeriodSeconds: 30
      containers:
        - name: keel-server
          image: PLACEHOLDER_SERVER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: LANGFUSE_HOST
              value: https://jp.cloud.langfuse.com
            - name: KEEL_JWKS_BASE
              value: http://keel-server.keel-system.svc.cluster.local:8080
            - name: KEEL_LLM_BASE_URL
              value: http://keel-llm.keel-system.svc.cluster.local:8088
            - name: KEEL_LLM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-llm
                  key: admin-key
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: LANGFUSE_PROJECT_ID
                  optional: true
            - name: KEEL_CAREERMATE_ENDPOINT
              value: http://careermate-backend.careermate.svc.cluster.local:18080
            - name: KEEL_CAREERMATE_TOKEN
              value: keel-bridge
            - name: KEEL_AUTH_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: KEEL_AUTH_GATEWAY_URL
                  optional: true
            - name: KEEL_CONSOLE_AUTH_MODE
              value: authgw
            - name: KEEL_CONSOLE_PREVIEW_ENABLED
              value: "true"
            - name: KEEL_CONSOLE_CLIENT_PRIVATE_KEY
              value: |
