apiVersion: v1
kind: Namespace
metadata:
  name: keel-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-server
  namespace: keel-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: keel-server }
  template:
    metadata:
      labels: { app: keel-server }
    spec:
      imagePullSecrets:
        - name: acr-cred
      terminationGracePeriodSeconds: 30
      containers:
        - name: keel-server
          image: PLACEHOLDER_SERVER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: keel-server
                optional: false
          readinessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keel-server
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: keel-server }
  ports:
    - port: 8080
      targetPort: 8080
