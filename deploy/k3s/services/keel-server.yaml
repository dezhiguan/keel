            - name: RAGFORGE_BASE_URL
              value: http://ragforge-backend.ragforge.svc.cluster.local:8080
            - name: RAGFORGE_METRICS_USER
              value: metrics-reader
            - name: RAGFORGE_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_METRICS_PASSWORD
                  optional: true
          envFrom:
            - secretRef:
                name: keel-server
                optional: false
          readinessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keel-server
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: keel-server }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-read-ragforge-endpoints
  namespace: ragforge
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-ragforge-endpoints
  namespace: ragforge
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-read-ragforge-endpoints
  apiGroup: rbac.authorization.k8s.io
