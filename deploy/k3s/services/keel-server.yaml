apiVersion: v1
kind: Namespace
metadata:
  name: keel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-agent-secrets
  namespace: keel-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-agent-secrets
  namespace: keel-system
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-agent-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-read-endpoints
  namespace: keel-system
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["keel-gateway", "keel-server", "keel-audit", "keel-llm"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-read-endpoints
  namespace: keel-system
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-read-endpoints
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keel-server-watch-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keel-server-watch-agents
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: ClusterRole
  name: keel-server-watch-agents
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-server
  namespace: keel-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: keel-server }
  template:
    metadata:
      labels: { app: keel-server }
    spec:
      imagePullSecrets:
        - name: acr-cred
      hostAliases:
        - ip: 172.25.90.183
          hostnames: ["jp.cloud.langfuse.com"]
      terminationGracePeriodSeconds: 30
      containers:
        - name: keel-server
          image: PLACEHOLDER_SERVER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KEEL_SERVER_URL
              value: http://keel-server.keel-system.svc.cluster.local:8080
            - name: KEEL_SERVICE_AUDIENCE
              value: keel-server
            - name: KEEL_CI_CLIENT_ID
              value: keel-devflow-ci
            - name: KEEL_GIT_CI_URL
              value: http://git-ci.keel-system.svc.cluster.local:8000
            - name: KEEL_SANDBOX_IMAGE
              value: PLACEHOLDER_SANDBOX_IMAGE
            - name: KEEL_GIT_CI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-ci-github
                  key: KEEL_GIT_CI_TOKEN
            - name: KEEL_GIT_CI_MERGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-ci-github
                  key: KEEL_GIT_CI_MERGE_TOKEN
            - name: LANGFUSE_HOST
              value: https://jp.cloud.langfuse.com
            - name: KEEL_JWKS_BASE
              value: http://keel-server.keel-system.svc.cluster.local:8080
            - name: KEEL_LLM_BASE_URL
              value: http://keel-llm.keel-system.svc.cluster.local:8088
            - name: KEEL_LLM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-llm
                  key: admin-key
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: LANGFUSE_PROJECT_ID
                  optional: true
            - name: KEEL_CAREERMATE_ENDPOINT
              value: http://careermate-backend.careermate.svc.cluster.local:18080
            - name: KEEL_CAREERMATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: KEEL_CAREERMATE_TOKEN
            - name: KEEL_AUTH_GATEWAY_URL
              value: http://auth-gateway.auth-gateway.svc.cluster.local:8090
            - name: KEEL_CONSOLE_AUTH_MODE
              value: authgw
            - name: KEEL_CONSOLE_PREVIEW_ENABLED
              value: "true"
            - name: KEEL_CONSOLE_CLIENT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: KEEL_CONSOLE_CLIENT_PRIVATE_KEY
            - name: RAGFORGE_BASE_URL
              value: http://ragforge-backend.ragforge.svc.cluster.local:8080
            - name: RAGFORGE_JDBC_URL
              value: jdbc:postgresql://172.25.90.183:5432/ragforge
            - name: RAGFORGE_DB_USER
              value: ragforge
            - name: RAGFORGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_DB_PASSWORD
                  optional: true
            - name: RAGFORGE_METRICS_USER
              value: metrics-reader
            - name: RAGFORGE_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_METRICS_PASSWORD
                  optional: true
            - name: RAGFORGE_PROVISION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_TOKEN
                  optional: true
            - name: RAGFORGE_PROVISION_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_ACCOUNT
                  optional: true
            - name: RAGFORGE_PROVISION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_PASSWORD
                  optional: true
            - name: RAGFORGE_PROVISION_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_CLIENT_ID
                  optional: true
            - name: RAGFORGE_PROVISION_CLIENT_KID
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_CLIENT_KID
                  optional: true
            - name: RAGFORGE_PROVISION_ASSERTION_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_ASSERTION_AUDIENCE
                  optional: true
            - name: RAGFORGE_PROVISION_CLIENT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-server
                  key: RAGFORGE_PROVISION_CLIENT_PRIVATE_KEY
                  optional: true
          envFrom:
            - secretRef: {name: keel-meta-bridge, optional: true}
            - secretRef:
                name: keel-server
                optional: false
          readinessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keel-server
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: keel-server }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-read-ragforge-endpoints
  namespace: ragforge
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-ragforge-endpoints
  namespace: ragforge
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-read-ragforge-endpoints
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-eval-jobs
  namespace: agents
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-eval-jobs
  namespace: agents
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-eval-jobs
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-eval-jobs
  namespace: keel-system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-server-eval-jobs
  namespace: keel-system
subjects:
  - kind: ServiceAccount
    name: default
    namespace: keel-system
roleRef:
  kind: Role
  name: keel-eval-jobs
  apiGroup: rbac.authorization.k8s.io
