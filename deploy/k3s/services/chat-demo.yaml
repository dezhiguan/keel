apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-demo
  namespace: keel-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: chat-demo }
  template:
    metadata:
      labels: { app: chat-demo }
    spec:
      imagePullSecrets:
        - name: acr-cred
      hostAliases:
        - ip: 172.25.90.183
          hostnames: ["jp.cloud.langfuse.com"]
      containers:
        - name: chat-demo
          # 这台机器拉不到公网基础镜像，先复用已经在节点上的 echo-agent 运行时（同一份 Python SDK）。
          # 业务代码用 ConfigMap chat-demo-app 盖到 /app。专用镜像见 deploy/docker/chat-demo.Dockerfile。
          image: PLACEHOLDER_ECHO_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: KEEL_ENV
              value: dev
            - name: KEEL_LLM_BASE_URL
              value: http://keel-llm.keel-system.svc.cluster.local:8088
            - name: KEEL_SECRET_DIR
              value: /var/run/secrets/keel
          volumeMounts:
            - name: app
              mountPath: /app/app.py
              subPath: app.py
            - name: app
              mountPath: /app/agent.yaml
              subPath: agent.yaml
            - name: app
              mountPath: /app/prompts/answer.json
              subPath: answer.json
            - name: keel-chat-demo
              mountPath: /var/run/secrets/keel
              readOnly: true
          readinessProbe:
            httpGet: { path: /v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: app
          configMap:
            name: chat-demo-app
        - name: keel-chat-demo
          secret:
            secretName: keel-chat-demo
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: chat-demo
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: chat-demo }
  ports:
    - port: 8000
      targetPort: 8000
