apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-demo-app
  namespace: keel-system
data:
  app.py: |
    """Conversational test agent. One user turn is filled into the answer prompt and sent through ctx.llm.
    
    The generation span carries the Langfuse prompt name and version when the dev label is present.
    Secrets are read before the app is built and again on each request.
    """
    
    import json
    import os
    from pathlib import Path
    
    from keel import Agent
    
    
    def load_secret_files() -> None:
        root = Path(os.environ.get("KEEL_SECRET_DIR", "/var/run/secrets/keel"))
        if not root.is_dir():
            return
        for name in ("KEEL_LLM_KEY", "KEEL_LLM_BASE_URL", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_SECRET_KEY", "LANGFUSE_HOST"):
            path = root / name
            if path.is_file():
                os.environ[name] = path.read_text(encoding="utf-8").strip()
        if os.environ.get("LANGFUSE_PUBLIC_KEY") and os.environ.get("LANGFUSE_SECRET_KEY"):
            os.environ.setdefault("LANGFUSE_HOST", "https://jp.cloud.langfuse.com")
            os.environ.setdefault("KEEL_TRACE_BUFFER_PATH", "/tmp/keel-traces")
        base = os.environ.get("KEEL_LLM_BASE_URL", "").rstrip("/")
        if base and not base.endswith("/v1"):
            os.environ["KEEL_LLM_BASE_URL"] = base + "/v1"
    
    
    def messages_for(compiled) -> list[dict]:
        if isinstance(compiled, list):
            return compiled
        return [{"role": "user", "content": compiled}]
    
    
    os.environ.setdefault("KEEL_LLM_BASE_URL", "http://keel-llm.keel-system.svc.cluster.local:8088")
    os.environ.setdefault("KEEL_LLM_KEY", "pending")
    load_secret_files()
    
    agent = Agent.from_manifest(Path(__file__).with_name("agent.yaml"))
    
    
    @agent.entry
    async def chat(request, ctx):
        text = request.input.get("text") or ""
        prompt = await ctx.prompt("answer")
        reply = await ctx.llm.chat(messages_for(prompt.compile(question=text)), prompt=prompt)
        return ctx.final(reply or "")
    
    
    class SecretFiles:
        def __init__(self, app):
            self.app = app
    
        async def __call__(self, scope, receive, send):
            if scope.get("type") == "http":
                load_secret_files()
            await self.app(scope, receive, send)
    
    
    app = SecretFiles(agent.asgi())
    
    
    def prompt_sha256() -> str:
        """Same canonical hash keel-server uses when syncing a chat prompt."""
        import hashlib
    
        body = json.loads(Path(__file__).with_name("prompts").joinpath("answer.json").read_text(encoding="utf-8"))
        canonical = json.dumps(
            [{"role": item["role"], "content": item["content"]} for item in body],
            ensure_ascii=False,
            separators=(",", ":"),
        )
        return "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
  agent.yaml: |
    apiVersion: keel/v1
    kind: Agent
    metadata:
      name: chat-demo
      displayName: 对话测试
      owner: 研发效能组 / amy
      category: biz
    spec:
      interaction:
        mode: chat
      runtime:
        type: code
        language: python
        endpoint: http://chat-demo.keel-system.svc.cluster.local:8000
        liveness: k8s
      auth:
        audience: chat-demo
      models:
        default: qwen-plus
        budget:
          dailyCny: 20
      eval:
        dataset: chat-demo/smoke
      prompts:
        source: langfuse
        label: production
        items:
          - name: answer
            type: chat
  answer.json: |
    [
      {
        "role": "system",
        "content": "你是 Keel 平台的对话测试智能体，名字叫「对话测试」。用简短、清楚的中文回答。用户问你是谁时，要说明你是对话测试。不要编造平台里不存在的数据，也不要输出密钥。"
      },
      {
        "role": "user",
        "content": "{{question}}"
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-demo
  namespace: keel-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels: { app: chat-demo }
  template:
    metadata:
      labels:
        app: chat-demo
        keel.io/agent: chat-demo
        keel.io/env: dev
    spec:
      imagePullSecrets:
        - name: acr-cred
      hostAliases:
        - ip: 172.25.90.183
          hostnames: ["jp.cloud.langfuse.com"]
      containers:
        - name: chat-demo
          # 复用 echo-agent 镜像里的 Python SDK。这台机器拉不到公网基础镜像。
          # 业务代码用 ConfigMap chat-demo-app 盖到 /app。专用镜像见 deploy/docker/chat-demo.Dockerfile。
          image: PLACEHOLDER_ECHO_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: KEEL_ENV
              value: dev
            - name: KEEL_LLM_BASE_URL
              value: http://keel-llm.keel-system.svc.cluster.local:8088
            - name: KEEL_SECRET_DIR
              value: /var/run/secrets/keel
          volumeMounts:
            - name: app
              mountPath: /app/app.py
              subPath: app.py
            - name: app
              mountPath: /app/agent.yaml
              subPath: agent.yaml
            - name: app
              mountPath: /app/prompts/answer.json
              subPath: answer.json
            - name: keel-chat-demo
              mountPath: /var/run/secrets/keel
              readOnly: true
          readinessProbe:
            httpGet: { path: /v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: app
          configMap:
            name: chat-demo-app
        - name: keel-chat-demo
          secret:
            secretName: keel-chat-demo
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: chat-demo
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: chat-demo }
  ports:
    - port: 8000
      targetPort: 8000
