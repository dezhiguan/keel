apiVersion: v1
kind: PersistentVolume
metadata:
  name: qa-lifecycle-1016-data-pv
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /var/lib/rancher/k3s/storage/qa-lifecycle-1016-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [iz7xvj0bz5i6jpinys4duwz]
  claimRef:
    namespace: agents
    name: qa-lifecycle-1016-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qa-lifecycle-1016-data
  namespace: agents
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-lifecycle-1016
  namespace: agents
  labels: {app: qa-lifecycle-1016, keel.io/agent: qa-lifecycle-1016, keel.io/env: dev}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: qa-lifecycle-1016}
  template:
    metadata:
      labels: {app: qa-lifecycle-1016, keel.io/agent: qa-lifecycle-1016, keel.io/env: dev}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-cred
      hostAliases:
        - ip: "172.25.90.183"
          hostnames: ["jp.cloud.langfuse.com"]
      containers:
        - name: agent
          image: PLACEHOLDER_QA_AGENT_IMAGE
          envFrom:
            - secretRef: {name: keel-qa-lifecycle-1016}
          env:
            - name: KEEL_TRACE_BUFFER_PATH
              value: /tmp/keel-traces
          ports:
            - containerPort: 8000
          volumeMounts:
            - {name: data, mountPath: /app/.keel}
          readinessProbe:
            httpGet: {path: /v1/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 768Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: qa-lifecycle-1016-data}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-lifecycle-1016
  namespace: agents
spec:
  selector: {app: qa-lifecycle-1016}
  ports:
    - {port: 8000, targetPort: 8000}
