# 后端：薄网关和 keel-server。控制台在 deploy/k3s/console.yaml，由另一条作业发布。
apiVersion: v1
kind: Namespace
metadata:
  name: keel-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-llm
  namespace: keel-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app: keel-llm }
  template:
    metadata:
      labels: { app: keel-llm }
    spec:
      imagePullSecrets:
        - name: acr-cred
      terminationGracePeriodSeconds: 75
      containers:
        - name: keel-llm
          image: PLACEHOLDER_LLM_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: KEEL_LLM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: keel-llm
                  key: admin-key
            - name: KEEL_LLM_REDIS
              valueFrom:
                secretKeyRef:
                  name: keel-llm
                  key: redis-url
          envFrom:
            - secretRef:
                name: keel-llm-vendors
                optional: false
          readinessProbe:
            httpGet: { path: /health, port: 8088 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8088 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keel-llm
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: keel-llm }
  ports:
    - port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-server
  namespace: keel-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: keel-server }
  template:
    metadata:
      labels: { app: keel-server }
    spec:
      imagePullSecrets:
        - name: acr-cred
      terminationGracePeriodSeconds: 30
      containers:
        - name: keel-server
          image: PLACEHOLDER_SERVER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: keel-server
                optional: false
          readinessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/catalog, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keel-server
  namespace: keel-system
spec:
  type: ClusterIP
  selector: { app: keel-server }
  ports:
    - port: 8080
      targetPort: 8080
