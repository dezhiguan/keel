# 本地或单机试用。生产用 deploy/k3s/litellm/deployment.yaml。
# 镜像版本来自 LiteLLM 生产文档里给出的钉版本示例：v1.98.0。
services:
  redis:
    image: docker.io/redis:7.4.7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6380:6379"
  postgres:
    image: docker.io/postgres:17.6
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5434:5432"
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.98.0
    command: ["--config", "/app/config.yaml", "--num_workers", "1", "--port", "4000"]
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 4G
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - redis
      - postgres
