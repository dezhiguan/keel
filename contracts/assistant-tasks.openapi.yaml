openapi: 3.1.0
info: {title: Keel assistant analysis task tools, version: keel/v1}
paths:
  /api/v1/tools/keel.tasks.command/invoke:
    post:
      description: Private-key authenticated keel-assistant plus purpose-specific user context; staging only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation, _authorization, _session, _text]
              properties:
                operation: {enum: [create, prepare, supply, get, list, cancel, retry, receipt]}
                _authorization: {type: string, description: Short-lived task context; never a read ticket. Optional signed request_replay is a routing hint only; receipt revalidates all authority.}
                _session: {type: string}
                _text: {type: string, maxLength: 20000}
                task_id: {type: string, pattern: '^task_[a-f0-9]{32}$'}
                material: {type: string, maxLength: 12000}
                acknowledge_duplicate_cost: {type: boolean}
      responses:
        '200':
          description: Authoritative owner-scoped snapshot or list. get also includes up to two preserved attempts. Cancellation notes distinguish no invocation from stopping only future steps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - {$ref: '#/components/schemas/TaskSnapshot'}
                      - type: object
                        required: [items, limit]
                        properties:
                          items: {type: array, items: {$ref: '#/components/schemas/TaskSnapshot'}}
                          limit: {type: integer}
  /api/v1/tools/keel.tasks.execution/invoke:
    post:
      description: Same assistant only. Execution ticket is bound to an existing task and current fence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [_authorization, run_id]
              properties:
                _authorization: {type: string}
                run_id: {type: string, pattern: '^[a-f0-9]{32}$'}
                phase: {enum: [load, begin_model], default: load}
      responses:
        '200': {description: Minimum authorized task goal and material, never credentials}
  /api/v1/agents/{name}/task-scope:
    put:
      description: Authenticated owner administrator explicitly enables only this assistant/staging analysis scope.
      parameters:
        - {in: path, name: name, required: true, schema: {const: keel-assistant}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environment, enabled]
              properties:
                environment: {const: staging}
                enabled: {type: boolean}
      responses:
        '200': {description: Scope and two exact tool grants updated transactionally and audited}
components:
  schemas:
    TaskSnapshot:
      type: object
      required: [task_id, state]
      properties:
        task_id: {type: string}
        request_replayed: {type: boolean}
        replayed_operation: {type: string}
        state: {enum: [waiting_input, queued, running, waiting_authorization, validating, succeeded, failed, cancel_requested, cancelled, unknown]}
        revisions:
          type: array
          items:
            type: object
            properties:
              operation: {type: string}
              trace_id: {type: [string, 'null']}
              created_at: {type: string}
        cancellation_note: {type: [string, 'null']}
        attempts:
          type: array
          maxItems: 2
          items:
            type: object
            required: [attempt, state]
            properties:
              attempt: {type: integer}
              state: {type: string}
              report: {type: [string, 'null']}
              error: {type: [string, 'null']}
              acceptance: {type: [object, 'null']}
              cost_cny: {type: [number, 'null']}
