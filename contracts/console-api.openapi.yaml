openapi: 3.0.3

info:
  title: Keel 控制台 API
  version: 1.0.0-draft
  description: |
    keel-console 各页面消费的全部接口，由 keel-server 实现。研发任务页见 devflow 路径（草案，DF-2 实现）。

    这份文件是前端、mock 数据、后端实现三方的唯一事实来源：
    - 前端只调这里定义的接口，不直接调 Langfuse / 薄网关 / Prometheus
    - mock 数据由这份文件生成，接口切真时前端只改 baseURL
    - 后端 P1 按这份文件实现，字段不一致以这里为准

    和 keel/v1 五份契约的关系：那五份是智能体侧协议（/v1/invoke、审计事件、
    追踪属性、manifest、评测集），这份是控制面 REST API，两者独立演进。
    引用到的枚举值必须和 contracts/ 下对应 schema 保持一致。

servers:
  - url: https://keel.example.com/api/v1
    description: prod
  - url: http://localhost:5173/api/v1
    description: 本地 mock（MSW 拦截）

security:
  - cookieAuth: []

tags:
  - name: overview
    description: 总览页
  - name: agents
    description: 智能体列表 / 详情 / 新建向导
  - name: services
    description: 共享服务页
  - name: traces
    description: 链路追踪页
  - name: eval
    description: 评测中心
  - name: prompts
    description: 提示词
  - name: tools
    description: 工具注册表
  - name: approvals
    description: 审批
  - name: audit
    description: 审计中心
  - name: models
    description: 模型网关
  - name: devflow
    description: 研发任务（看板、详情、接管、批次、规则）
  - name: meta
    description: 当前用户、字典

paths:
  # ---------------------------------------------------------------- meta
  /me:
    get:
      tags: [meta]
      operationId: getCurrentUser
      summary: 当前用户与可见范围
      description: 前端据此控制菜单和按钮可见性；后端每个接口仍要再校验一次。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CurrentUser" }

  /auth/options:
    get:
      tags: [meta]
      operationId: getAuthOptions
      summary: 登录页可选项
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          methods:
                            type: array
                            items: { type: string, enum: [password, sms] }
                          previewEnabled: { type: boolean }

  /auth/captcha:
    get:
      tags: [meta]
      operationId: getCaptcha
      summary: 换一张图形验证码
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          captchaImage: { type: string }
                          challengeId: { type: string }

  /auth/sms/send:
    post:
      tags: [meta]
      operationId: sendLoginSms
      summary: 发送登录验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200":
          description: 无论手机号是否开通都返回已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent: { type: boolean }
                          expiresIn: { type: integer }

  /auth/login/password:
    post:
      tags: [meta]
      operationId: loginWithPassword
      summary: 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string }
                captcha: { type: string }
                challengeId: { type: string }
      responses:
        "200":
          description: 登录成功，token 只在 Set-Cookie 里
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CurrentUser" }

  /auth/login/sms:
    post:
      tags: [meta]
      operationId: loginWithSms
      summary: 短信验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CurrentUser" }

  /auth/refresh:
    post:
      tags: [meta]
      operationId: refreshSession
      summary: 用刷新 Cookie 换新的访问 Cookie
      security: []
      responses:
        "204":
          description: 已换新 Cookie

  /auth/logout:
    post:
      tags: [meta]
      operationId: logout
      summary: 退出控制台
      responses:
        "204":
          description: 已清除 Cookie

  # ---------------------------------------------------------------- 总览
  /insight/overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: 总览页全部数据
      description: 一次返回页面所需的全部内容，前端不做二次聚合。
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: range
          in: query
          schema: { type: string, enum: [today, 24h, 7d, 30d, all], default: 24h }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Overview" }

  /insight/agent-usage:
    get:
      tags: [agents]
      operationId: getAgentUsage
      summary: 智能体调用、成本和评测分
      description: |
        列表和抽屉先拿注册信息，再补这三项。24 小时调用来自 Langfuse 根节点，
        成本来自薄网关日花费，评测分来自一份实验汇总。累计调用和环比用本机 trace 记录，
        不在这条接口里翻 Langfuse 全量历史。
      parameters:
        - $ref: "#/components/parameters/Env"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/AgentSummary" }

  # ---------------------------------------------------------------- 智能体
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: 智能体列表
      description: 按 agent.created_at 从新到旧。创建时间相同再按 name 升序。
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: category
          in: query
          schema: { type: string, enum: [all, biz, dev], default: all }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AgentStatus" }
        - name: q
          in: query
          description: 按 id、名称、负责人模糊匹配
          schema: { type: string }
        - name: usage
          in: query
          description: 为 true 时在本页附带调用、成本和评测分。默认 false，页面另请求 /insight/agent-usage。
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/AgentSummary" }
    post:
      tags: [agents]
      operationId: registerAgent
      summary: 注册智能体（keel register / 新建向导第四步）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: 注册完成，返回自检报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SelfCheckReport" }
        "409":
          $ref: "#/components/responses/Error"

  /agents/{name}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: getAgent
      summary: 智能体详情（抽屉）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentDetail" }
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: 删除已下线的智能体
      description: |
        只允许 status=RETIRED。从注册中心列表、搜索、谱系中移除；审计和 Langfuse 里的链路、评测保留。
        名称不释放，之后同名注册返回 AGENT_NAME_TAKEN。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: 还没下线（AGENT_NOT_RETIRED）
          $ref: "#/components/responses/Error"

  /agents/{name}/self-check:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: recheckAgent
      summary: 重新执行注册环境自检并保存真实报告
      responses:
        "200":
          description: 自检已完成，passed 表示是否通过
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SelfCheckReport" }

  /agents/{name}/chat:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: chatWithAgent
      summary: 向已注册的智能体发一轮对话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                sessionId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        "200":
          description: 智能体的最终回复
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          text: { type: string }
                          traceId: { type: string, nullable: true }
        "404":
          $ref: "#/components/responses/Error"

  /agents/{name}/releases:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: releaseAgent
      summary: 发布（必须携带已通过的 gateRunId）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [env, gateRunId, image]
              properties:
                env: { type: string, enum: [staging, prod] }
                gateRunId: { type: string }
                image: { type: string, description: 研发员工必须提供不可变的 registry 镜像摘要（@sha256:64 位） }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ReleaseRecord" }
        "412":
          description: 门禁未通过，发布被拒
          $ref: "#/components/responses/Error"

  /agents/{name}/retire:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: retireAgent
      summary: 下线（吊销虚拟 Key、删 Secret、状态置 RETIRED）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [env]
              properties:
                env: { $ref: "#/components/schemas/EnvName" }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /agents/name-check:
    get:
      tags: [agents]
      operationId: checkAgentName
      summary: 新建向导第二步：名称可用性校验
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          available: { type: boolean }
                          reason:
                            type: string
                            nullable: true
                            description: 不可用时的原因，如「已被占用」「必须小写字母开头」

  /agents/manifest-preview:
    post:
      tags: [agents]
      operationId: previewManifest
      summary: 新建向导第四步：由表单生成 agent.yaml 预览
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          yaml: { type: string, description: agent.yaml 全文 }
                          warnings:
                            type: array
                            items: { type: string }

  /catalog:
    get:
      tags: [agents]
      operationId: getCatalog
      summary: 新建向导用的字典（模板、可选工具、知识库、模型、组织）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Catalog" }

  # ---------------------------------------------------------------- 共享服务
  /insight/services:
    get:
      tags: [services]
      operationId: getSharedServices
      summary: 共享服务页全部数据
      description: 服务健康来自 K8s 探测，指标来自 Prometheus，知识库来自 rag-forge。调用方和模型成本按环境过滤。知识库没有环境字段，不按环境拆开。平台组件表在服务健康之外给出命名空间和用量；研发沙箱读到 ResourceQuota 时 usage 为已用/配额，读不到时为空。
      parameters:
        - $ref: "#/components/parameters/Env"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SharedServices" }

  # ---------------------------------------------------------------- 链路追踪
  /insight/traces:
    get:
      tags: [traces]
      operationId: listTraces
      summary: trace 列表
      description: |
        原型里这一块是写死的五条「最近调用」，正式实现必须是真列表：
        可按智能体、状态、研发任务筛选，可分页。研发任务对应根节点属性 keel.devflow.job_id。
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: agent
          in: query
          description: 参与该 trace 的任一智能体，缺省为全部
          schema: { type: string }
        - name: status
          in: query
          description: ok / fallback / failed 按三档状态筛；blocked、pending 按拦截和未结束的挂起筛
          schema: { $ref: "#/components/schemas/TraceListStatus" }
        - name: multi
          in: query
          description: 为 true 时只返回参与智能体多于一个的 trace
          schema: { type: boolean }
        - name: minDurationMs
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: jobId
          in: query
          description: 研发任务号，对应根节点属性 keel.devflow.job_id。缺省为全部
          schema: { type: string, example: DF-0019 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              langfuseUrl:
                                type: string
                                description: Langfuse 项目的 Traces 页。项目未配置时省略
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/TraceSummary" }

  /insight/traces/{traceId}:
    parameters:
      - name: traceId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [traces]
      operationId: getTrace
      summary: trace 详情
      description: |
        keel-server 调 Langfuse Observations API v2 取全部节点后组装，
        再叠加 keel-audit 的审计事件和 keel-server 的审批记录。
        协作图、泳道时间线、调用树三种视图共用这一份 nodes 数据，前端不再二次请求。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TraceDetail" }
        "404":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------- 评测中心
  /eval/gates:
    get:
      tags: [eval]
      operationId: getEvalGates
      summary: 研发任务门禁与人工编写智能体的可见分、隐藏考题聚合分
      description: 只含已到门禁或已完成的研发任务，以及有评测分且没有研发任务的智能体。没有考题正文。分数没记到时对应字段为空。
      parameters:
        - $ref: "#/components/parameters/Env"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EvalGateBoard" }

  /eval/{agent}/latest:
    parameters:
      - name: agent
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [eval]
      operationId: getLatestEval
      summary: 最近一次门禁结论与分维度对比
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EvalResult" }

  /eval/{agent}/runs:
    parameters:
      - name: agent
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [eval]
      operationId: runEval
      summary: 手动运行一次回归
      responses:
        "202":
          description: 已接受，异步执行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          runId: { type: string }

  /eval/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [eval]
      operationId: getEvalRun
      summary: 回归进度
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          runId: { type: string }
                          state: { type: string, enum: [QUEUED, RUNNING, DONE, FAILED] }
                          error: { type: string, nullable: true }
                          progress: { type: number, format: float, description: 0~1 }
                          result:
                            type: object
                            nullable: true
                            allOf:
                              - $ref: "#/components/schemas/EvalResult"

  # ---------------------------------------------------------------- 提示词
  /prompts:
    get:
      tags: [prompts]
      operationId: listPrompts
      summary: 提示词列表，跟随顶栏环境
      parameters:
        - name: env
          in: query
          schema: { type: string, enum: [all, dev, test, staging, prod], default: all }
        - name: agent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PromptList" }
  /agents/{name}/prompts/sync:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [prompts]
      operationId: syncPrompts
      summary: 代码或 CI 上报 prompts/ 文件
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /agents/{name}/prompts/{prompt}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
    get:
      tags: [prompts]
      operationId: getPrompt
      summary: 提示词详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PromptDetail" }
  /agents/{name}/prompts/{prompt}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [prompts]
      operationId: getPromptVersion
      summary: 某一版原文
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PromptBody" }
  /agents/{name}/prompts/{prompt}/diff:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, required: true, schema: { type: integer } }
      - { name: to, in: query, required: true, schema: { type: integer } }
    get:
      tags: [prompts]
      operationId: diffPrompt
      summary: 服务端计算两个版本的差异
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PromptDiff" }
  /agents/{name}/prompts/{prompt}/versions:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
    post:
      tags: [prompts]
      operationId: createPromptVersion
      summary: 保存新版本，不挪标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                env: { type: string, enum: [dev, test, staging, prod], default: dev }
                fromSections: { type: boolean, description: 为真时用 config.keel.sections 编译正文 }
                config: { type: object, additionalProperties: true }
                commitMessage: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: { type: integer }
                          sha256: { type: string }
                          removedConstraints:
                            type: array
                            items: { $ref: "#/components/schemas/PromptConstraint" }
  /agents/{name}/prompts/{prompt}/trial:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
    post:
      tags: [prompts]
      operationId: trialPrompt
      summary: 用变量编译这一版提示词，不调用模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: { type: integer }
                          compiled: {}
  /agents/{name}/prompts/{prompt}/promote:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
    post:
      tags: [prompts]
      operationId: promotePrompt
      summary: 把 dev、test 或 staging 标签挪到指定版本
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /agents/{name}/prompts/{prompt}/rollback:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: prompt, in: path, required: true, schema: { type: string } }
    post:
      tags: [prompts]
      operationId: rollbackPrompt
      summary: 把 production 标签挪回发布过的版本
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /gate-results:
    post:
      tags: [prompts]
      operationId: recordGateResult
      summary: keel gate 回写实验结果并核对提示词版本
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  # ---------------------------------------------------------------- 渠道
  /agents/{name}/channels:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listChannels
      summary: 已发布的渠道、托管路径和嵌入代码
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [agents]
      operationId: publishChannel
      summary: 发布渠道并签发发布凭证。不发厂商密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, identity]
              properties:
                kind: { type: string, enum: [HOSTED, EMBED, WEB, MINIPROGRAM] }
                identity: { type: string, enum: [EXCHANGE, OPENID, ANONYMOUS] }
                origin: { type: string }
                quotaPerHour: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /agents/{name}/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [agents]
      operationId: revokeChannel
      summary: 下线渠道并立即停止其发布凭证的调用
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /agents/{name}/channels/entry:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      tags: [agents]
      operationId: enterChannel
      summary: 按 Origin 或小程序客户端 ID 校验已发布渠道。未登记返回 CHANNEL_ORIGIN_DENIED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  # ---------------------------------------------------------------- 用户记忆
  /agents/{name}/memories:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [agents]
      operationId: listUserMemories
      summary: 列出未删除的用户记忆
      parameters:
        - name: ownerUser
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [agents]
      operationId: writeUserMemory
      summary: 写入用户记忆。元智能体和评测流量被拒绝
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerUser, content]
              properties:
                ownerUser: { type: string }
                content: { type: string }
                evalRunId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /agents/{name}/memories/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [agents]
      operationId: deleteUserMemory
      summary: 删除一条用户记忆。审计只记条数和类别
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  # ---------------------------------------------------------------- 技能
  /skills:
    get:
      tags: [tools]
      operationId: listSkills
      summary: 技能注册表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/SkillSummary" }
    post:
      tags: [tools]
      operationId: publishSkill
      summary: 发布技能的一个新版本，不授予任何工具
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillPublishRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /agents/{name}/skills:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      tags: [tools]
      operationId: listAgentSkills
      summary: 已授权给这个智能体的技能
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/SkillGrant" }
    post:
      tags: [tools]
      operationId: grantSkill
      summary: 授权一版技能。不写工具授权，用例并入评测数据集
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              properties:
                name: { type: string }
                version: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name: { type: string }
                          version: { type: integer }
                          toolsGranted:
                            type: array
                            items: { type: string }
                            description: 始终为空。技能授权不授予工具
                          casesMerged: { type: integer }
  /agents/{name}/skills/{skill}:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - { name: skill, in: path, required: true, schema: { type: string } }
    get:
      tags: [tools]
      operationId: getAgentSkill
      summary: SDK 按需读取已授权技能的说明和示例
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  # ---------------------------------------------------------------- 工具
  /tools/{name}/invoke:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [tools]
      operationId: invokeSharedTool
      summary: 智能体凭 private_key_jwt 调用已授权的只读共享工具
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: 真实工具结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /tools:
    get:
      tags: [tools]
      operationId: listTools
      summary: 工具注册表
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: scope
          in: query
          schema: { type: string, enum: [all, PRIVATE, SHARED], default: all }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ToolStatus" }
        - name: risk
          in: query
          schema: { $ref: "#/components/schemas/Risk" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/ToolSummary" }
    post:
      tags: [tools]
      operationId: registerTool
      summary: 注册 MCP 工具
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolRegisterRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /tools/{name}:
    parameters:
      - $ref: "#/components/parameters/ToolName"
    get:
      tags: [tools]
      operationId: getTool
      summary: 工具详情（抽屉）：策略、依赖方、版本历史
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ToolDetail" }

  /tools/{name}/grants:
    parameters:
      - $ref: "#/components/parameters/ToolName"
    post:
      tags: [tools]
      operationId: grantTool
      summary: 把共享工具授权给智能体
      description: 只接受控制台用户。granted_by 取当前登录用户，不从正文读取。服务身份不能调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, versionRange]
              properties:
                agent: { type: string }
                versionRange: { type: string, maxLength: 128 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          description: 服务身份或只读会话
          $ref: "#/components/responses/Error"

  /tools/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/ToolName"
    post:
      tags: [tools]
      operationId: publishToolVersion
      summary: 发布新版本
      description: |
        描述或参数变化会触发所有依赖方回归评测。
        破坏兼容必须用新名字（如 work_order_create.v2），不能在原名上发版。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, schemaJson, breaking]
              properties:
                version: { type: string }
                description: { type: string }
                schemaJson: { type: object, additionalProperties: true }
                access: { $ref: "#/components/schemas/ToolAccess" }
                risk: { $ref: "#/components/schemas/Risk" }
                breaking: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          triggeredRegressions:
                            type: array
                            description: 被触发回归评测的依赖方
                            items: { type: string }
        "400":
          description: breaking=true 时必须改名
          $ref: "#/components/responses/Error"

  /tools/{name}/deprecate:
    parameters:
      - $ref: "#/components/parameters/ToolName"
    post:
      tags: [tools]
      operationId: deprecateTool
      summary: 废弃（必须给替代工具和截止日期）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacedBy, deadline]
              properties:
                replacedBy: { type: string }
                deadline: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /tools/{name}/retire:
    parameters:
      - $ref: "#/components/parameters/ToolName"
    post:
      tags: [tools]
      operationId: retireTool
      summary: 下线
      description: 有 prod 依赖方时返回 409，只能先废弃。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "409":
          description: 存在 prod 依赖，拒绝下线
          $ref: "#/components/responses/Error"

  /tools/{name}/dependents:
    parameters:
      - $ref: "#/components/parameters/ToolName"
    get:
      tags: [tools]
      operationId: listToolDependents
      summary: 依赖方（manifest 声明 + 30 天调用量）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ToolDependent" }

  # ---------------------------------------------------------------- 审批
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: 审批单列表
      description: 审批人只看得到分给自己的单子，由后端按当前用户过滤。
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
        - name: agent
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [devflow] }
          description: 为 devflow 时只返回带 devflowJobId 的审批单。缺省为全部
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/Approval" }
    post:
      tags: [approvals]
      operationId: openApproval
      summary: 发起审批单
      description: |
        导出、工具变更、智能体配置与下线都从这里建单。runId 非空时必须已经有对应的 agent_run。
        命中策略冷却期时不新建单，直接返回上一张 APPROVED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectType, subjectRef, summary, actorUser]
              properties:
                subjectType: { type: string, enum: [tool.call, tool.config, agent.config, agent.retire, data.export] }
                subjectRef: { type: string }
                summary: { type: string }
                actorUser: { type: string }
                agent: { type: string }
                risk: { $ref: "#/components/schemas/Risk" }
                runId: { type: string, nullable: true }
                traceId: { type: string }
                payloadDigest: { type: string }
                policyName: { type: string, nullable: true }
                env: { $ref: "#/components/schemas/EnvName" }
                consentId: { type: string, nullable: true, description: 可选。记到已有 run 上，供超时后换委托 token }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Approval" }
        "400":
          description: 参数不合法
          $ref: "#/components/responses/Error"
        "404":
          description: 策略、智能体或 run 不存在
          $ref: "#/components/responses/Error"

  /approvals/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: 批准 / 驳回
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                comment: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Approval" }
        "409":
          description: 单子已过期或已被处理
          $ref: "#/components/responses/Error"

  /runs:
    get:
      tags: [approvals]
      operationId: listSuspendedRuns
      summary: 挂起等人回话的执行
      description: 只返回 status=SUSPENDED 且 reason 为 input_required / handoff 的 run；reason=approval 的在 /approvals 里。
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: agent
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [devflow] }
          description: 为 devflow 时只返回带 devflowJobId 的挂起运行。缺省为全部
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/SuspendedRun" }
    post:
      tags: [approvals]
      operationId: openSuspendedRun
      summary: 登记一次等人回话的挂起
      description: reason 只接受 input_required 或 handoff。同一个 runId 再次登记且仍是同一挂起原因时返回原记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, agent, reason, prompt, actorUser]
              properties:
                runId: { type: string }
                agent: { type: string }
                env: { $ref: "#/components/schemas/EnvName" }
                traceId: { type: string }
                reason: { type: string, enum: [input_required, handoff] }
                prompt: { type: string }
                actorUser: { type: string }
                deadline: { type: string, format: date-time, nullable: true }
                checkpointRef: { type: string, nullable: true }
                consentId: { type: string, nullable: true, description: 可选。建任务时的 consent，超时恢复用 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SuspendedRun" }
        "400":
          description: 参数不合法
          $ref: "#/components/responses/Error"
        "404":
          description: 智能体不存在
          $ref: "#/components/responses/Error"
        "409":
          description: runId 已存在且不能再次挂起
          $ref: "#/components/responses/Error"

  /runs/{runId}/input:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      operationId: answerSuspendedRun
      summary: 回复挂起的执行。keel-server 据此调智能体的 /v1/runs/{id}/resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "409":
          description: 执行已不处于可恢复状态（RUN_NOT_RESUMABLE / RUN_EXPIRED）
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------- 质量中心
  /quality:
    get:
      tags: [quality]
      operationId: getQuality
      summary: 用户反馈与点踩案例
      parameters:
        - name: agent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/QualityReport" }
  /quality/cases:
    post:
      tags: [quality]
      operationId: addQualityCase
      summary: 把点踩调用加入智能体评测集
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, traceId]
              properties:
                agent: { type: string }
                traceId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/QualityCaseAdded" }

  # ---------------------------------------------------------------- 审计
  /audit/events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: 审计事件查询
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: agent
          in: query
          schema: { type: string }
        - name: risk
          in: query
          schema: { $ref: "#/components/schemas/Risk" }
        - name: action
          in: query
          schema: { $ref: "#/components/schemas/AuditAction" }
        - name: kind
          in: query
          schema: { type: string, example: devflow.stage }
          description: 可选。action=config.change 时按 payload.kind 等值过滤，如 devflow.stage、devflow.takeover、drift
        - name: decision
          in: query
          schema: { $ref: "#/components/schemas/AuditDecision" }
        - name: traceId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PageMeta"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/AuditEvent" }

  /audit/verify:
    post:
      tags: [audit]
      operationId: verifyAuditChain
      summary: 手动触发哈希链校验
      parameters:
        - name: agent
          in: query
          schema: { type: string, description: 缺省校验全部智能体 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          checked: { type: integer, description: 校验条数 }
                          intact: { type: boolean }
                          brokenAt:
                            type: string
                            nullable: true
                            description: 断链处的 eventId
                          elapsedMs: { type: integer }

  /audit/exports:
    post:
      tags: [audit]
      operationId: requestAuditExport
      summary: 申请导出（自动建审批单，批准后才生成脱敏文件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter]
              properties:
                filter:
                  type: object
                  additionalProperties: true
                  description: 与 /audit/events 相同的筛选条件
                reason: { type: string }
      responses:
        "202":
          description: 已建审批单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          exportId: { type: string }
                          approvalId: { type: string }

  # ---------------------------------------------------------------- 模型网关
  /insight/costs:
    get:
      tags: [models]
      operationId: getModelGateway
      summary: 模型网关页全部数据
      description: 模型与花费来自薄网关（人民币），单次调用明细在链路追踪页看（来自 Langfuse）。
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: range
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelGateway" }

  /insight/costs/export:
    get:
      tags: [models]
      operationId: exportModelBills
      summary: 导出当前窗口的账单
      parameters:
        - $ref: "#/components/parameters/Env"
        - name: range
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }

  /insight/costs/keys/{alias}/budget:
    post:
      tags: [models]
      operationId: updateModelBudget
      summary: 调整虚拟 Key 的人民币日预算
      description: 保存后写到薄网关这把虚拟 Key，并记一条 config.change 审计。日预算与控制台滑杆一致，¥10 到 ¥200，步长 ¥5。
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, example: askdb-dev }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyBudgetCny]
              properties:
                dailyBudgetCny: { type: number, format: float, minimum: 10, maximum: 200 }
      responses:
        "200":
          description: 已写到薄网关
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          alias: { type: string }
                          dailyBudgetCny: { type: number, format: float }

  /insight/route-policy:
    post:
      tags: [models]
      operationId: publishRoutePolicy
      summary: 发布路由策略
      description: objective 只能是 balanced、cost、latency。发布后版本加一。只允许平台管理员。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objective]
              properties:
                objective: { type: string, enum: [balanced, cost, latency] }
      responses:
        "200":
          description: 已发布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: { type: integer }
                          objective: { type: string, enum: [balanced, cost, latency] }

  /insight/route-policy/rollback:
    post:
      tags: [models]
      operationId: rollbackRoutePolicy
      summary: 回滚到上一版路由策略
      description: 只有一版时返回 400。只允许平台管理员。
      responses:
        "200":
          description: 已回滚
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: { type: integer }
                          objective: { type: string, enum: [balanced, cost, latency] }

  /insight/route/preview:
    post:
      tags: [models]
      operationId: previewRoute
      summary: 路由试算
      description: 与薄网关 POST /admin/v1/route/preview 一致。请求里写了模型就先用它。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, model]
              properties:
                alias: { type: string }
                model: { type: string }
      responses:
        "200":
          description: 试算结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version: { type: integer }
                          objective: { type: string, enum: [balanced, cost, latency] }
                          models:
                            type: array
                            items: { type: string }

  /keys/{alias}/rotate:
    post:
      tags: [models]
      operationId: rotateModelKey
      summary: 轮换虚拟 Key 并更新智能体 Secret
      description: 新 Key 明文仅在本次响应出现；旧版本立即失效。
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, example: askdb-dev }
      responses:
        "200":
          description: 已轮换
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          alias: { type: string }
                          key: { type: string, description: 只在本次响应返回的明文虚拟 Key }
                          version: { type: integer, minimum: 1 }

  # ---------------------------------------------------------------- 研发任务
  /devflow/jobs:
    get:
      tags: [devflow]
      operationId: listDevflowJobs
      summary: 研发任务看板
      description: summary 是顶部数字，不受筛选影响。items 受 query 筛选。首次门禁通过率在 DF-9d 之前可以是样本值。
      parameters:
        - name: layer
          in: query
          schema: { $ref: "#/components/schemas/DevflowLayer" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DevflowStatus" }
        - name: stage
          in: query
          schema: { $ref: "#/components/schemas/DevflowStage" }
        - name: batch
          in: query
          schema: { type: string, example: B-03 }
        - name: mine
          in: query
          schema: { type: boolean, default: false }
          description: 为 true 时只留当前用户提出的任务
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJobList" }
    post:
      tags: [devflow]
      operationId: createDevflowJob
      summary: 提交由智能体生产的需求
      description: 内存账本。研发类强制人机协作。元智能体不能改造。真实谱系校验归 DF-2。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevflowJobDraft" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJob" }
        "400":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    get:
      tags: [devflow]
      operationId: getDevflowJob
      summary: 研发任务详情
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJob" }
        "404":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/takeover:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: takeoverDevflowJob
      summary: 人工接管开发
      description: |
        允许：RUN 且阶段为 BUILD / REVIEW / GATE，或 FAIL，或 WAIT 且 needReview。
        接管后 status=HUMAN。阶段为 REVIEW 时回到 BUILD；阶段已过 GATE 时停在 GATE。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJob" }
        "400":
          description: 当前阶段不能接管
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/handback:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: handbackDevflowJob
      summary: 交还智能体或提交门禁
      description: 只接受 status=HUMAN。完成后 status=RUN、stage=REVIEW。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJob" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/assist:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: assistDevflowJob
      summary: 请智能体在指定范围内帮忙
      description: 只接受 status=HUMAN。instruction 去空白后不能为空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJob" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: cancelDevflowJob
      summary: 取消研发任务
      description: RUN / WAIT / HUMAN / QUEUED 可取消。阶段为 WATCH 时拒绝。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowJob" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/execution:
    get:
      operationId: getDevflowExecution
      tags: [devflow]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 持久化的元智能体执行状态；未接入的旧任务返回 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }
  /devflow/jobs/{jobId}/requirement:
    post:
      operationId: decideDevflowRequirement
      tags: [devflow]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevflowRequirementDecision" }
      responses:
        "200":
          description: 持久化的元智能体执行状态；未接入的旧任务返回 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }
  /devflow/jobs/{jobId}/retry:
    post:
      operationId: retryDevflowExecution
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback: { type: string, maxLength: 8000, description: 开发者补充明确澄清；在已有额度内继续，或按任务可用性主动开启一次五轮窗口，累计上限二十 }
      tags: [devflow]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 持久化的元智能体执行状态；未接入的旧任务返回 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }
  /devflow/jobs/{jobId}/review:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    get:
      tags: [devflow]
      operationId: getDevflowReview
      summary: 研发任务关口处理页数据
      description: |
        按 gate 返回需求确认（H1）、评测确认（H2）、发布审批（H4）或协作 review（PR）要展示的内容。
        关口决策沿用 `/runs/{runId}/input` 和 `/approvals/{id}/decision`，这里只读。
        隐藏考题只给条数和分数，任何时候都不返回内容。
        任务不存在 404 SERVER_NOT_FOUND；任务不在关口 409 RUN_NOT_RESUMABLE。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowReview" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/seed-cases:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: acceptDevflowSeedCases
      summary: 评测确认：采纳扩充用例并切出隐藏考题
      description: |
        元智能体执行任务由本请求完成 H2 确认并进入开发；旧 Run 任务随后仍用 `POST /runs/{runId}/input` 回复「确认」。
        acceptedCaseIds 之外的扩充用例不计分。隐藏考题由服务端随机切出，响应只有条数。
        任务不存在 404 SERVER_NOT_FOUND；任务不在 H2 409 RUN_NOT_RESUMABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedCaseIds]
              properties:
                acceptedCaseIds:
                  type: array
                  items: { type: string }
                cases:
                  type: array
                  description: 可选。带正文时服务端才切隐藏考题；只传 id 时隐藏考题条数为 0。响应仍不含正文。
                  items:
                    type: object
                    required: [caseId, input, expected, tags]
                    properties:
                      caseId: { type: string }
                      input: { type: object, additionalProperties: true }
                      expected: { type: object, additionalProperties: true }
                      tags:
                        type: array
                        items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [humanCount, holdoutCount, acceptedAgentCount]
                        properties:
                          humanCount: { type: integer }
                          holdoutCount: { type: integer }
                          acceptedAgentCount: { type: integer }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/human-seeds:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: uploadDevflowHumanSeeds
      summary: S2 上传人工种子用例，交给 meta-agent 扩充
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cases]
              properties:
                cases:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/DevflowSeedCase" }
      responses:
        "200":
          description: 已排队扩充评测集
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }

  /devflow/jobs/{jobId}/tool-grants:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: approveDevflowToolGrant
      summary: H3 平台管理员逐项批准候选研发员工的工具权限
      description: |
        H2 确认后可与 S3 开发并行进行。批准记录绑定任务、工具版本和审批人；
        注册候选员工时只接受与这些批准记录完全一致的工具清单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolName, versionRange]
              properties:
                toolName: { type: string }
                versionRange: { type: string, example: v1 }
      responses:
        "200":
          description: 已记录该工具的人工授权
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }
        "409":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/human-review/refresh:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: refreshDevflowHumanReview
      summary: S4 核验候选 PR 最新提交的人工 review 和分支保护
      responses:
        "200":
          description: 已读取并记录 GitHub 评审证据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }
        "409":
          $ref: "#/components/responses/Error"

  /devflow/jobs/{jobId}/code-review/run:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: runDevflowCodeReview
      summary: S4 读取精确候选提交并运行模型代码评审
      responses:
        "200":
          description: 已记录评审结论
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }

  /devflow/jobs/{jobId}/pipeline/run:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: runDevflowPipeline
      summary: 管理员启动底座的可信 staging 或 prod 流水线
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [env]
              properties:
                env: { type: string, enum: [staging, prod] }
      responses:
        "200":
          description: 流水线已请求；仅已通过审批的精确提交可执行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }

  /devflow/ci/jobs/{jobId}/{action}:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [context, prepare, ready, complete, status] }
    post:
      tags: [devflow]
      operationId: executeTrustedDevflowPipeline
      summary: 仅配置的可信 CI 身份调用；精确提交的快照、资源、自检和发布
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [env]
              properties:
                env: { type: string, enum: [staging, prod] }
                sha: { type: string, pattern: "^[0-9a-f]{40}$" }
                image: { type: string }
                gateRunId: { type: string }
                runUrl: { type: string, format: uri }
                status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
                message: { type: string }
      responses:
        "200":
          description: 可信流水线步骤结果；context 含候选文件与可见用例，不含隐藏内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }

  /devflow/jobs/{jobId}/h4/request:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: requestDevflowH4
      summary: staging 门禁通过后申请 git.pr.merge 高风险审批
      responses:
        "200":
          description: H4 审批已排队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }

  /devflow/jobs/{jobId}/h4/refresh:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    post:
      tags: [devflow]
      operationId: refreshDevflowH4
      summary: 重新核验 H4 审批并合并受保护的精确候选提交
      responses:
        "200":
          description: H4 状态已刷新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowExecution" }

  /devflow/jobs/{jobId}/stages/{stage}/report:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
      - name: stage
        in: path
        required: true
        schema: { $ref: "#/components/schemas/DevflowStage" }
    post:
      tags: [devflow]
      operationId: reportDevflowStage
      summary: 研发员工回写阶段结论
      description: |
        工具 devflow.stage.report 的提供方。调用方是该任务的研发员工服务身份，控制台用户不能代写。
        产物只存引用，不存原文。任务不存在 404 SERVER_NOT_FOUND。
        花费将超过预算时 409 DEVFLOW_BUDGET_EXCEEDED；修复轮次用完时 409 DEVFLOW_FIX_ROUNDS_EXHAUSTED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevflowStageReport" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobId, stage, attempt, status]
                        properties:
                          jobId: { type: string }
                          stage: { $ref: "#/components/schemas/DevflowStage" }
                          attempt: { type: integer }
                          status: { type: string, enum: [OK, FAILED] }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /devflow/sandbox/runs:
    post:
      tags: [devflow]
      operationId: startSandboxRun
      summary: 在沙箱里执行一次测试
      description: |
        工具 sandbox.run 的提供方。repo 必须在 keel-agents 组织下。
        报告截断到 64KB，truncated 为 true 表示被截断。超时 504 DEVFLOW_SANDBOX_TIMEOUT。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxRunRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SandboxRun" }

  /devflow/sandbox/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [devflow]
      operationId: getSandboxRun
      summary: 读取沙箱测试报告
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SandboxRun" }
        "404":
          $ref: "#/components/responses/Error"

  /devflow/holdout/{jobId}:
    parameters:
      - $ref: "#/components/parameters/DevflowJobId"
    get:
      tags: [devflow]
      operationId: getDevflowHoldout
      summary: CI 读取隐藏考题
      description: |
        只接受 CI 客户端身份。控制台和智能体不能调用，响应里才有用例内容。
        任务没有隐藏考题时 404 SERVER_NOT_FOUND。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowHoldout" }
        "404":
          $ref: "#/components/responses/Error"

  /devflow/holdout-results:
    post:
      tags: [devflow]
      operationId: submitDevflowHoldoutResult
      summary: CI 上报隐藏考题聚合分
      description: |
        只接受 CI 客户端身份。只收按 tag 的聚合分，不接收单条答案。
        未过门禁时 409 DEVFLOW_HOLDOUT_FAILED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevflowHoldoutResult" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "409":
          $ref: "#/components/responses/Error"

  /devflow/batches:
    get:
      tags: [devflow]
      operationId: listDevflowBatches
      summary: 研发任务批次
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/DevflowBatch" }
    post:
      tags: [devflow]
      operationId: createDevflowBatch
      summary: 创建批次
      description: 跳过 flag 非空的行。第一条试产为 RUN，其余 QUEUED。草案，校验归 DF-11。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rows]
              properties:
                title: { type: string }
                rows:
                  type: array
                  items: { $ref: "#/components/schemas/DevflowBatchPreviewRow" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowBatch" }
        "400":
          $ref: "#/components/responses/Error"

  /devflow/batches/preview:
    post:
      tags: [devflow]
      operationId: previewDevflowBatch
      summary: 预检需求表
      description: 草案。mock 返回固定的 5 行预检结果，文件解析归 DF-11。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [rows]
                        properties:
                          rows:
                            type: array
                            items: { $ref: "#/components/schemas/DevflowBatchPreviewRow" }

  /devflow/settings:
    get:
      tags: [devflow]
      operationId: getDevflowSettings
      summary: 研发任务规则
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowSettings" }
    put:
      tags: [devflow]
      operationId: updateDevflowSettings
      summary: 保存研发任务规则
      description: 仅平台管理员。模板列表不能为空。保存写 config.change 审计，归 DF-2。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevflowSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DevflowSettings" }
        "400":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-keel_console_at
      description: keel-server 写入的 HttpOnly Cookie，aud=keel-console。本地 http 去掉 __Host- 前缀。

  parameters:
    Env:
      name: env
      in: query
      schema: { type: string, enum: [all, dev, test, staging, prod], default: all }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, enum: [10, 20, 50, 100], default: 10 }
    AgentName:
      name: name
      in: path
      required: true
      schema: { type: string }
    ToolName:
      name: name
      in: path
      required: true
      schema: { type: string }
    DevflowJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, example: DF-0019 }

  responses:
    Error:
      description: 统一错误体
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    # ------------------------------------------------------------ 通用
    QualityReport:
      type: object
      required: [connected, feedbackCount, downCount, cases]
      properties:
        connected: { type: boolean }
        feedbackCount: { type: integer }
        downCount: { type: integer }
        downRate: { type: number, nullable: true, description: 点踩数 / 反馈数；没有反馈时为空 }
        cases:
          type: array
          items: { $ref: "#/components/schemas/QualityCase" }
    QualityCase:
      type: object
      required: [traceId, agent, added]
      properties:
        traceId: { type: string }
        agent: { type: string }
        input: { type: string }
        output: { type: string }
        comment: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        added: { type: boolean }
    QualityCaseAdded:
      type: object
      required: [dataset, itemId, traceId]
      properties:
        dataset: { type: string }
        itemId: { type: string }
        traceId: { type: string }
    Envelope:
      type: object
      required: [code, traceId]
      properties:
        code:
          type: string
          description: 成功固定为 OK，失败为 contracts/error-codes.yaml 里的错误码
          example: OK
        message: { type: string, nullable: true }
        traceId: { type: string }
        data: {}

    ApiError:
      type: object
      required: [code, message, traceId, retryable]
      properties:
        code: { type: string, example: TOOL_NOT_GRANTED }
        message: { type: string }
        traceId: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          description: 需要图形验证码时带 captchaImage 和 challengeId
          additionalProperties: true

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    EnvName:
      type: string
      enum: [dev, test, staging, prod]

    Risk:
      type: string
      enum: [LOW, MID, HIGH]

    AgentStatus:
      type: string
      description: |
        DRAFT 表示 keel new 预占了名称但还没 register。
        原型里的「门禁未过」不是独立状态，由 status=REGISTERED 且 gatePassed=false 推导。
      enum: [DRAFT, REGISTERED, ONLINE, DEGRADED, OFFLINE, RETIRED]

    NodeStatus:
      type: string
      description: 三档口径，来自 askdb trace.py。degraded 归入 fallback，不单列。
      enum: [ok, fallback, failed]

    TraceListStatus:
      type: string
      description: 列表筛选项。blocked 与 pending 不是 keel.status 的第四档，由护栏拦截和未结束的挂起推导。
      enum: [ok, fallback, failed, blocked, pending]

    ObservationType:
      type: string
      description: 与 langfuse.observation.type 一致
      enum: [agent, generation, tool, retriever, guardrail, event]

    ToolStatus:
      type: string
      enum: [REGISTERED, ONLINE, DEPRECATED, RETIRED]

    ToolAccess:
      type: string
      enum: [READ, WRITE, EXEC]

    ToolScope:
      type: string
      enum: [PRIVATE, SHARED]

    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]

    AuditAction:
      type: string
      description: 与 contracts/audit-event.schema.json 的 action 枚举完全一致，两边必须同时改。
      enum:
        [
          invoke,
          tool.call,
          sql.execute,
          approval,
          config.change,
          data.export,
          run.suspend,
          run.resume,
          agent.register,
          release.gate,
        ]

    AuditDecision:
      type: string
      enum: [allowed, denied, pending, approved, rejected]

    CurrentUser:
      type: object
      properties:
        userId: { type: string, example: u_88 }
        displayName: { type: string, example: amy }
        org: { type: string, example: 研发效能组 }
        platformRole: { type: string, enum: [ADMIN, OWNER, APPROVER, VIEWER] }
        roles:
          type: array
          description: auth-gateway 的 roles 多值 claim（P0-5 新增）
          items: { type: string }
        visibleAgents:
          type: array
          description: 空数组表示可见全部
          items: { type: string }
        pendingApprovals: { type: integer }
        mode: { type: string, enum: [USER, PREVIEW] }
        readOnly: { type: boolean }

    # ------------------------------------------------------------ 总览
    Overview:
      type: object
      properties:
        kpi: { $ref: "#/components/schemas/OverviewKpi" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentSummary" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        costByAgent:
          type: array
          items:
            type: object
            properties:
              agent: { type: string }
              costCny: { type: number, format: float }
              dailyBudgetCny: { type: number, format: float }
        cumulative:
          type: object
          properties:
            agents: { type: integer, description: 在册智能体，含已下线，不含已删除 }
            calls: { type: integer, nullable: true }
            tokens: { type: integer, nullable: true }
            costCny: { type: number, format: float, nullable: true }
            users: { type: integer, nullable: true, description: 去重用户，不是各天去重人数之和 }
            since: { type: string, format: date, nullable: true, description: 日账最早一天 }
        metrics:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              definition: { type: string }
              source: { type: string }
              connected: { type: boolean }
        layers:
          type: object
          description: 分层价值。分母为 0 的指标为空，页面显示未接入。无依据回答率没有落库来源，保持为空。
          properties:
            biz:
              type: object
              properties:
                resolutionPct: { type: number, format: float, nullable: true }
                handoffPct: { type: number, format: float, nullable: true }
                downvotePct: { type: number, format: float, nullable: true }
                ungroundedPct: { type: number, format: float, nullable: true }
            dev:
              type: object
              properties:
                firstPassPct: { type: number, format: float, nullable: true }
                withinRoundsPct: { type: number, format: float, nullable: true }
                avgDeliveryDays: { type: number, format: float, nullable: true }
                takeoverPct: { type: number, format: float, nullable: true }
            meta:
              type: object
              properties:
                produced: { type: integer, nullable: true }
                upgraded: { type: integer, nullable: true }
                avgGateScore: { type: number, format: float, nullable: true }
                humanPrPct: { type: number, format: float, nullable: true }

    OverviewKpi:
      type: object
      properties:
        onlineAgents: { type: integer, example: 7 }
        totalAgents: { type: integer, example: 10 }
        bizCount: { type: integer, example: 5 }
        devCount: { type: integer, example: 5 }
        calls: { type: integer, example: 13195 }
        callsTrendPct: { type: number, format: float, example: 8.2 }
        modelCostCny: { type: number, format: float, example: 101.10 }
        pendingModelBills: { type: integer, description: 窗口内 usage 缺失、尚未计费的调用数 }
        avgScore: { type: number, format: float, example: 0.86 }
        gateThreshold: { type: number, format: float, example: 0.85 }
        pendingApprovals: { type: integer, example: 3 }

    Alert:
      type: object
      properties:
        at: { type: string, format: date-time }
        level: { type: string, enum: [INFO, WARN, ERROR] }
        agent: { type: string, nullable: true }
        kind:
          type: string
          description: 对账 finding 或运行告警
          enum:
            [
              OFFLINE,
              UNREGISTERED,
              ZOMBIE,
              RETIRE_INCOMPLETE,
              VERSION_MISMATCH,
              BUDGET_WARN,
              GATE_FAILED,
              PROMPT_DRIFT,
              LLM_USAGE_MISSING,
              CHANNEL_FAULT,
            ]
        text: { type: string }
        link: { type: string, nullable: true }

    # ------------------------------------------------------------ 智能体
    AgentSummary:
      type: object
      properties:
        name: { type: string, example: offshore-wind }
        displayName: { type: string, example: 风机维检 }
        category: { type: string, enum: [biz, dev] }
        layer: { type: string, enum: [META, DEV, BIZ], description: 元智能体 / 研发 / 业务。缺省时控制台按 category 推断 }
        devflowJobId: { type: string, nullable: true, description: 生产或最近一次改造它的研发任务。没有则省略 }
        language: { type: string, example: Python }
        runtime: { type: string, enum: [code, dify] }
        template: { type: string, example: graph-agent }
        env: { $ref: "#/components/schemas/EnvName" }
        version: { type: string, example: v0.7.2 }
        status: { $ref: "#/components/schemas/AgentStatus" }
        statusNote:
          type: string
          nullable: true
          example: 0/1 就绪 · CrashLoop
        gatePassed: { type: boolean, nullable: true }
        ownerOrg: { type: string }
        ownerUser: { type: string }
        calls24h: { type: integer }
        callsTotal: { type: integer }
        p95Seconds: { type: number, format: float }
        costCny: { type: number, format: float }
        dailyBudgetCny: { type: number, format: float }
        score: { type: number, format: float, nullable: true }
        instances: { type: string, example: "2/2", description: 就绪/期望；Dify 为探活结果 }
        multiAgent: { type: boolean }
        delegateCount:
          type: integer
          description: spec.delegates 的个数，列表卡片用来显示「编排 N 个」

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSummary"
        - type: object
          properties:
            manifestYaml: { type: string }
            manifestHash: { type: string }
            execution:
              type: object
              description: 根据已保存 manifest 描述的执行形态与约束；未声明时字段可为空
              properties:
                current: { type: string }
                target: { type: string }
                constraints: { type: string }
            memory:
              type: object
              description: 四层状态。会话保留期为 keel-lite 的 7 天。用户、任务、经验条数来自 user_memory，评测流量不写入。元智能体与研发、业务的文案不同
              properties:
                session: { type: string }
                user: { type: string }
                task: { type: string }
                experience: { type: string }
            interaction:
              type: object
              description: manifest spec.interaction。缺省或没有 mode 时按 chat
              properties:
                mode: { type: string, enum: [chat, task, service, schedule] }
                schedule: { type: string, nullable: true, example: "0 2 * * *" }
                timezone: { type: string, nullable: true, example: Asia/Shanghai }
                trigger: { type: string, nullable: true, example: GitHub PR webhook }
            knowledgeBases:
              type: array
              items: { type: string }
            tools:
              type: array
              items: { type: string }
            models:
              type: array
              items: { type: string }
            delegates:
              type: array
              items: { type: string }
            selfCheck: { $ref: "#/components/schemas/SelfCheckReport" }
            elements: { $ref: "#/components/schemas/AgentElements" }
            instanceList:
              type: array
              items:
                type: object
                properties:
                  instanceId: { type: string }
                  source: { type: string, enum: [k8s, heartbeat, probe] }
                  version: { type: string }
                  ready: { type: boolean }
                  lastSeenAt: { type: string, format: date-time }
            resources:
              type: array
              description: 替它开通的外部资源，下线时按此回收
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [litellm_key, langfuse, secret, dataset, oauth_client]
                    description: litellm_key 是历史枚举值，语义为薄网关虚拟 Key
                  externalId: { type: string }
                  status: { type: string }
            versions:
              type: array
              items: { $ref: "#/components/schemas/ReleaseRecord" }
            findings:
              type: array
              description: 对账发现的问题
              items: { $ref: "#/components/schemas/Alert" }

    AgentElements:
      type: object
      required: [kind, items, missing]
      properties:
        kind: { type: string, enum: [agent, workflow] }
        items:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              passed: { type: boolean, nullable: true }
              detail: { type: string, nullable: true }
        missing:
          type: array
          items: { type: string }

    SelfCheckReport:
      type: object
      properties:
        passed: { type: boolean }
        checkedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: 高风险工具绑定审批策略 }
              passed: { type: boolean }
              detail: { type: string, nullable: true }

    ReleaseRecord:
      type: object
      properties:
        version: { type: string }
        env: { $ref: "#/components/schemas/EnvName" }
        gatePassed: { type: boolean }
        scoreTotal: { type: number, format: float, nullable: true }
        scoreByTag:
          type: object
          additionalProperties: { type: number, format: float }
        image: { type: string, nullable: true }
        ciRunUrl: { type: string, nullable: true }
        releasedBy: { type: string }
        releasedAt: { type: string, format: date-time }

    PromptList:
      type: object
      properties:
        langfuseUrl: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/PromptSummary" }
    PromptSummary:
      type: object
      additionalProperties: true
    PromptDetail:
      type: object
      additionalProperties: true
    PromptBody:
      type: object
      properties:
        version: { type: integer }
        type: { type: string, enum: [text, chat] }
        prompt: {}
        config: { type: object, additionalProperties: true }
        structure:
          type: object
          additionalProperties: true
          description: Langfuse config.keel。分段、变量 schema、输出契约和样例
        checks:
          type: array
          items:
            type: object
            properties:
              ok: { type: boolean }
              text: { type: string }
        variables:
          type: array
          items: { type: string }
    PromptConstraint:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        dimension: { type: string, description: 这条约束对应的评测维度 }
    PromptDiff:
      type: object
      properties:
        added: { type: integer }
        removed: { type: integer }
        lines:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [same, add, del] }
              text: { type: string }
        removedConstraints:
          type: array
          items: { $ref: "#/components/schemas/PromptConstraint" }

    RegisterRequest:
      type: object
      required: [name, env]
      description: 向导表单；后端据此生成 agent.yaml。字段与 manifest.schema.json 一一对应。
      properties:
        name: { type: string }
        displayName: { type: string }
        category: { type: string, enum: [biz, dev] }
        ownerOrg: { type: string }
        ownerUser: { type: string }
        env: { $ref: "#/components/schemas/EnvName" }
        runtime: { type: string, enum: [code, dify] }
        language: { type: string }
        template: { type: string }
        endpoint: { type: string }
        models:
          type: object
          properties:
            default: { type: string }
            fallback:
              type: array
              items: { type: string }
            dailyBudgetCny: { type: number, format: float }
            maxSteps: { type: integer }
        knowledgeBases:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { type: string }
        delegates:
          type: array
          items: { type: string }
        approvalPolicyId: { type: string, nullable: true }
        promptType:
          type: string
          enum: [text, chat]
          description: 声明 answer 提示词的类型。不传时按 text。Langfuse 建出版本后不能改。

    Catalog:
      type: object
      properties:
        templates:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: graph-agent }
              name: { type: string, example: 多步推理 }
              description: { type: string }
              language: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSummary" }
        knowledgeBases:
          type: array
          items:
            type: object
            properties:
              kb: { type: string }
              owner: { type: string }
        models:
          type: array
          items: { type: string }
        orgs:
          type: array
          items: { type: string }
        approvalPolicies:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string, example: 班组长审批 }

    # ------------------------------------------------------------ 共享服务
    SharedServices:
      type: object
      properties:
        services:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: rag-forge }
              role: { type: string, example: 知识检索 }
              instances: { type: string, example: "2/2 · worker 1" }
              p95: { type: string, nullable: true, example: 0.78s }
              errorRate: { type: string, example: 0.6%（429） }
              status: { type: string, enum: [ONLINE, DEGRADED, OFFLINE] }
              impact: { type: string, nullable: true, description: 这个组件不可用时会影响什么 }
        capabilities:
          type: array
          description: 在 manifest 里声明后使用的能力。状态来自健康探测，没有探测时为空。
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              provides: { type: string }
              users: { type: string, nullable: true }
              manifestField: { type: string }
              grant: { type: string }
              status: { type: string, nullable: true, enum: [ONLINE, DEGRADED, OFFLINE] }
        components:
          type: array
          description: 平台组件。状态沿用服务健康探测。研发沙箱另读 ResourceQuota 和沙箱账本；读不到配额时 status 与 usage 为空，控制台显示未接入。
          items:
            type: object
            properties:
              name: { type: string, example: keel-devflow-sandbox }
              namespace: { type: string, example: keel-devflow-sandbox }
              status: { type: string, nullable: true, enum: [ONLINE, DEGRADED, OFFLINE] }
              usage:
                type: string
                nullable: true
                description: 核数、内存、运行中的 Job 和排队。没有配额数据时为空
                example: "1.5 / 4 核 · 3 / 8Gi · 运行 2 · 排队 0"
              note: { type: string, nullable: true, example: 一次性 Job，10 分钟超时，只出包镜像源 }
              impact: { type: string, nullable: true, description: 这个组件不可用时会影响什么 }
        ragforge:
          type: object
          properties:
            kpi:
              type: object
              properties:
                searches24h: { type: integer }
                searchTrendPct: { type: number, format: float }
                p95Seconds: { type: number, format: float }
                p50Seconds: { type: number, format: float }
                throttleRate: { type: number, format: float }
                kbCount: { type: integer }
                staleKbCount: { type: integer }
                modelCostCny: { type: number, format: float }
            stageLatency:
              type: array
              description: 分段耗时。有直方图分位时用 p50Ms；现网只有 sum/count 时用 meanMs。
              items:
                type: object
                properties:
                  stage: { type: string, enum: [rewrite, vector, keyword, rerank, other] }
                  p50Ms: { type: integer }
                  meanMs: { type: integer }
                  basis: { type: string, enum: [p50, mean] }
            callers:
              type: array
              items:
                type: object
                properties:
                  agent: { type: string }
                  calls: { type: integer }
            knowledgeBases:
              type: array
              items:
                type: object
                properties:
                  kb: { type: string }
                  owner: { type: string }
                  documents: { type: integer }
                  updatedAt: { type: string, format: date-time }
                  searches24h: { type: integer }
                  zeroHitRate: { type: number, format: float }
                  recallAt5: { type: number, format: float }
                  stale: { type: boolean, description: 超过 30 天未更新 }

    # ------------------------------------------------------------ 链路追踪
    TraceSummary:
      type: object
      properties:
        traceId: { type: string, example: tr_8a31f0c2 }
        question: { type: string }
        startedAt: { type: string, format: date-time }
        sessionId: { type: string }
        turn: { type: integer }
        userId: { type: string }
        userRole: { type: string, nullable: true }
        env: { $ref: "#/components/schemas/EnvName" }
        rootAgent: { type: string }
        agents:
          type: array
          items: { type: string }
        multiAgent: { type: boolean }
        durationMs: { type: integer, description: 智能体耗时，不含人工等待 }
        humanWaitMs: { type: integer, nullable: true }
        tokens: { type: integer }
        costCny: { type: number, format: float }
        status: { $ref: "#/components/schemas/NodeStatus" }
        blocked: { type: boolean, description: 被护栏或准入拦截 }
        cached: { type: boolean }
        pendingReason: { type: string, nullable: true, description: 仍在挂起时的原因。空表示当前没有等人 }
        runId: { type: string, nullable: true }
        suspendCount: { type: integer, nullable: true, description: 这次调用挂起过的次数。没有挂起则省略 }
        devflowJobId: { type: string, description: 根节点属性 keel.devflow.job_id。没有研发任务时省略, example: DF-0019 }
        devflowLabel: { type: string, description: 根节点属性 keel.devflow.label，行上跟在任务号后面。没有时省略, example: 第 2 轮门禁 }

    TraceDetail:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/TraceSummary" }
        langfuseUrl: { type: string, description: "深链 {langfuse}/project/{id}/traces/{traceId}" }
        agents:
          type: array
          description: 参与方，决定协作图与图例的配色
          items:
            type: object
            properties:
              key: { type: string, example: wind }
              name: { type: string, example: offshore-wind }
              subtitle: { type: string, example: 子智能体 · 跨服务 }
              color: { type: string, example: "#2ec4b6" }
              kind: { type: string, enum: [platform, supervisor, sub, service, human] }
        latencyBreakdown:
          type: array
          description: 关键路径构成，各项之和等于 durationMs
          items:
            type: object
            properties:
              label: { type: string, example: offshore-wind }
              ms: { type: integer }
              agentKey: { type: string }
        costBreakdown:
          type: array
          items:
            type: object
            properties:
              agentKey: { type: string }
              costCny: { type: number, format: float }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TraceNode" }
        edges:
          type: array
          description: 协作图连线；泳道视图用它画交接点
          items:
            type: object
            properties:
              from: { type: string, description: 节点 id }
              to: { type: string }
              label: { type: string, nullable: true, example: 委派 ① }
              atMs: { type: integer, nullable: true }
              parallel: { type: boolean }

    TraceNode:
      type: object
      properties:
        id: { type: string }
        agentKey: { type: string }
        type: { $ref: "#/components/schemas/ObservationType" }
        name: { type: string, example: rag.fault-manual }
        shortName: { type: string, nullable: true, example: 检索手册 }
        service: { type: string, example: rag-forge }
        startMs: { type: integer, description: 相对 trace 起点 }
        durationMs: { type: integer }
        humanWaitLabel: { type: string, nullable: true, example: 4m12s }
        status: { $ref: "#/components/schemas/NodeStatus" }
        depth: { type: integer }
        criticalPath: { type: boolean }
        aggregated: { type: boolean, description: agent 节点，耗时与成本含子节点 }
        model: { type: string, nullable: true }
        fallbackFrom: { type: string, nullable: true }
        llmKeyAlias: { type: string, nullable: true }
        tokensIn: { type: integer, nullable: true }
        tokensOut: { type: integer, nullable: true }
        tokens: { type: integer, nullable: true }
        costCny: { type: number, format: float, nullable: true }
        attempts:
          type: array
          description: 薄网关对这次模型调用的每次尝试
          items:
            type: object
            properties:
              attemptId: { type: string }
              requestId: { type: string }
              model: { type: string }
              status: { type: string, enum: [SETTLED, PENDING, FAILED] }
              costCny: { type: number, format: float, nullable: true }
              priceVersion: { type: string }
              routeVersion: { type: string }
        inputSummary: { type: string, description: Langfuse observation 的 input，没有时用节点名 }
        outputSummary: { type: string, description: Langfuse observation 的 output，没有时用节点名 }
        auditIds:
          type: array
          items: { type: string }
        approvalId: { type: string, nullable: true }
        gateNote: { type: string, nullable: true, example: 评测：askdb v1.9.0 门禁 0.88 通过 }
        deprecatedTool: { type: boolean }
        promptName: { type: string, nullable: true, description: generation 上的 langfuse.observation.prompt.name }
        promptVersion: { type: integer, nullable: true }
        promptFallback: { type: boolean, description: keel.prompt.fallback，用了本地副本 }

    # ------------------------------------------------------------ 评测
    EvalResult:
      type: object
      properties:
        agent: { type: string }
        dataset: { type: string, example: offshore-wind/inspection }
        caseCount: { type: integer }
        prodVersion: { type: string }
        candidateVersion: { type: string }
        scoreTotal: { type: number, format: float }
        passed: { type: boolean }
        gate:
          type: object
          properties:
            minScore: { type: number, format: float }
            maxRegression: { type: number, format: float }
            byTag: { type: boolean }
        reason: { type: string, nullable: true, example: 「安全规程合规」下降 6pt }
        ranAt: { type: string, format: date-time }
        dimensions:
          type: array
          items:
            type: object
            properties:
              tag: { type: string, example: 安全规程合规 }
              cases: { type: integer }
              prodScore: { type: number, format: float }
              candidateScore: { type: number, format: float }
              deltaPt: { type: number, format: float }
              verdict: { type: string, enum: [IMPROVED, TOLERATED, EXCEEDED] }
        newFailures:
          type: array
          items:
            type: object
            properties:
              caseId: { type: string }
              input: { type: string }
              tags:
                type: array
                items: { type: string }
              reason: { type: string }
        devflowJobId:
          type: string
          nullable: true
          description: 由研发流水线生产时的任务号。人工编写的智能体省略。
        holdout:
          type: object
          nullable: true
          description: 隐藏考题聚合分。没有用例正文。
          properties:
            score: { type: number, format: float }
            minScore: { type: number, format: float }
            cases: { type: integer }
        langfuseUrl:
          type: string
          nullable: true
          description: "深链 {langfuse}/project/{id}/datasets/{datasetId}/experiments。数据集 id 缺失时落到该项目的数据集列表"

    EvalGateBoard:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              agent: { type: string }
              jobId: { type: string, nullable: true, description: 为空表示人工编写 }
              visible: { type: number, format: float, nullable: true, description: 可见用例分。没有记录时为空 }
              holdout: { type: number, format: float, nullable: true, description: 隐藏考题聚合分。人工编写或尚未记分时为空 }
              passed: { type: boolean, nullable: true, description: 可见分保留两位后达到 0.80。没有可见分时为空 }

    # ------------------------------------------------------------ 工具
    SkillSummary:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        ownerOrg: { type: string }
        description: { type: string }
        source: { type: string, enum: [AUTHORED, EXPERIENCE] }
        tools:
          type: array
          items: { type: string }
        risk: { type: string, enum: [LOW, MID, HIGH] }
        users:
          type: array
          items: { type: string }
    SkillGrant:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        description: { type: string }
        tools:
          type: array
          items: { type: string }
        risk: { type: string, enum: [LOW, MID, HIGH] }
        status: { type: string, enum: [GRANTED] }
    SkillPublishRequest:
      type: object
      required: [name, ownerOrg, description, instructions]
      properties:
        name: { type: string }
        ownerOrg: { type: string }
        description: { type: string }
        source: { type: string, enum: [AUTHORED, EXPERIENCE] }
        instructions: { type: string }
        tools:
          type: array
          items: { type: string }
        examples:
          type: array
          items: { type: string }
        cases:
          type: array
          items:
            type: object
            required: [input]
            properties:
              id: { type: string }
              input: { type: string }
              expectedOutput: { type: string }
    ToolSummary:
      type: object
      properties:
        name: { type: string, example: work_order_create }
        description: { type: string }
        scope: { $ref: "#/components/schemas/ToolScope" }
        ownerAgent: { type: string, nullable: true }
        ownerOrg: { type: string, nullable: true }
        access: { $ref: "#/components/schemas/ToolAccess" }
        risk: { $ref: "#/components/schemas/Risk" }
        version: { type: string }
        status: { $ref: "#/components/schemas/ToolStatus" }
        approvalPolicy: { type: string, nullable: true, example: 班组长审批 }
        calls24h: { type: integer }
        dependentCount: { type: integer }
        replacedBy: { type: string, nullable: true }
        deprecateDeadline: { type: string, format: date, nullable: true }

    ToolDetail:
      allOf:
        - $ref: "#/components/schemas/ToolSummary"
        - type: object
          properties:
            provider: { type: string, nullable: true, description: MCP 服务地址 }
            schemaJson: { type: object, additionalProperties: true }
            dependents:
              type: array
              items: { $ref: "#/components/schemas/ToolDependent" }
            versions:
              type: array
              items:
                type: object
                properties:
                  version: { type: string }
                  change: { type: string }
                  breaking: { type: boolean }
                  at: { type: string, format: date-time }

    ToolDependent:
      type: object
      properties:
        agent: { type: string }
        env: { $ref: "#/components/schemas/EnvName" }
        agentStatus: { $ref: "#/components/schemas/AgentStatus" }
        declaredInManifest: { type: boolean }
        calls30d: { type: integer }

    ToolRegisterRequest:
      type: object
      required: [name, scope, access, risk, provider, schemaJson]
      properties:
        name: { type: string }
        description: { type: string }
        scope: { $ref: "#/components/schemas/ToolScope" }
        provider: { type: string, description: MCP 服务地址 }
        access: { $ref: "#/components/schemas/ToolAccess" }
        risk: { $ref: "#/components/schemas/Risk" }
        approvalPolicyId: { type: string, nullable: true }
        schemaJson: { type: object, additionalProperties: true }

    # ------------------------------------------------------------ 审批
    Approval:
      type: object
      properties:
        id: { type: string, example: ap_0912 }
        subjectType:
          type: string
          description: 草案（P3-1 定稿）。与 approval_request.subject_type 一致，见 docs/specs/p0/P0-1a-run-lifecycle.md
          enum: [tool.call, tool.config, agent.config, agent.retire, data.export]
        subjectRef: { type: string, description: 工具名 / 智能体名 / 导出申请 id }
        runId: { type: string, nullable: true, description: 非空表示有一次执行正挂起等这张单 }
        policyName: { type: string, nullable: true, example: 班组长审批 }
        agent: { type: string }
        tool: { type: string, description: 仅 subjectType=tool.* 时有值；新代码用 subjectRef }
        risk: { $ref: "#/components/schemas/Risk" }
        traceId: { type: string }
        actorUser: { type: string }
        summary:
          type: string
          description: 人可读的动作摘要；不含完整 payload，原文需另走审批接口
        payloadDigest: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        devflowJobId: { type: string, nullable: true, description: 这张单属于哪个研发任务。没有则省略，审批中心按此归入「研发任务」分组 }
        devflowGate:
          type: string
          nullable: true
          enum: [H1, H2, H4]
          description: 研发任务关口。审批单上只会是 H4（subjectType=tool.call、subjectRef=git.pr.merge）

    SuspendedRun:
      type: object
      description: 草案（P3-1 定稿）。挂起等人回话的执行，没有审批单；审批中心「人工介入」一组的数据来源
      properties:
        runId: { type: string, example: r_7b4a }
        agent: { type: string }
        env: { $ref: "#/components/schemas/EnvName" }
        traceId: { type: string }
        reason: { type: string, enum: [input_required, handoff] }
        prompt: { type: string, description: 要问用户的话 / 交接说明 }
        actorUser: { type: string }
        createdAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time, nullable: true }
        devflowJobId: { type: string, nullable: true, description: 这次挂起属于哪个研发任务。没有则省略 }
        devflowGate:
          type: string
          nullable: true
          enum: [H1, H2, H4]
          description: 研发任务关口。挂起运行上只会是 H1 / H2（reason=input_required）

    # ------------------------------------------------------------ 审计
    AuditEvent:
      type: object
      description: 与 contracts/audit-event.schema.json 同构，额外带 hash、prevHash、hashVerified 供详情展示哈希链
      properties:
        eventId: { type: string }
        ts: { type: string, format: date-time }
        agent: { type: string }
        env: { $ref: "#/components/schemas/EnvName" }
        traceId: { type: string, nullable: true }
        actor:
          type: object
          properties:
            userId: { type: string }
            orgId: { type: string, nullable: true }
            role: { type: string, nullable: true }
        action: { $ref: "#/components/schemas/AuditAction" }
        resource: { type: string }
        risk: { $ref: "#/components/schemas/Risk" }
        decision: { $ref: "#/components/schemas/AuditDecision" }
        approver: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
          description: 只含 manifest captureFields 白名单字段，已脱敏
        inputDigest: { type: string }
        hashVerified: { type: boolean }
        hash: { type: string, description: 本事件 sha256 hex }
        prevHash: { type: string, nullable: true, description: 同智能体链上一条的 hash，链头为空 }

    # ------------------------------------------------------------ 模型网关
    ModelGateway:
      type: object
      properties:
        pendingCount: { type: integer, description: 当前窗口待计费调用数 }
        nextCursor: { type: string, nullable: true, description: 账单下一页游标。为空表示没有下一页 }
        bills:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              requestId: { type: string }
              alias: { type: string }
              agent: { type: string }
              model: { type: string }
              inputTokens: { type: integer, nullable: true }
              outputTokens: { type: integer, nullable: true }
              costCny: { type: number, format: float, nullable: true }
              reservedCny: { type: number, format: float, nullable: true }
              status: { type: string, enum: [SETTLED, PENDING, FAILED] }
              attemptId: { type: string }
              traceId: { type: string, nullable: true }
              priceVersion: { type: string }
              routeVersion: { type: string }
              cacheTokens: { type: integer, nullable: true }
        models:
          type: array
          items:
            type: object
            properties:
              model: { type: string, example: qwen-plus }
              provider: { type: string, example: DashScope }
              role: { type: string, example: 主力 }
              calls: { type: integer }
              p95: { type: string, example: 4.6s, description: 窗口内延迟 P95，没有样本时为空 }
              errorRate:
                type: number
                format: float
                description: 窗口内超时次数 / 调用次数。没有延迟或超时样本时为空
              costCny: { type: number, format: float }
              status: { type: string, enum: [ok, warn, bad] }
              priceConfigured:
                type: boolean
                description: 薄网关是否为该模型配置了单价；为 false 时表示配置漂移
              priceVersion: { type: string, description: 当前单价版本 }
              inputCnyPerToken: { type: number, format: float, nullable: true, description: 输入单价，人民币 / token。页面按每百万 token 展示 }
              outputCnyPerToken: { type: number, format: float, nullable: true, description: 输出单价，人民币 / token。页面按每百万 token 展示 }
              cacheCnyPerToken: { type: number, format: float, nullable: true, description: 缓存命中单价，人民币 / token }
              embedding: { type: boolean, description: 向量模型，不参与降级 }
              health: { type: string, enum: [CONFIGURED, PROBED, LIVE], description: 已配置、已探测、有真实调用 }
              drift: { type: boolean, description: 最近一条已结算账单的价格版本与当前版本不同 }
        keys:
          type: array
          items:
            type: object
            properties:
              alias: { type: string, example: offshore-wind-prod }
              version: { type: integer, minimum: 1, description: 虚拟 Key 当前版本 }
              agent: { type: string }
              env: { $ref: "#/components/schemas/EnvName" }
              models:
                type: array
                items: { type: string }
              dailyBudgetCny: { type: number, format: float }
              spentCny: { type: number, format: float }
              reservedCny: { type: number, format: float, description: 尚未结算的模型请求预留额 }
              status: { type: string, enum: [ACTIVE, BLOCKED] }
              rpm: { type: integer, nullable: true, description: 每分钟请求上限。为空表示不限制 }
              tpm: { type: integer, nullable: true, description: 每分钟 token 上限。为空表示不限制 }
              concurrency: { type: integer, nullable: true, description: 并发上限。为空表示不限制 }
        routePolicy:
          type: object
          nullable: true
          properties:
            version: { type: integer }
            objective: { type: string, enum: [balanced, cost, latency] }
        alertRules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              metric: { type: string, enum: [budget, usage_missing, channel_failure] }
              threshold: { type: number, format: float }
              window: { type: string }
              groupBy: { type: string }
        routing:
          type: array
          description: 由各智能体 manifest 生成，写入薄网关的虚拟 Key
          items:
            type: object
            properties:
              agent: { type: string }
              default: { type: string }
              fallback:
                type: array
                items: { type: string }
              timeoutSeconds: { type: integer }

    # ------------------------------------------------------------ 研发任务
    DevflowLayer:
      type: string
      enum: [META, DEV, BIZ]
    DevflowKind:
      type: string
      enum: [CREATE, CHANGE]
    DevflowMode:
      type: string
      enum: [AUTO, COLLAB, SCAFFOLD]
    DevflowStatus:
      type: string
      enum: [RUN, WAIT, HUMAN, QUEUED, DONE, FAIL, CANCEL]
    DevflowStage:
      type: string
      description: SPEC 需求、H1 需求确认、EVAL 评测准备、H2 评测确认、H3 授权、BUILD 开发、REVIEW 评审、GATE 门禁、H4 发布审批、RELEASE 发布、WATCH 上线观察
      enum: [SPEC, H1, EVAL, H2, H3, BUILD, REVIEW, GATE, H4, RELEASE, WATCH]
    DevflowSeed:
      type: object
      required: [human, agent, holdout]
      properties:
        human: { type: integer, description: 人给用例条数，含稍后切出的隐藏考题 }
        agent: { type: integer, description: 智能体扩充并被采纳的条数 }
        holdout: { type: integer, description: 隐藏考题条数。接口不返回考题内容 }
    DevflowToolRef:
      type: object
      required: [name, risk, owner]
      properties:
        name: { type: string }
        risk: { $ref: "#/components/schemas/Risk" }
        owner: { type: string }
    DevflowEvent:
      type: object
      required: [at, actor, summary]
      properties:
        at: { type: string, description: 展示用时间，短格式，如 10:53 或 10-07 }
        actor: { type: string }
        summary: { type: string }
    DevflowJobDraft:
      type: object
      required: [title, targetAgent, goal]
      properties:
        title: { type: string }
        targetAgent: { type: string }
        layer: { $ref: "#/components/schemas/DevflowLayer" }
        kind: { $ref: "#/components/schemas/DevflowKind" }
        mode: { $ref: "#/components/schemas/DevflowMode" }
        goal: { type: string }
        template: { type: string }
        dailyBudgetCny: { type: number, format: float }
        seedCount: { type: integer }
        tools:
          type: array
          items: { type: string }
        knowledge:
          type: array
          items: { type: string }
        delegates:
          type: array
          description: 协作模板可委派的已登记智能体 ID；由平台校验并写入 manifest
          items: { type: string }
        ownerOrg: { type: string }
        users: { type: string }
        io: { type: string }
        success: { type: string }
        execution: { type: boolean, description: 显式使用元智能体最小闭环；仅管理员 DEV/CREATE/COLLAB }
    DevflowJob:
      type: object
      required: [jobId, title, layer, kind, mode, status, stage, targetAgent, producerAgent, template, spentCny, budgetCny, fixRounds, maxFixRounds, needReview, requester, ownerOrg, goal, tools, knowledge, seed, events]
      properties:
        jobId: { type: string, example: DF-0019 }
        title: { type: string }
        layer: { $ref: "#/components/schemas/DevflowLayer" }
        kind: { $ref: "#/components/schemas/DevflowKind" }
        mode: { $ref: "#/components/schemas/DevflowMode" }
        status: { $ref: "#/components/schemas/DevflowStatus" }
        stage: { $ref: "#/components/schemas/DevflowStage" }
        targetAgent: { type: string }
        producerAgent: { type: string }
        template: { type: string }
        spentCny: { type: number, format: float }
        budgetCny: { type: number, format: float }
        fixRounds: { type: integer }
        maxFixRounds: { type: integer }
        batchId: { type: string, nullable: true }
        needReview: { type: boolean, description: 人机协作，等待人工 approve PR }
        humanDevUser: { type: string, nullable: true }
        watchDay: { type: integer, nullable: true, description: 上线观察第几天，从 1 起 }
        requester: { type: string }
        ownerOrg: { type: string }
        goal: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/DevflowToolRef" }
        knowledge:
          type: array
          items: { type: string }
        seed: { $ref: "#/components/schemas/DevflowSeed" }
        events:
          type: array
          items: { $ref: "#/components/schemas/DevflowEvent" }
    DevflowBoardSummary:
      type: object
      required: [active, queued, dailyLimit, waitingHuman, humanDev, firstGatePassRate, withinRoundsPassRate, spentCny]
      properties:
        active: { type: integer }
        queued: { type: integer }
        dailyLimit: { type: integer }
        waitingHuman: { type: integer, description: 等需求确认、评测确认、发布审批或人工 review 的任务数 }
        humanDev: { type: integer }
        firstGatePassRate: { type: number, format: float, description: 0 到 1。DF-9d 之前为样本值 }
        withinRoundsPassRate: { type: number, format: float }
        spentCny: { type: number, format: float }
    DevflowJobList:
      type: object
      required: [summary, items]
      properties:
        summary: { $ref: "#/components/schemas/DevflowBoardSummary" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DevflowJob" }
    DevflowBatch:
      type: object
      required: [batchId, title, requester, concurrency, pilotJobId, pilotPassed, createdAt, jobs]
      properties:
        batchId: { type: string, example: B-03 }
        title: { type: string }
        requester: { type: string }
        concurrency: { type: integer }
        pilotJobId: { type: string }
        pilotPassed: { type: boolean }
        createdAt: { type: string }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/DevflowJob" }
    DevflowBatchPreviewRow:
      type: object
      required: [targetAgent, title, mode, owner]
      properties:
        targetAgent: { type: string }
        title: { type: string }
        mode: { $ref: "#/components/schemas/DevflowMode" }
        owner: { type: string }
        flag:
          type: string
          nullable: true
          description: "预检问题。为空表示可生产。用 bad: 或 warn: 前缀区分严重程度"
    DevflowSettings:
      type: object
      required: [budgetCny, maxFixRounds, holdoutPercent, minSeed, keyCapCny, dailyLimit, concurrency, templates]
      properties:
        budgetCny: { type: number, format: float }
        maxFixRounds: { type: integer }
        holdoutPercent: { type: integer }
        minSeed: { type: integer }
        keyCapCny: { type: number, format: float }
        dailyLimit: { type: integer }
        concurrency: { type: integer }
        templates:
          type: array
          items: { type: string }
    DevflowStageReport:
      type: object
      required: [status, summary]
      properties:
        status: { type: string, enum: [OK, FAILED] }
        summary: { type: string }
        traceId: { type: string }
        costCny: { type: number, format: float }
        artifact:
          type: object
          required: [kind, ref, origin]
          properties:
            kind: { type: string, enum: [SPEC, MANIFEST, CODE, EVALSET, REVIEW, GATE_REPORT] }
            ref: { type: string, description: git sha、数据集名或报告 id }
            sha256: { type: string }
            origin: { type: string, enum: [HUMAN, AGENT] }
    SandboxRunRequest:
      type: object
      required: [jobId, repo, ref]
      properties:
        jobId: { type: string }
        repo: { type: string, description: keel-agents 组织下的仓库名, example: refund-explainer }
        ref: { type: string, pattern: '^[0-9a-f]{40}$', description: 绑定测试结果的不可变 Git commit SHA, example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }
    SandboxRun:
      type: object
      required: [runId, status, truncated]
      properties:
        runId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, DONE, FAILED, TIMEOUT] }
        report: { type: string, description: 测试报告，最长 64KB }
        truncated: { type: boolean }
    DevflowHoldout:
      type: object
      required: [jobId, cases]
      properties:
        jobId: { type: string }
        cases:
          type: array
          items:
            type: object
            required: [caseId, input, expected, tags]
            properties:
              caseId: { type: string }
              input: { type: object, additionalProperties: true }
              expected: { type: object, additionalProperties: true }
              tags:
                type: array
                items: { type: string }
    DevflowHoldoutResult:
      type: object
      required: [jobId, byTag]
      properties:
        jobId: { type: string }
        gateRunId: { type: string, description: 研发员工环境门禁的不可复用运行 ID }
        sha: { type: string, description: staging 候选 PR 或 prod 合并提交的精确 SHA }
        image: { type: string, description: 门禁实测的不可变镜像摘要 }
        env: { type: string, enum: [staging, prod] }
        visibleByTag:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        byTag:
          type: array
          items:
            type: object
            required: [tag, score, count]
            properties:
              tag: { type: string }
              score: { type: number, format: float }
              count: { type: integer, minimum: 0 }
    DevflowRequirementDecision:
      type: object
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [CONFIRM, REVISE] }
        expectedVersion: { type: integer, minimum: 1 }
        feedback: { type: string }
        users: { type: string }
        io: { type: string }
        success: { type: string }
    DevflowExecution:
      type: object
      required: [jobId, phase, version, revisions, requirement]
      properties:
        jobId: { type: string }
        phase: { type: string, enum: [QUEUED, RUNNING, WAITING, WAITING_SEEDS, WAITING_EVAL, DELIVERING, SANDBOX_PENDING, SANDBOX_RUNNING, WAITING_REVIEW, STAGING_READY, STAGING_GATE_PASSED, WAITING_H4, RELEASING, WATCHING, DONE, DELIVERED, FAILED, CANCELLED] }
        version: { type: integer }
        revisions: { type: integer }
        requirement: { type: object, additionalProperties: true }
        draft:
          type: object
          required: [spec, manifestYaml]
          properties:
            spec: { $ref: "#/components/schemas/DevflowReview/properties/specSheet" }
            manifest: { type: object, additionalProperties: true }
            manifestYaml: { type: string }
        delivery:
          type: object
          required: [repo, number, sha, url, branch]
          properties:
            repo: { type: string }
            number: { type: integer }
            sha: { type: string }
            url: { type: string, format: uri }
            branch: { type: string }
            protection: { type: string, enum: [ENFORCED, UNAVAILABLE], description: 任务仓库分支保护；UNAVAILABLE 时平台拒绝合并和发布 }
            checks: { type: string, enum: [MANUAL, ENABLED], description: ENABLED 表示 .github/workflows/keel.yml 已随交付提交，首次推送会触发 CI。MANUAL 只用于旧记录 }
            capabilityStatus: { type: string, enum: [UNVERIFIED, SCAFFOLD], description: 候选代码尚未通过岗位行为验证 }
            runtimeAdapterVersion: { type: string, description: 可信运行适配模板版本 }
            gateStatus: { type: string, enum: [NOT_RUN], description: staging 门禁尚未执行 }
        traceId: { type: string }
        sandboxRunId: { type: string }
        sandboxStatus: { type: string, enum: [PASS, FAILED] }
        sandboxAttemptLimit: { type: integer, minimum: 1, maximum: 20, description: 当前有上限的沙箱修复窗口终点 }
        runtimeAdapterUpdateAvailable: { type: boolean, description: 协作候选缺少当前运行适配，可以保留岗位代码更新模板并重新验证审批 }
        repairFeedbackAvailable: { type: boolean, description: 当前任务可接受开发者补充澄清后继续修复 }
        repairFeedbackCreatesWindow: { type: boolean, description: 原自动窗口已耗尽，本次明确澄清将主动开启一次最多五轮的新窗口，累计上限二十轮 }
        manualRepairWindows: { type: integer, minimum: 0, maximum: 1, description: 开发者补充澄清后主动开启的新修复窗口次数 }
        pipeline:
          type: object
          properties:
            env: { type: string, enum: [staging, prod] }
            sha: { type: string }
            status: { type: string, enum: [DISPATCHED, RUNNING, SUCCEEDED, FAILED] }
            startedAt: { type: string, format: date-time }
            runUrl: { type: string, format: uri }
            message: { type: string }
            evaluationFailed: { type: boolean, description: 可信 CI 确认运行评测失败，允许在 staging 发起有上限的岗位修复 }
        gateRepairRounds: { type: integer, minimum: 0, maximum: 1, description: staging 真实门禁失败后的岗位修复窗口次数 }
        infrastructureRefreshes: { type: integer, minimum: 0, maximum: 2, description: 可信工作流模板刷新次数；每次均重新验证候选 SHA }
        reviewRepairRounds: { type: integer, minimum: 0, maximum: 1, description: 评审阶段岗位功能修正次数；新提交必须重跑沙箱及评审 }
        s4RepairRounds: { type: integer, minimum: 0, maximum: 1, description: S4 模型代码评审失败后的专项修正次数；新提交必须重跑沙箱及评审 }
        sandboxAttempts:
          type: array
          items:
            type: object
            required: [attempt, sha, runId, status, report]
            properties:
              attempt: { type: integer, minimum: 1 }
              sha: { type: string, pattern: "^[0-9a-f]{40}$" }
              runId: { type: string }
              status: { type: string, enum: [PASS, FAILED] }
              report: { type: string }
        toolGrants:
          type: array
          items:
            type: object
            required: [toolName, versionRange, grantedBy]
            properties:
              toolName: { type: string }
              versionRange: { type: string }
              grantedBy: { type: string }
        pendingToolGrants:
          type: array
          items: { type: string }
        humanReview:
          type: object
          required: [repo, number, headSha, protection, ready, reviewers, approved]
          properties:
            repo: { type: string }
            number: { type: integer }
            headSha: { type: string }
            protection: { type: string, enum: [ENFORCED, UNAVAILABLE] }
            ready: { type: boolean }
            reviewers:
              type: array
              items: { type: string }
            approved: { type: boolean }
        modelReview:
          type: object
          required: [sha, reviewer, approved, checks, findings]
          properties:
            sha: { type: string }
            reviewer: { type: string }
            approved: { type: boolean }
            checks: { type: object, additionalProperties: { type: boolean } }
            findings:
              type: array
              items:
                type: object
                required: [path, line, severity, detail]
                properties:
                  path: { type: string }
                  line: { type: integer }
                  severity: { type: string, enum: [HIGH, MID, LOW] }
                  detail: { type: string }
        modelReviewTraceId: { type: string }
        gate:
          type: object
          required: [runId, sha, env, passed, visibleScore, hiddenScore]
          properties:
            runId: { type: string }
            sha: { type: string }
            image: { type: string, description: staging 门禁实测镜像摘要 }
            env: { type: string, enum: [staging] }
            passed: { type: boolean }
            visibleScore: { type: number }
            hiddenScore: { type: number }
        prodGate:
          type: object
          required: [runId, sha, env, passed, visibleScore, hiddenScore]
          properties:
            runId: { type: string }
            sha: { type: string, description: H4 合并提交 }
            image: { type: string, description: prod 门禁实测镜像摘要 }
            env: { type: string, enum: [prod] }
            passed: { type: boolean }
            visibleScore: { type: number }
            hiddenScore: { type: number }
        h4ApprovalId: { type: string }
        mergeSha: { type: string, description: H4 批准后 GitHub 确认的合并提交 }
        watchStartedAt: { type: string, format: date-time }
        watchImage: { type: string, description: 已核对 Deployment 就绪的生产镜像摘要 }
        watchObservations:
          type: array
          items:
            type: object
            required: [day, quality, costCny, budgetCny, calls, healthy, observedAt]
            properties:
              day: { type: string, format: date }
              quality: { type: number }
              costCny: { type: number }
              budgetCny: { type: number }
              calls: { type: integer }
              healthy: { type: boolean }
              observedAt: { type: string, format: date-time }
        error: { type: string }
    MetaAgentWork:
      type: object
      description: 服务端经 SDK input.text 传递的工作请求，使用 bridge 身份鉴别
      required: [workflow, action, jobId, requirement]
      properties:
        workflow: { type: boolean }
        action: { type: string, enum: [DRAFT, EVAL, DELIVER, REVIEW] }
        jobId: { type: string }
        requirement: { type: object, additionalProperties: true }
        draft: { type: object, additionalProperties: true }
        feedback: { type: string }
        catalog: { type: array, items: { type: object, additionalProperties: true } }
        snapshot: { type: object, additionalProperties: true }
    DevflowSeedCase:
      type: object
      required: [caseId, input, expected, tags]
      properties:
        caseId: { type: string }
        input: { type: object, additionalProperties: true }
        expected: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
    DevflowReview:
      type: object
      description: 关口处理页数据。按 gate 只填对应的字段，其余省略。隐藏考题只有条数和分数
      required: [jobId, gate]
      properties:
        jobId: { type: string, example: DF-0018 }
        gate:
          type: string
          enum: [H1, H2, H4, PR]
          description: PR 为人机协作等人工 approve PR
        execution: { $ref: "#/components/schemas/DevflowExecution" }
        runId: { type: string, nullable: true, description: H1 / H2 恢复用 }
        approvalId: { type: string, nullable: true, description: H4 决策用 }
        specSheet:
          type: object
          description: H1 需求单
          required: [title, goal, users, io, success, pending]
          properties:
            title: { type: string }
            goal: { type: string }
            users: { type: string }
            io: { type: string }
            success: { type: string }
            pending:
              type: array
              items: { type: string }
              description: 待确认事项
        suggestedMode:
          allOf:
            - $ref: "#/components/schemas/DevflowMode"
          nullable: true
          description: H1。spec-agent 建议的开发模式
        manifestYaml: { type: string, nullable: true, description: H1。agent.yaml 草稿 }
        authList:
          type: array
          description: H1。H3 会发给所有者
          items:
            type: object
            required: [resource, risk, owner]
            properties:
              resource: { type: string, example: "kb:dev-standards" }
              risk: { $ref: "#/components/schemas/Risk" }
              owner: { type: string }
        seedInputRequired: { type: boolean, description: S2 需要人工上传种子用例 }
        minSeed: { type: integer, description: S2 最少人工种子用例数 }
        humanCount: { type: integer, nullable: true, description: H2。人给用例条数 }
        holdoutRatio: { type: number, format: float, nullable: true, description: H2。0 到 1 }
        cases:
          type: array
          description: H2。eval-agent 扩充的用例，不含隐藏考题
          items:
            type: object
            required: [caseId, tag, input, expected, reason]
            properties:
              caseId: { type: string }
              tag: { type: string }
              input: { type: string }
              expected: { type: string }
              reason: { type: string, description: 扩充理由；价值低的由 eval-agent 在这里写明 }
        gateReport:
          type: object
          description: H4 门禁报告
          required: [visible, holdout, minScore, byTag]
          properties:
            visible: { type: number, format: float }
            holdout: { type: number, format: float, description: 隐藏考题独立计分 }
            minScore: { type: number, format: float }
            byTag:
              type: array
              items:
                type: object
                required: [tag, visible, holdout]
                properties:
                  tag: { type: string }
                  visible: { type: number, format: float }
                  holdout: { type: number, format: float }
        ownership:
          type: object
          description: H4。上线后它将拥有
          required: [agent, version, tools, dailyBudgetCny, agentCommits, humanCommits]
          properties:
            agent: { type: string }
            version: { type: string }
            tools:
              type: array
              items: { type: string }
            dailyBudgetCny: { type: number, format: float }
            agentCommits: { type: integer }
            humanCommits: { type: integer }
        pr:
          type: object
          description: PR 协作 review。approve 在 Git 托管里完成
          required: [number, url, additions, deletions, files, reviewSummary, sandboxSummary]
          properties:
            number: { type: integer }
            url: { type: string }
            additions: { type: integer }
            deletions: { type: integer }
            files: { type: integer }
            reviewSummary: { type: string }
            sandboxSummary: { type: string }
