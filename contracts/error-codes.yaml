# Keel 全平台错误码 · keel/v1
#
# 格式 {模块}_{原因}。代码里不允许写字面量错误码，一律从生成的枚举读。
# 错误体统一 {code, message, trace_id, retryable}。retryable 由本文件给出，
# SDK 和网关直接读，不要各自判断。
# SSE 中出错发 event: error，不直接断连。
#
# 新增错误码是非破坏性的（加字段/加条目）；改已有条目的 retryable 是破坏性的，要升 v2。

version: keel/v1

codes:
  # ── keel-server 通用 ────────────────────────────────────────────
  SERVER_INVALID_PARAM:
    message: 请求参数不合法
    retryable: false
    http: 400

  SERVER_NOT_FOUND:
    message: 资源不存在
    retryable: false
    http: 404

  SERVER_INTERNAL_ERROR:
    message: 服务内部错误
    retryable: true
    http: 500

  # ── keel-gateway ────────────────────────────────────────────────
  GW_QUOTA_EXCEEDED:
    message: 配额已用完
    retryable: true
    http: 429
    note: 三维令牌桶（用户 / 组织 / 智能体）任一维度超限

  GW_CONCURRENCY_LIMIT:
    message: 并发连接数达到上限
    retryable: true
    http: 429
    note: 挂起中的 run 不占并发位，网关转发 suspend 事件时释放

  GW_AGENT_OFFLINE:
    message: 智能体当前不可用
    retryable: true
    http: 503
    note: 无就绪实例或心跳超 45 秒

  # ── 工具 ────────────────────────────────────────────────────────
  TOOL_NOT_GRANTED:
    message: 智能体没有该工具的使用授权
    retryable: false
    http: 403
    note: manifest 里未声明，或共享工具未授权

  TOOL_RETIRED:
    message: 工具已下线
    retryable: false
    http: 410
    note: 废弃期内照常可调用，只在 span 打 keel.tool.deprecated=true

  TOOL_TIMEOUT:
    message: 工具调用超时
    retryable: true
    http: 504

  TOOL_HAS_PROD_DEPENDENTS:
    message: 工具仍有 prod 依赖方，不能直接下线
    retryable: false
    http: 409
    note: 只能先废弃（给替代工具和截止日期），依赖方迁走后再下线

  # ── 审批 ────────────────────────────────────────────────────────
  APPROVAL_REJECTED:
    message: 审批被驳回
    retryable: false
    http: 403

  APPROVAL_EXPIRED:
    message: 审批超时未处理
    retryable: false
    http: 408
    note: 超过 approval_policy.timeout_minutes，run 一并置 EXPIRED

  # ── 运行生命周期 ────────────────────────────────────────────────
  RUN_NOT_FOUND:
    message: 找不到该次执行
    retryable: false
    http: 404

  RUN_NOT_RESUMABLE:
    message: 该次执行不处于可恢复状态
    retryable: false
    http: 409
    note: 只有 SUSPENDED 能恢复；RUNNING / DONE / FAILED 都拒绝

  RUN_EXPIRED:
    message: 该次执行已超过截止时间
    retryable: false
    http: 410

  RUN_RESUME_DENIED:
    message: 无法恢复执行，凭据已失效
    retryable: false
    http: 401
    note: 换票 token 过期（600 秒）、用户会话失效且无委托 token。提示用户重新发起，不要静默降级

  # ── 审计 ────────────────────────────────────────────────────────
  AUDIT_WRITE_FAILED:
    message: 审计写入失败，操作已拒绝
    retryable: true
    http: 503
    note: 高风险动作同步写失败时业务必须失败，不允许 catch 后继续

  # ── 护栏 ────────────────────────────────────────────────────────
  GUARD_INJECTION_BLOCKED:
    message: 输入被提示词注入检测拦截
    retryable: false
    http: 400
    note: 仅 enforce 模式拦截；shadow 模式只标注不拦

  # ── 委派 ────────────────────────────────────────────────────────
  DELEGATE_NOT_DECLARED:
    message: 目标智能体未在 manifest 的 delegates 中声明
    retryable: false
    http: 403
