name: keel
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        env:
          KEEL_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn -s ci/settings.xml -B test
      - name: Package
        env:
          KEEL_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn -s ci/settings.xml -B -DskipTests package
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the keel CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          version="$(cat .keel-sdk-version)"
          mkdir -p vendor
          gh release download "sdk-v${version}" --repo dezhiguan/keel --pattern "keel_sdk-${version}-py3-none-any.whl" --dir vendor
          python -m pip install "vendor/keel_sdk-${version}-py3-none-any.whl"
      - name: Gate
        env:
          KEEL_SERVER_URL: ${{ vars.KEEL_SERVER_URL }}
        run: |
          java -jar target/app.jar --server.port=8080 &
          for attempt in $(seq 1 50); do
            if python -c 'import socket; socket.create_connection(("127.0.0.1", 8080), 1).close()'; then break; fi
            sleep 0.2
          done
          python -c 'import socket; socket.create_connection(("127.0.0.1", 8080), 1).close()'
          keel gate --env staging
      - name: Build the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build -t "$image" .
          echo "image=$image" >> "$GITHUB_ENV"
      - name: Register and release staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEEL_SERVER_URL: ${{ vars.KEEL_SERVER_URL }}
        run: |
          keel register --env staging
          keel release --env staging --image "$image"
