apiVersion: keel/v1
kind: Agent
metadata:
  name: {{name}}
spec:
  kind: workflow
  runtime:
    endpoint: http://127.0.0.1:8000
  knowledge:
    - kb: demo-kb
  models:
    default: qwen-plus
  prompts:
    source: local
    items:
      - name: answer
        type: text
  eval:
    dataset: {{name}}/answers
    evaluators: [citation_present]
