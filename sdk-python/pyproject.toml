[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-sdk"
version = "0.1.0"
description = "Keel 智能体 SDK：运行时、CLI、keel-lite、keel-gate 同一个包"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "starlette>=0.40", "PyYAML>=6", "jsonschema>=4",
                "httpx>=0.27", "opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30",
                "opentelemetry-proto>=1.30", "opentelemetry-exporter-otlp-proto-common>=1.30"]

[project.optional-dependencies]
# Langfuse SDK is only allowed in keel/eval and keel/gate.
eval = ["langfuse>=4.7.0"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]

[project.scripts]
keel = "keel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.hatch.build.targets.wheel.force-include]
"../contracts/manifest.schema.json" = "keel/_schemas/manifest.schema.json"
"../contracts/invoke.openapi.yaml" = "keel/_schemas/invoke.openapi.yaml"
