[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-sdk"
version = "0.1.0"
description = "Keel 智能体 SDK：运行时、CLI、keel-lite、keel-gate 同一个包"
requires-python = ">=3.11"
# TODO(P0-6): pin runtime dependencies (pydantic v2, httpx, opentelemetry-sdk, OTLP/HTTP exporter) when the skeleton lands.
dependencies = []

[project.optional-dependencies]
# Langfuse SDK is only allowed in keel/eval and keel/gate.
eval = ["langfuse>=4.7.0"]

[project.scripts]
keel = "keel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["keel"]
